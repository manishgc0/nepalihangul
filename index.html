/* Final consonant -> Devanagari coda. Cluster finals collapse to the sound
   that is actually pronounced, which is what the book's own romanisation
   does too (닭 is "dak", not "dalg"). */
const BOOK_FIN = {
  "ㄱ":"क्", "ㄲ":"क्", "ㄳ":"क्स्", "ㄴ":"न्", "ㄵ":"न्ज्", "ㄶ":"न्ह्",
  "ㄷ":"त्", "ㄹ":"ल्", "ㄺ":"क्", "ㄻ":"म्", "ㄼ":"ल्", "ㄽ":"ल्",
  "ㄾ":"ल्", "ㄿ":"प्", "ㅀ":"ल्", "ㅁ":"म्", "ㅂ":"प्", "ㅄ":"प्स्",
  "ㅅ":"त्", "ㅆ":"त्", "ㅇ":"ङ्", "ㅈ":"त्", "ㅊ":"त्", "ㅋ":"क्",
  "ㅌ":"त्", "ㅍ":"प्", "ㅎ":"त्"
};

/* Whole-word Devanagari: decompose each syllable into CI/VI/FI, read the body
   with bkRead, hang the coda off the end. Spaces and punctuation pass through
   untouched so multi-word entries like 건강 보험 stay readable. */
function bkWord(s) {
  let out = "";
  for (let i = 0; i < s.length; i++) {
    const code = s.charCodeAt(i);
    if (code < 0xAC00 || code > 0xD7A3) { out += s.charAt(i); continue; }
    const n = code - 0xAC00;
    const ci = Math.floor(n / 588);
    const vi = Math.floor((n % 588) / 28);
    const fi = n % 28;
    let dev = bkRead(CI[ci], VI[vi]);
    if (fi) dev += (BOOK_FIN[FI[fi]] || "");
    out += dev;
  }
  return out;
}

/* Canonical initial order, and the two sections the scan does not contain. */
const BK_DICT_ORDER = ["ㄱ","ㄴ","ㄷ","ㄹ","ㅁ","ㅂ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ",
                       "ㄲ","ㄸ","ㅃ","ㅉ"];
const BK_DICT_GONE = ["ㄹ"];

let BK_DICT_Q = "";
let BK_DICT_LET = "";
let BK_DICT_CAP = 60;

function bkDictData() { return BK_DICT; }

/* A Hangul syllable does not start with a jamo, so the initial has to be
   pulled out of the code point the same way bkWord pulls it apart. */
function bkInit(s) {
  const c = s.charCodeAt(0);
  if (c < 0xAC00 || c > 0xD7A3) return "";
  return CI[Math.floor((c - 0xAC00) / 588)];
}

function bkDictHit(r) {
  if (BK_DICT_LET && bkInit(r[1]) !== BK_DICT_LET) return false;
  const q = BK_DICT_Q.trim().toLowerCase();
  if (!q) return true;
  if (r[1].indexOf(q) >= 0) return true;
  if (r[2].indexOf(BK_DICT_Q.trim()) >= 0) return true;
  if (r[3].toLowerCase().indexOf(q) >= 0) return true;
  if (bkWord(r[1]).indexOf(BK_DICT_Q.trim()) >= 0) return true;
  return false;
}

function bkDictSetLet(l) {
  BK_DICT_MODE = "word";
  BK_DICT_LET = (BK_DICT_LET === l ? "" : l);
  BK_DICT_CAP = 60;
  const chips = document.querySelectorAll(".bk-dchip");
  for (let i = 0; i < chips.length; i++) {
    const on = chips[i].textContent.indexOf(BK_DICT_LET) === 0 && BK_DICT_LET !== "";
    chips[i].classList.toggle("on", on);
  }
  bkDictPaint();
}

function bkDictSearch(v) { BK_DICT_Q = v; BK_DICT_CAP = 60; bkDictPaint(); }

function bkDictMore() { BK_DICT_CAP += 80; bkDictPaint(); }

function bkDictClear() {
  BK_DICT_Q = ""; BK_DICT_LET = ""; BK_DICT_CAP = 60;
  const inp = document.getElementById("bkDictQ");
  if (inp) inp.value = "";
  const chips = document.querySelectorAll(".bk-dchip");
  for (let i = 0; i < chips.length; i++) chips[i].classList.remove("on");
  bkDictPaint();
}

/* Four tables share this screen: the dictionary, its synonym half, its antonym
   half, and the thematic word lists. Same row shape (page, korean, nepali,
   english), same search, same list — only the source array and the filters
   change. The dictionary filters by initial consonant; the thematic lists
   filter by section; the pair tables have neither. */
let BK_DICT_MODE = "word";
let BK_DICT_SEC = "";

function bkDictRows() {
  if (BK_DICT_MODE === "syn") return BK_SYN;
  if (BK_DICT_MODE === "ant") return BK_ANT;
  if (BK_DICT_MODE === "use") return BK_USE;
  return BK_DICT;
}

/* The pair rows print two or more words per line ("곧/바로", "곧 - 천천히").
   Speaking the whole line reads the separator aloud, so the tap speaks the
   first word only. Headwords — 건강 보험, 주사를 맞다 — stay whole. */
function bkSpeak(r) {
  if (BK_DICT_MODE === "word" || BK_DICT_MODE === "use") return r[1];
  return r[1].split(/\s+-\s+|\//)[0].replace(/[()]/g, "").trim();
}

/* The row shows the reading of every word it prints, not just the first one —
   a half-read pair would look like the second word has no pronunciation. */
function bkDev(s) {
  if (BK_DICT_MODE === "word" || BK_DICT_MODE === "use") return bkWord(s);
  return s.split(/(\s+-\s+|\/)/).map(function (piece, i) {
    return i % 2 ? piece : bkWord(piece);
  }).join("");
}

function bkDictHit(r) {
  if (BK_DICT_MODE === "use") {
    if (BK_DICT_SEC && r[5] !== BK_DICT_SEC) return false;
  } else if (BK_DICT_LET && bkInit(r[1]) !== BK_DICT_LET) {
    return false;
  }
  const q = BK_DICT_Q.trim().toLowerCase();
  if (!q) return true;
  if (r[1].indexOf(q) >= 0) return true;
  if (r[2].indexOf(BK_DICT_Q.trim()) >= 0) return true;
  if (r[3].toLowerCase().indexOf(q) >= 0) return true;
  if (bkWord(r[1]).indexOf(BK_DICT_Q.trim()) >= 0) return true;
  return false;
}

function bkDictSetMode(m) {
  BK_DICT_MODE = m;
  BK_DICT_Q = "";
  BK_DICT_LET = "";
  BK_DICT_SEC = "";
  BK_DICT_CAP = 60;
  renderApp();
}

function bkDictSetLet(l) {
  BK_DICT_MODE = "word";
  BK_DICT_LET = (BK_DICT_LET === l ? "" : l);
  BK_DICT_CAP = 60;
  const chips = document.querySelectorAll(".bk-dchip");
  for (let i = 0; i < chips.length; i++) {
    const on = chips[i].textContent.indexOf(BK_DICT_LET) === 0 && BK_DICT_LET !== "";
    chips[i].classList.toggle("on", on);
  }
  bkDictPaint();
}

function bkDictSetSec(k) {
  BK_DICT_SEC = k; BK_DICT_CAP = 60;
  const sel = document.querySelector(".bk-dsel");
  if (sel && sel.value !== k) sel.value = k;
  bkDictPaint();
}

function bkDictSearch(v) { BK_DICT_Q = v; BK_DICT_CAP = 60; bkDictPaint(); }

function bkDictMore() { BK_DICT_CAP += 80; bkDictPaint(); }

function bkDictClear() {
  BK_DICT_Q = ""; BK_DICT_LET = ""; BK_DICT_CAP = 60;
  const inp = document.getElementById("bkDictQ");
  if (inp) inp.value = "";
  const chips = document.querySelectorAll(".bk-dchip");
  for (let i = 0; i < chips.length; i++) chips[i].classList.remove("on");
  bkDictPaint();
}

function bkDictPaint() {
  const box = document.getElementById("bkDictList");
  if (!box) return;
  const data = bkDictRows();
  const hits = data.filter(bkDictHit);
  const shown = hits.slice(0, BK_DICT_CAP);

  const count = document.getElementById("bkDictCount");
  if (count) count.textContent = hits.length + " / " + data.length;

  const rows = shown.map(function (r) {
    const sp = bkSpeak(r).replace(/'/g, "\\'");
    return '<button type="button" class="bk-drow" onclick="say(\'' + sp + '\', this)">' +
      '<span class="bk-d-ko ko" lang="ko">' + r[1] + '</span>' +
      '<span class="bk-d-dev">' + bkDev(r[1]) + '</span>' +
      '<span class="bk-d-pg">p' + r[0] + '</span>' +
      '<span class="bk-d-ne">' + r[2] + ' <i>' + r[3] + '</i>' +
      (r[4] ? '<b class="bk-d-g" title="' +
        (r[4] === "f" ? (LANG === "ne" ? "महिलाले भन्ने" : "a woman says this")
                      : (LANG === "ne" ? "पुरुषले भन्ने" : "a man says this")) +
        '">' + (r[4] === "f" ? "*" : "•") + '</b>' : "") +
      '</span>' +
      '</button>';
  }).join("");

  box.innerHTML = shown.length
    ? '<div class="bk-drows">' + rows + '</div>' +
      (hits.length > shown.length
        ? '<button type="button" class="bk-more" onclick="bkDictMore()">' +
          (LANG === "ne" ? "थप " + (hits.length - shown.length) + " देखाउनु" : "Show " + (hits.length - shown.length) + " more") +
          '</button>'
        : "")
    : '<p class="bk-note bk-dempty">' +
      (LANG === "ne" ? "यो खोजीमा केही भेटिएन।" : "Nothing matched that search.") + '</p>';
}

function bkDict() {
  const present = {};
  BK_DICT.forEach(function (r) { const k = bkInit(r[1]); present[k] = (present[k] || 0) + 1; });

  const chips = BK_DICT_ORDER.map(function (l) {
    const n = present[l] || 0;
    const on = BK_DICT_LET === l;
    if (!n) {
      return '<button type="button" class="bk-dchip gone" disabled title="' +
        (LANG === "ne" ? "यो अक्षरको पाना स्क्यानमा छैन" : "This section is not in the scan") + '">' + l + '</button>';
    }
    return '<button type="button" class="bk-dchip' + (on ? " on" : "") + '" onclick="bkDictSetLet(\'' + l + '\')">' +
      l + '<i>' + n + '</i></button>';
  }).join("");

  /* 22 sections do not fit a chip row, and a chip row that scrolls sideways
     hides the one section a learner wants. A picker is smaller and honest. */
  const secCount = {};
  BK_USE.forEach(function (r) { secCount[r[5]] = (secCount[r[5]] || 0) + 1; });
  const secs = '<option value="">' +
    (LANG === "ne" ? "सबै " + BK_USE.length + " शब्द" : "All " + BK_USE.length + " words") + '</option>' +
    BK_USE_SEC.map(function (s) {
      return '<option value="' + s[0] + '"' + (BK_DICT_SEC === s[0] ? " selected" : "") + '>' +
        s[1] + " (" + (secCount[s[0]] || 0) + ')</option>';
    }).join("");

  const modes = [
    ["word", LANG === "ne" ? "शब्दकोश" : "Dictionary", BK_DICT.length],
    ["use", LANG === "ne" ? "उपयोगी शब्द" : "Word lists", BK_USE.length],
    ["syn", LANG === "ne" ? "समानार्थी" : "Synonyms", BK_SYN.length],
    ["ant", LANG === "ne" ? "विपरीत" : "Antonyms", BK_ANT.length]
  ].map(function (m) {
    return '<button type="button" class="bk-dmode' + (BK_DICT_MODE === m[0] ? " on" : "") + '" ' +
      'onclick="bkDictSetMode(\'' + m[0] + '\')">' + m[1] + '<i>' + m[2] + '</i></button>';
  }).join("");

  const HEAD = {
    word: [LANG === "ne" ? "कोरियन–नेपाली शब्दकोश" : "Korean–Nepali dictionary", "CS1 p189–233"],
    use: [LANG === "ne" ? "केही उपयोगी शब्दार्थ" : "Thematic word lists", "CS1 p128–161"],
    syn: [LANG === "ne" ? "समानार्थी शब्द" : "Synonyms", "CS1 p114–120"],
    ant: [LANG === "ne" ? "विपरीतार्थी शब्द" : "Antonyms", "CS1 p121–127"]
  }[BK_DICT_MODE];

  const NOTE = {
    word: LANG === "ne"
      ? "पुस्तकको आधा भाग व्याकरण होइन — यो शब्दकोश हो। " + BK_DICT.length + " शब्द हातले टाइप गरिएका छन्, छापिएको पृष्ठ नम्बरसहित। जुन अक्षरबाट शब्द सुरु हुन्छ त्यसमा थिच्नुहोस्, वा तल खोज्नुहोस्।"
      : "Half of the 239-page scan is not grammar — it is a dictionary. " + BK_DICT.length + " entries typed by hand, each tagged with its printed page. Tap an initial, or search below.",
    use: LANG === "ne"
      ? "पुस्तकको बीचको भाग विषयअनुसार मिलाइएको शब्दभण्डार हो — " + BK_USE_SEC.length + " समूह, " + BK_USE.length + " शब्द, पृष्ठ १२८–१६१। माथिको सूचीबाट विषय छान्नुहोस् वा जहाँसुकै खोज्नुहोस्।"
      : "The middle of the book is vocabulary sorted by topic — " + BK_USE_SEC.length + " groups, " + BK_USE.length + " words, pp. 128–161. Pick a topic above, or search across all of them.",
    syn: LANG === "ne"
      ? "एउटै अर्थ दिने दुई वा दुईभन्दा बढी शब्द। " + BK_SYN.length + " पङ्क्ति, पृष्ठ ११४–१२० बाट। जहाँ पुस्तकले एउटै शब्द दुईचोटि छापेको छ (p114 को 깎다) त्यो एकचोटि मात्र राखिएको छ।"

      : "Pairs of words that mean the opposite. " + BK_ANT.length + " pairs from pp. 121–127. The pairs are printed as the book sets them; the tap speaks only the first word."
  }[BK_DICT_MODE];

  return `
    <h2 class="bk-h">${HEAD[0]} <span class="bk-src">${HEAD[1]}</span></h2>

    <div class="bk-dmodes">${modes}</div>

    <p class="bk-note">${NOTE}</p>

    <div class="bk-dsearch">
      <input id="bkDictQ" type="search" inputmode="search" autocomplete="off"
        placeholder="${LANG === "ne" ? "कोरियन, नेपाली वा अंग्रेजीमा खोज्नुहोस्" : "Search Korean, Nepali or English"}"
        oninput="bkDictSearch(this.value)" value="${BK_DICT_Q.replace(/"/g, "&quot;")}">
      <button type="button" class="bk-dclear" onclick="bkDictClear()" aria-label="${LANG === "ne" ? "खाली गर्नुहोस्" : "Clear"}">✕</button>
    </div>

    ${BK_DICT_MODE === "word" ? '<div class="bk-dchips">' + chips + '</div>' : ""}
    ${BK_DICT_MODE === "use" ? '<select class="bk-dsel" onchange="bkDictSetSec(this.value)" aria-label="' +
      (LANG === "ne" ? "विषय छान्नुहोस्" : "Pick a topic") + '">' + secs + '</select>' : ""}

    <p class="bk-dmeta">
      <span id="bkDictCount"></span>
      <span class="bk-dgone">${BK_DICT_MODE === "word"
        ? (LANG === "ne" ? "ㄹ खण्ड स्क्यानमै छैन" : "The ㄹ section is not in the scan")
        : (LANG === "ne" ? "थिचेर उच्चारण सुन्नुहोस्" : "Tap a row to hear it")}</span>
    </p>

    <div id="bkDictList"></div>

    <p class="bk-note bk-prov">${LANG === "ne"
      ? "पुस्तकको उच्चारण कोलम (रोमन) यहाँ छैन — यसको सट्टा पुस्तककै १९×२१ ग्रिडबाट देवनागरी निकालिएको छ, जुन नेपाली पाठकका लागि बढी काम लाग्छ। अन्त्यको व्यञ्जन पुस्तककै नियमअनुसार (ㅂ→प्, ㅇ→ङ्); 닭 जस्ता जोडा व्यञ्जन बोलिने आवाजमै खुम्च्याइएका छन्।"
      : "The book's romanisation column is deliberately not reproduced; Devanagari is derived from its own 19×21 grid instead, which serves a Nepali reader better. Codas follow the book's rules (ㅂ→प्, ㅇ→ङ्), and cluster finals collapse to the pronounced sound the way 닭 becomes 'dak'."}</p>

    ${BK_DICT_MODE === "use" ? bkUseLegend() : ""}
  `;
}

/* CS1 pp.162-178 — the sign boards and the picture pages. These are not
   vocabulary rows: each card is a whole sentence printed on a board, and the
   value is seeing the Korean, its Devanagari reading and the Nepali side by
   side. So they get cards, not the dictionary's one-line rows. */
let BK_SIGN_GRP = "";
let BK_SIGN_Q = "";
let BK_SIGN_CAP = 48;

function bkSignHit(r) {
  if (BK_SIGN_GRP && r[1] !== BK_SIGN_GRP) return false;
  const q = BK_SIGN_Q.trim().toLowerCase();
  if (!q) return true;
  if (r[2].indexOf(q) >= 0) return true;
  if (r[3].toLowerCase().indexOf(q) >= 0) return true;
  if (r[4].indexOf(BK_SIGN_Q.trim()) >= 0) return true;
  if (bkWord(r[2]).indexOf(BK_SIGN_Q.trim()) >= 0) return true;
  return false;
}

function bkSignSetGrp(g) {
  BK_SIGN_GRP = (BK_SIGN_GRP === g ? "" : g);
  BK_SIGN_CAP = 48;
  renderApp();
}

function bkSignSearch(v) { BK_SIGN_Q = v; BK_SIGN_CAP = 48; bkSignPaint(); }
function bkSignMore() { BK_SIGN_CAP += 48; bkSignPaint(); }

function bkSignSpeak(r) { return r[3] || r[2]; }

function bkSignPaint() {
  const box = document.getElementById("bkSignList");
  if (!box) return;
  const hits = BK_SIGN.filter(bkSignHit);
  const shown = hits.slice(0, BK_SIGN_CAP);

  const count = document.getElementById("bkSignCount");
  if (count) count.textContent = hits.length + " / " + BK_SIGN.length;

  const cards = shown.map(function (r) {
    const sp = bkSignSpeak(r).replace(/'/g, "\\'");
    const sent = (r[3] && r[3] !== r[2])
      ? '<span class="bk-s-ko ko" lang="ko">' + r[3] + '</span>'
      : "";
    /* A blank Nepali column is not an empty card — it is the book printing its
       own Korean and Nepali on top of each other until neither reads. Say so. */
    const ne = r[4]
      ? '<span class="bk-s-ne">' + r[4] + '</span>'
      : '<span class="bk-s-ne bk-s-nil">' +
        (LANG === "ne" ? "पुस्तकमा यो लेबल पढ्न सकिएन" : "This label is unreadable in the scan") +
        '</span>';
    return '<button type="button" class="bk-scard" onclick="say(\'' + sp + '\', this)">' +
      '<span class="bk-s-top">' +
        '<span class="bk-s-sign ko" lang="ko">' + r[2] + '</span>' +
        '<span class="bk-s-pg">p' + r[0] + '</span>' +
      '</span>' +
      sent + ne +
      '</button>';
  }).join("");

  box.innerHTML = shown.length
    ? '<div class="bk-sgrid">' + cards + '</div>' +
      (hits.length > shown.length
        ? '<button type="button" class="bk-more" onclick="bkSignMore()">' +
          (LANG === "ne" ? "थप " + (hits.length - shown.length) + " देखाउनु" : "Show " + (hits.length - shown.length) + " more") +
          '</button>'
        : "")
    : '<p class="bk-note bk-dempty">' +
      (LANG === "ne" ? "यो खोजीमा केही भेटिएन।" : "Nothing matched that search.") + '</p>';
}

function bkSigns() {
  const grpCount = {};
  BK_SIGN.forEach(function (r) { grpCount[r[1]] = (grpCount[r[1]] || 0) + 1; });

  const chips = BK_SIGN_SEC.map(function (s) {
    const on = BK_SIGN_GRP === s[0];
    return '<button type="button" class="bk-dchip bk-wchip' + (on ? " on" : "") + '" ' +
      'onclick="bkSignSetGrp(\'' + s[0] + '\')">' + s[1] + '<i>' + (grpCount[s[0]] || 0) + '</i></button>';
  }).join("");

  const unreadable = BK_SIGN.filter(function (r) { return !r[4]; }).length;

  return `
    <h2 class="bk-h">${LANG === "ne" ? "सङ्केत बोर्डहरु" : "Sign boards"} <span class="bk-src">CS1 p162–178</span></h2>

    <p class="bk-note">${LANG === "ne"
      ? "पुस्तकको अन्तिम खण्डमा " + (grpCount["sign"] || 0) + " वटा साइन बोर्ड र " + (grpCount["pic"] || 0) + " वटा चित्र छन्। हरेकमा बोर्डमा छापिएको कोरियन र पुस्तककै नेपाली अर्थ। थिच्नुहोस् — बोर्डमा लेखिएको वाक्य बोलिन्छ। यहाँ देवनागरी उच्चारण जानाजान छोडिएको छ: ग्रिडले एउटा शब्द राम्ररी पढ्छ, तर वाक्य पढ्दा अक्षर जोडिएर अप्ठ्यारो हुन्छ — त्यसका लागि शब्दकोश पर्दा छ।"
      : "The last block of the book is " + (grpCount["sign"] || 0) + " sign boards and " + (grpCount["pic"] || 0) + " pictures. Each card carries the Korean as printed and the book's own Nepali. Tap one — it speaks the sentence on the board. The Devanagari reading is deliberately left off here: the grid reads a word cleanly, but across a whole sentence the letters run together — the dictionary tab is where the reading lives."}</p>

    <div class="bk-dsearch">
      <input id="bkSignQ" type="search" inputmode="search" autocomplete="off"
        placeholder="${LANG === "ne" ? "कोरियन, नेपाली वा अंग्रेजीमा खोज्नुहोस्" : "Search Korean, Nepali or English"}"
        oninput="bkSignSearch(this.value)" value="${BK_SIGN_Q.replace(/"/g, "&quot;")}">
      <button type="button" class="bk-dclear" onclick="bkSignSearch('');document.getElementById('bkSignQ').value=''"
        aria-label="${LANG === "ne" ? "खाली गर्नुहोस्" : "Clear"}">✕</button>
    </div>

    <div class="bk-dchips">${chips}</div>

    <p class="bk-dmeta">
      <span id="bkSignCount"></span>
      <span class="bk-dgone">${LANG === "ne" ? "थिचेर सुन्नुहोस्" : "Tap to hear it"}</span>
    </p>

    <div id="bkSignList"></div>

    <p class="bk-note bk-prov">${LANG === "ne"
      ? "पृष्ठ १७६–१७७ मा पुस्तकले आफ्नै कोरियन र नेपाली कोलम एकअर्कामाथि छापेको छ, त्यसैले " + unreadable + " वटा लेबल पढ्नै सकिँदैन — ती अनुमान गरिएका छैनन्, खाली छाडिएका छन्। बाँकी सबै जस्ताको तस्तै छ।"
      : "On pp. 176–177 the book prints its Korean and Nepali columns on top of each other, so " + unreadable + " labels cannot be read at all — those are left blank rather than guessed. Everything else is as printed."}</p>
    ${bkSignFixes()}
  `;
}

/* The sign block has real printing faults, and several of them invert what the
   board says. They are corrected on the card and listed here — copying them
   would teach the wrong instruction, and fixing them off-screen would be a
   quiet lie about the source. */
function bkSignFixes() {
  const f = LANG === "ne"
    ? [
        "p163 — कार्डमा बोर्ड '출입금지' छ तर वाक्य धुम्रपानको छ; त्यो वाक्य p163 कै 금연 कार्डकै हो। दुवै जस्ताको तस्तै राखिएका छन्।",
        "p163 — 'फुटेको सामान नहरु भएकोले होसियार' मा 'नहरु' अतिरिक्त शब्द हो; यहाँ हटाइएको छ। p168 — 'भ्याइमा' होइन, भर्याङमा।",
        "p170 — '보행금 구역' होइन, 보행금지 구역; '과계자외출입금지' होइन, 관계자외출입금지। p174 — '안전머' होइन, 안전벨트।",
        "p172 — 'ढोकामा आड लाग्नुहोस्' मा नकारात्मक 'न' छुटेको छ; बोर्डको अर्थ उल्टो हुन्थ्यो, त्यसैले नलाग्नुहोस् राखिएको छ।",
        "p173 — 'सायातिर माथि जानुहोस्' मा 'साया' टाइपो हो; दाहिनेतिर भन्न खोजिएको हो। 'चाहेमागन' होइन, चाहेमा।",
        "p174 — 'मनुत दा' जस्ता छपाइका अंश हटाइएका छन्; अर्थ बदलिएको छैन। p166 — '동근틀' सम्भवतः 동력톱/원형톱 हो।",
        "p176–177 — यी दुई पृष्ठमा कोरियन र नेपाली कोलम एकअर्कामाथि छापिएका छन्; ७ वटा लेबल पढ्नै सकिँदैन र खाली छाडिएका छन्।"
      ]
    : [
        "p163 — the board reads 출입금지 but the sentence under it is about smoking; that sentence belongs to the 금연 card on the same page. Both are kept as printed.",
        "p163 — 'फुटेको सामान नहरु भएकोले होसियार' carries a stray 'नहरु'; it is dropped here. p168 — भ्याइमा should be भर्याङमा.",
        "p170 — 보행금 구역 should be 보행금지 구역; 과계자외출입금지 should be 관계자외출입금지. p174 — 안전머 should be 안전벨트.",
        "p172 — 'ढोकामा आड लाग्नुहोस्' is missing its negative; as printed the sign says the opposite, so नलाग्नुहोस् is used.",
        "p173 — 'सायातिर माथि जानुहोस्' has साया for दाहिने; 'चाहेमागन' should be चाहेमा.",
        "p174 — printing debris such as 'मनुत दा' is dropped; no meaning is changed. p166 — 동근틀 is probably 동력톱 or 원형톱.",
        "p176–177 — on these two pages the Korean and Nepali columns are printed on top of each other; 7 labels cannot be read and are left blank."
      ];

  return `
    <details class="bk-fix">
      <summary>${LANG === "ne"
        ? "पुस्तकका गल्ती र छपाइका दोष (" + f.length + ")"
        : "Printing faults and corrections (" + f.length + ")"}</summary>
      <ul>${f.map(function (x) { return "<li>" + x + "</li>"; }).join("")}</ul>

}

/* The family table marks some terms with a star and some with a bullet, and
   says on the page that one is what a woman says and the other what a man

function bkUseLegend() {
  const fixes = LANG === "ne"
    ? [
        "p128 — 오전/오후 को नेपाली कोलम उल्टो छापिएको छ (오전 = अपराह्न, 오후 = पूर्वाह्न)। यहाँ सही जोडी राखिएको छ।",
        "p129 — 내팔 टाइपो हो; सही 네팔 राखिएको छ।",
        "p132 — 사위 को अंग्रेजी 'Daughter in law' गलत; सही son-in-law। 조카딸 'Nephew' होइन, niece।",
        "p134 — 헥소 अंग्रेजी hacksaw को ट्रान्सलिटरेशन हो; कोरियनमा 쇠톱 हुन्छ। 정기 드릴 होइन, 전기 드릴।",
        "p137 — 젓가락 को अंग्रेजी 'Fork' गलत; chopsticks हो। p138 — 믹서기 'Mixture' होइन, blender।",
        "p139 — 먼지떨이 'Dust hair' होइन, duster। p140 — 작자 होइन, 작가; 과장 को नेपाली निर्देशक होइन, शाखा प्रमुख।",
        "p145 — 'Istituion' टाइपो; p148 — 여행 'Visit' भन्दा travel; p150 — 파 'Onion' होइन, green onion। p151 — 막걸리 को अंग्रेजीमा 'form' होइन, from।",
        "p160 — 스님 को अंग्रेजी 'Father' गलत; Buddhist monk हो। p161 — 주홍색 को नेपाली बैजनी (purple) होइन।"
      ]
    : [
        "p128 — the Nepali column has 오전/오후 swapped (오전 printed as अपराह्न, 오후 as पूर्वाह्न). The correct pair is shown here.",
        "p129 — 내팔 is a typo; 네팔 is used.",
        "p132 — 사위 is glossed 'Daughter in law'; it is son-in-law. 조카딸 is glossed 'Nephew'; it is niece.",
        "p134 — 헥소 is a transliteration of 'hacksaw'; the Korean word is 쇠톱. 정기 드릴 should be 전기 드릴.",
        "p137 — 젓가락 is glossed 'Fork'; it is chopsticks. p138 — 믹서기 is glossed 'Mixture'; it is a blender.",
        "p139 — 먼지떨이 is glossed 'Dust hair'; it is a duster. p140 — 작자 should be 작가; 과장 is a section chief, not a director.",
        "p145 — 'Istituion' is a typo. p148 — 여행 is travel rather than 'Visit'. p150 — 파 is a green onion, not an onion. p151 — 막걸리 is glossed 'Liquor made form rice'; from.",
        "p160 — 스님 is glossed 'Father'; it is a Buddhist monk. p161 — 주홍색 is scarlet, not बैजनी (purple)."
      ];

  return `
    <details class="bk-fix">
      <summary>${LANG === "ne"
        ? "* = महिलाले भन्ने शब्द, • = पुरुषले भन्ने शब्द · पुस्तकका गल्ती (" + fixes.length + ")"
        : "* = a woman says it, • = a man says it · corrections (" + fixes.length + ")"}</summary>
      <ul>${fixes.map(function (f) { return "<li>" + f + "</li>"; }).join("")}</ul>
    </details>
  `;
}

function bkGRow(r) {
  return '<button type="button" class="bk-grow" onclick="say(\'' + r[0] + '\', this)">' +
    '<span class="bk-g-ko">' + r[0] + '</span>' +
    '<span class="bk-g-dev">' + r[1] + '</span>' +
    '<span class="bk-g-ne">' + r[2] + '</span>' +
    (r[3] ? '<span class="bk-g-tag">' + r[3] + '</span>' : '') +
    '</button>';
}

function bkGrammar() {
  const core = BK_GRAM.map(function (s) {
    return `
      <section class="bk-rule">
        <header>
          <h3>${s.h}</h3>
          <span class="bk-src">${s.src}</span>
        </header>
        <p>${s.ne}</p>
        <div class="bk-grows">${s.rows.map(bkGRow).join("")}</div>
      </section>`;
  }).join("");

  const tense = BK_TENSE.map(function (t) {
    const rows = t.rows.map(function (r) {
      return '<button type="button" class="bk-trow" onclick="say(\'' + r[1] + '\', this)">' +
        '<span class="bk-t-lab">' + r[0] + '</span>' +
        '<span class="bk-t-ko">' + r[1] + '</span>' +
        '<span class="bk-t-dev">' + r[2] + '</span></button>';
    }).join("");
    return `<details class="bk-det">
      <summary><b>${t.v}</b> <span>${t.ne}</span><i>६</i></summary>
      <div class="bk-trows">${rows}</div>
    </details>`;
  }).join("");

  const irreg = BK_IRREG.map(function (c) {
    const rows = c.rows.map(function (r) {
      return '<button type="button" class="bk-irow" onclick="say(\'' + r[1] + '\', this)">' +
        '<span class="bk-i-dict">' + r[0] + '</span>' +
        '<span class="bk-i-arrow">→</span>' +
        '<span class="bk-i-conj">' + r[1] + '</span>' +
        '<span class="bk-i-dev">' + r[2] + '</span>' +
        '<span class="bk-i-ne">' + r[3] + '</span></button>';
    }).join("");
    return `<details class="bk-det">
      <summary><b>${c.h}</b> <span>${c.key}</span><i>${c.rows.length}</i></summary>
      <p class="bk-det-ne">${c.ne}</p>
      <div class="bk-irows">${rows}</div>
    </details>`;
  }).join("");

  const conj = BK_CONJ.map(function (c) {
    return `
      <section class="bk-rule bk-conj">
        <header>

        <p>${c.ne}</p>
        <button type="button" class="bk-grow" onclick="say('${c.ko}', this)">
          <span class="bk-g-ko">${c.ko}</span>
          <span class="bk-g-dev">${c.dev}</span>
          <span class="bk-g-ne">${c.ex}</span>
        </button>
      </section>`;
  }).join("");

  return `
    <h2 class="bk-h">${LANG === "ne" ? "क्रियापद र वाक्य" : "Verbs and sentences"}
      <span class="bk-src">CS1 p46–67</span></h2>
    ${core}

    <h2 class="bk-h">${LANG === "ne" ? "छ प्रकारको काल" : "The six tenses"}
      <span class="bk-src">CS1 p68</span></h2>
    <p class="bk-note">${LANG === "ne"
      ? "पुस्तकको ठूलो तालिका यहाँ क्रियाअनुसार फेरिएको छ — फोनमा सात कोलम अट्दैन, तर जानकारी उही हो। कुनै क्रियामा थिच्नुहोस्।"
      : "The book's wide table, rotated so a verb is the card and the tenses are the rows. Same six forms, readable at 390px."}</p>
    ${tense}

    <h2 class="bk-h">${LANG === "ne" ? "सात अनियमित क्रिया" : "Seven irregular classes"}
      <span class="bk-src">CS1 p69–75</span></h2>
    <p class="bk-note">${LANG === "ne"
      ? "यी क्रियाहरू नियम मान्दैनन् — डाँठ नै बदलिन्छ। हरेक समूह खोल्नुहोस्; तलको रूप थिच्दा उच्चारण सुनिन्छ। तारा चिह्न लागेका क्रिया पुस्तकमा अपवादका रूपमा राखिएका छन्।"
      : "These verbs change the stem before a vowel ending. Open a class; tap a form to hear it. The starred verbs are the exceptions the book flags."}</p>
    ${irreg}

    <h2 class="bk-h">${LANG === "ne" ? "सोह्र संयोजक" : "Sixteen conjunctions"}
      <span class="bk-src">CS1 p76–79</span></h2>
    ${conj}

    <p class="bk-note bk-prov">${LANG === "ne"
      ? "यो पाना CS1 का छापिएका पृष्ठ ४६–७९ बाट टाइप गरिएको हो। देवनागरी उच्चारण पुस्तककै १९×२१ ग्रिड र पृष्ठ ११ का उच्चारण नियमअनुसार राखिएको छ — जस्तै अन्त्यको ㅂ 'प्', ㅇ 'ङ्'। पुस्तकमा भएका सबै वाक्य यहाँ छैनन्; हरेक खण्डको नमुना मात्र।"
      : "Typed from printed pages 46–79 of CS1. The Devanagari follows the book's own 19×21 grid and the sound rules on p11 — final ㅂ is प्, final ㅇ is ङ्. Not every sentence in the book is here; each section carries its paradigm, not the whole chapter."}</p>
  `;
}

function viewBooks() {
  const tabs = [
    ["letters", LANG === "ne" ? "वर्णमाला" : "Alphabet"],
    ["rules",   LANG === "ne" ? "उच्चारण नियम" : "Sound rules"],
    ["counters",LANG === "ne" ? "गणना" : "Counters"],

let _pianoAudioCtx = null;
// Seven accidentals for C major over the 10 white keys (C4..E5).
// left = boundary percentage minus half the 5% key width.
const PIANO_BLACK_KEYS = [
  { pitch: "C#4", freq: 277.18, left: 7.7  },
  { pitch: "D#4", freq: 311.13, left: 17.5 },

function pressAccidental(freq, pitch) {
  const el = document.querySelector('.piano-black-key[data-pitch="' + pitch + '"]');
  if (el) {
    el.classList.add("pressed");
    setTimeout(() => el.classList.remove("pressed"), 200);
  }
  // black keys are tone-only: no Korean word, so no voice tier
  if (PIANO_SOUND_MODE !== "voice") playPianoTone(freq);
}

function getPianoAudioCtx() {
  if (!_pianoAudioCtx) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) _pianoAudioCtx = new AudioCtx();
  }
  if (_pianoAudioCtx && _pianoAudioCtx.state === "suspended") {
    _pianoAudioCtx.resume().catch(function() {});
  }
  return _pianoAudioCtx;
}

function playPianoTone(freq) {
  try {
    const ctx = getPianoAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;

    const masterGain = ctx.createGain();
    masterGain.connect(ctx.destination);
    masterGain.gain.setValueAtTime(0.0001, now);
    masterGain.gain.linearRampToValueAtTime(0.35, now + 0.006);
    masterGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.25);

    // Fundamental (sine)
    const osc1 = ctx.createOscillator();
    osc1.type = "sine";
    osc1.frequency.setValueAtTime(freq, now);

    // Harmonic 2 (triangle: piano body resonance)
    const osc2 = ctx.createOscillator();
    osc2.type = "triangle";
    osc2.frequency.setValueAtTime(freq * 2, now);
    const g2 = ctx.createGain();
    g2.gain.setValueAtTime(0.28, now);
    g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);
    osc2.connect(g2);
    g2.connect(masterGain);

    // Harmonic 3 (bright chime)
    const osc3 = ctx.createOscillator();
    osc3.type = "sine";
    osc3.frequency.setValueAtTime(freq * 3, now);
    const g3 = ctx.createGain();
    g3.gain.setValueAtTime(0.12, now);
    g3.gain.exponentialRampToValueAtTime(0.0001, now + 0.45);
    osc3.connect(g3);
    g3.connect(masterGain);

    osc1.connect(masterGain);

    osc1.start(now);
    osc2.start(now);
    osc3.start(now);
    osc1.stop(now + 1.3);
    osc2.stop(now + 0.75);
    osc3.stop(now + 0.5);
  } catch (e) {}
}

function pressPianoKey(num, isAuto) {
  const keys = PIANO_KEYS_DATA[CURRENT_NUM_MODE] || PIANO_KEYS_DATA["S"];
  const kd = keys.find(k => k.num === num) || keys[num - 1];
  if (!kd) return;

  // Visual active press feedback
  const keyEl = document.getElementById("pianoKey_" + num);
  if (keyEl) {
    keyEl.classList.add("pressed");
    setTimeout(() => keyEl.classList.remove("pressed"), 220);
  }

  // Update LED display
  const dispKo = document.getElementById("pdispKo");
  const dispTitle = document.getElementById("pdispTitle");
  const dispSub = document.getElementById("pdispSub");
  const dispNote = document.getElementById("pdispNote");
  const dispFreq = document.getElementById("pdispFreq");

  if (dispKo) {
    dispKo.textContent = kd.ko;
    dispKo.style.transform = "scale(1.2)";
    setTimeout(() => { if (dispKo) dispKo.style.transform = "scale(1)"; }, 180);
  }
  if (dispTitle) {
    dispTitle.innerHTML = `<span>${kd.num}. ${kd.ko} (${kd.ne})</span> <span class="pdisp-tag">${kd.rom}</span>`;
  }
  if (dispSub) {
    dispSub.textContent = `${kd.tip} • [${kd.tag}]`;
  }
  if (dispNote) {
    dispNote.textContent = `${kd.note} (${kd.pitch})`;
  }
  if (dispFreq) {
    dispFreq.textContent = `${kd.freq.toFixed(1)} Hz`;
  }

  // Sound playback
  if (PIANO_SOUND_MODE === "both" || PIANO_SOUND_MODE === "tone") {
    playPianoTone(kd.freq);
  }
  if (PIANO_SOUND_MODE === "both" || PIANO_SOUND_MODE === "voice") {
    say(kd.ko, keyEl);
  }

  // Add to melody history tracker
  if (!isAuto) {
    PIANO_HISTORY.push({ num: kd.num, ko: kd.ko, ne: kd.ne, pitch: kd.pitch });
    if (PIANO_HISTORY.length > 8) PIANO_HISTORY.shift();
    updatePianoHistoryUI();
  }

  // Quiz evaluation
  if (PIANO_QUIZ_ACTIVE && PIANO_QUIZ_TARGET !== null && !isAuto) {
    const qBox = document.getElementById("pianoQuizBox");
    if (kd.num === PIANO_QUIZ_TARGET) {
      playSfx("correct");
      if (typeof addXp === "function") addXp(10, "silent");
      if (qBox) {
        qBox.innerHTML = `
          <div class="piano-quiz-txt" style="color:var(--sage)">
            🎉 <b>सबास! ठीक उत्तर!</b> ${kd.num} = <b>${kd.ko}</b> (${kd.ne}) • +10 XP!
          </div>
          <button type="button" class="piano-quiz-btn" onclick="startPianoQuiz()">अर्को प्रश्न →</button>
        `;
      }
      PIANO_QUIZ_TARGET = null;
      setTimeout(() => { if (PIANO_QUIZ_ACTIVE) startPianoQuiz(); }, 1600);
    } else {
      if (qBox) {
        qBox.innerHTML = `
          <div class="piano-quiz-txt" style="color:#d9534f">
            ❌ <b>फेरि प्रयास गर्नुहोस्!</b> तपाईंले <b>${kd.ko}</b> (${kd.ne}) थिच्नुभयो।
          </div>
          <button type="button" class="piano-quiz-btn" onclick="replayPianoQuizSound()">🎧 आवाज फेरि सुन्नुहोस्</button>
        `;
      }
    }
  }
}

    </span>
  `).join("");
}

function replayPianoHistory() {
  if (!PIANO_HISTORY.length) return;
  const seq = PIANO_HISTORY.map(h => h.num);
  playPianoSequence(seq, 520);
}

function clearPianoHistory() {
  PIANO_HISTORY = [];
  updatePianoHistoryUI();
}

function playPianoSequence(steps, delayMs, onDone) {
  stopPianoSequence();
  let idx = 0;
  function step() {
    if (idx >= steps.length) {
      stopPianoSequence();
      if (onDone) onDone();
      return;
    }
    const n = steps[idx];
    if (n != null) {
      pressPianoKey(n, true);
    }
    idx++;
    PIANO_SONG_TIMER = setTimeout(step, delayMs || 650);
  }
  step();
}

function stopPianoSequence() {
  if (PIANO_SONG_TIMER) {
    clearTimeout(PIANO_SONG_TIMER);
    PIANO_SONG_TIMER = null;
  }

function startPianoQuiz() {
  PIANO_QUIZ_ACTIVE = true;
  stopPianoSequence();
  const keys = PIANO_KEYS_DATA[CURRENT_NUM_MODE] || PIANO_KEYS_DATA["S"];
  const randKey = keys[Math.floor(Math.random() * keys.length)];
  PIANO_QUIZ_TARGET = randKey.num;

  const qBox = document.getElementById("pianoQuizBox");
  if (qBox) {
    qBox.style.display = "flex";
    qBox.innerHTML = `
      <div class="piano-quiz-txt">
        🎧 <b>ध्यान दिएर सुन्नुहोस्:</b> कुन नम्बर बोलियो? पियानोको सही कुञ्जी थिच्नुहोस्!

      </div>
    `;
  }
  setTimeout(() => say(randKey.ko), 200);
}

function replayPianoQuizSound() {
  if (PIANO_QUIZ_TARGET == null) return;
  const keys = PIANO_KEYS_DATA[CURRENT_NUM_MODE] || PIANO_KEYS_DATA["S"];
  const kd = keys.find(k => k.num === PIANO_QUIZ_TARGET);
  if (kd) say(kd.ko);
}

function stopPianoQuiz() {
  PIANO_QUIZ_ACTIVE = false;
  PIANO_QUIZ_TARGET = null;
  const qBox = document.getElementById("pianoQuizBox");
  if (qBox) qBox.style.display = "none";
}

// Step 10: Quiz & Evaluation
let QUIZ_SCORE = 0;
let QUIZ_CURRENT = 0;
let QUIZ_LOCKED = false;
let QUIZ_ITEMS = [];
let QUIZ_DONE = false;
let QUIZ_STARTED = false;
let QUIZ_MODE = "letters";
let QUIZ_MISSED = [];
const QUIZ_SIZE = 10;
let QUIZ_BEST = (() => {
  try {
    return {
      letters: parseInt(localStorage.getItem("hangul_quiz_best_letters") || "0", 10) || 0,
      pictures: parseInt(localStorage.getItem("hangul_quiz_best_pictures") || "0", 10) || 0,
      lesson: parseInt(localStorage.getItem("hangul_quiz_best_lesson") || "0", 10) || 0
    };
  } catch (e) {
    return { letters: 0, pictures: 0, lesson: 0 };
  }
})();

function quizModeLabel(mode) {
  if (mode === "pictures") return LANG === "ne" ? "चित्र शब्द" : "Picture words";
  if (mode === "lesson") {
    const u = sjUnitData(sjUnit());
    return LANG === "ne"
      ? (u ? `सेजोङ पाठ ${sjNeNum(u.u)}` : "सेजोङ १A · सबै")
      : (u ? `Sejong unit ${u.u}` : "Sejong 1A · all");
  }
  return LANG === "ne" ? "अक्षर सुनाइ" : "Letter listening";
}

function quizBestText(mode) {
  const best = QUIZ_BEST[mode] || 0;
  if (!best) return LANG === "ne" ? "अहिलेसम्म प्रयास गरिएको छैन" : "Not attempted yet";
  return LANG === "ne" ? `उत्कृष्ट नतिजा: ${best}/100` : `Best score: ${best}/100`;
}

/* One lookup for "what does this Korean word mean". The vocabulary screen, the
   picture quiz and the arcade each used to answer that question with their own
   private table; a Sejong word that lives in none of them rendered blank. */
function glossOf(ko) {
  const w = VOCAB_WORDS.find(x => x.ko === ko);
  if (w) return LANG === "ne" ? w.ne : w.en;
  const g = arcGlossMap();
  return g[ko] || "";
}

      </div>
      <p style="margin:8px 0 0">
        ${QUIZ_MODE === "pictures"
          ? (great
              ? (LANG === "ne" ? "उत्कृष्ट! यी शब्दहरू अब लामो समयसम्म सम्झनुहुनेछ।" : "Excellent! You will remember these words for a long time.")
              : (LANG === "ne" ? "राम्रो प्रयास! तलका शब्द दोहोर्याएर बलियो बनाउनुहोस्।" : "Good try! Review the words below to strengthen them."))
          : (great
              ? (LANG === "ne" ? "उत्कृष्ट! तपाईं अब हाङ्गुल पढ्न तयार हुनुहुन्छ।" : "Excellent! You can read Hangul now.")
              : (LANG === "ne" ? "राम्रो प्रयास! एक फेरा दोहोर्याएर अझ बलियो बन्नुहोस्।" : "Good try! Run it once more to lock it in."))}
      </p>

      <div class="meter">

    <div class="flow-actions">

function viewQuiz() {
  if (!QUIZ_STARTED) return viewQuizChooser();
  if (QUIZ_DONE) return viewQuizResult();
  const q = QUIZ_ITEMS[QUIZ_CURRENT];
  if (!q) { QUIZ_DONE = true; updateQuizBest(); return viewQuizResult(); }

  const progress = Math.round((QUIZ_CURRENT / QUIZ_SIZE) * 100);
  const isPicture = QUIZ_MODE === "pictures";
  const isLesson = QUIZ_MODE === "lesson";
  const word = isPicture ? VOCAB_WORDS.find(w => w.ko === q.answer) : null;
  const imageSrc = word && word.image ? word.image : "";
  const meaning = word ? (LANG === "ne" ? word.ne : word.en) : (q.prompt || glossOf(q.answer));

  return `
    ${renderBrandBar()}
    ${renderNavHeader(10, "क्विज", "Self-Quiz")}
    <h1 class="title quiz-title">
      ${isPicture
        ? (LANG === "ne" ? 'चित्रबाट <em>शब्द</em> चिन्नुहोस्' : 'Picture <em>Word Quiz</em>')
        : isLesson
          ? (LANG === "ne" ? 'अर्थ पढेर <em>कोरियन शब्द</em> छान्नुहोस्' : 'Read the meaning, pick the <em>Korean word</em>')
          : (LANG === "ne" ? 'सुनाइ तथा <em>अक्षर परीक्षा</em>' : 'Listening & <em>Character Quiz</em>')}
    </h1>
    <div class="hero quiz-hero">
      <small>${quizModeLabel(QUIZ_MODE)} · ${LANG === "ne" ? `प्रश्न (${QUIZ_CURRENT + 1} / ${QUIZ_SIZE})` : `Question (${QUIZ_CURRENT + 1} / ${QUIZ_SIZE})`}</small>
      <div class="hv">${QUIZ_SCORE} ${LANG === "ne" ? "अंक" : "Pts"}</div>
      <div class="meter">
        <div><i style="width:${progress}%"></i></div>
        <b>${progress}%</b>
      </div>
    </div>

    ${isPicture ? `
      <div class="pic-frame ${imageSrc ? "" : "missing"}">
        ${imageSrc ? `<img src="${imageSrc}" alt="${meaning}" decoding="async" onerror="this.closest('.pic-frame').classList.add('missing')">` : ""}
        <div class="pic-fallback">
          <span class="pic-emoji" aria-hidden="true">${word ? word.emoji : "🖼️"}</span>
          <small>${LANG === "ne" ? "तस्बिर थपिन बाँकी" : "Image coming soon"}</small>
        </div>
      </div>
      <p class="pic-caption">
        ${meaning}
        <small>${LANG === "ne" ? word.en : word.ne}</small>
      </p>
      <p class="quiz-prompt">
        ${LANG === "ne" ? "चित्र हेरेर सही कोरियन शब्द छान्नुहोस्:" : "Look at the picture and choose the correct Korean word:"}
      </p>
    ` : isLesson ? `
      <div class="quiz-meaning">
        <small>${LANG === "ne" ? "यो अर्थ दिने शब्द कुन हो?" : "Which word carries this meaning?"}</small>
        <b>${meaning}</b>
      </div>
      <p class="quiz-prompt">
        ${LANG === "ne" ? "तलको कोरियन शब्द छान्नुहोस्:" : "Choose the Korean word below:"}
      </p>
    ` : `
      <div style="text-align:center;margin:18px 0 10px">
        <p class="quiz-prompt">
          ${LANG === "ne" ? "आवाज सुन्नुहोस् र सही अक्षर रोज्नुहोस्:" : "Listen to audio and select the matching Hangul:"}
        </p>
        <button class="flow-btn" style="margin:10px auto;width:auto;padding:10px 22px" onclick="say('${q.answer}')">
          ${LANG === "ne" ? "उच्चारण सुन्नुहोस्" : "Play Sound"}
        </button>
      </div>
      ${renderSpeedBar(q.answer)}
    `}

    <div class="grid ${isPicture ? "pic-grid" : ""}">
      ${q.options.map(opt => `
        <button class="opt ko" lang="ko" onclick="checkQuizAnswer(this, '${opt}', '${q.answer}')">
          ${opt}
        </button>
      `).join("")}
    </div>

    <p id="quizStatus" class="quiz-status" role="status" aria-live="polite"></p>

        ${LANG === "ne" ? "मार्गचित्रमा फर्कनुहोस्" : "Return to Roadmap"}
      </button>
    </div>
  `;
}

function startQuiz(mode) {
  QUIZ_MODE = (mode === "pictures" || mode === "lesson") ? mode : "letters";
  QUIZ_STARTED = true;
  QUIZ_ITEMS = [];
  QUIZ_SCORE = 0;
  QUIZ_CURRENT = 0;
  QUIZ_LOCKED = false;
  QUIZ_DONE = false;
  QUIZ_MISSED = [];

  if (QUIZ_MODE === "pictures") {
    const pool = VOCAB_WORDS.filter(w => w.pic);
    const selected = [...pool].sort(() => Math.random() - 0.5).slice(0, QUIZ_SIZE);
    selected.forEach(w => {
      const opts = [w.ko];
      while (opts.length < 3 && opts.length < pool.length) {
        const r = pool[Math.floor(Math.random() * pool.length)].ko;
        if (!opts.includes(r)) opts.push(r);
      }
      opts.sort(() => Math.random() - 0.5);
      QUIZ_ITEMS.push({ answer: w.ko, options: opts });
    });
    return;
  }

  /* Lesson quiz: the Sejong unit the learner selected, in the direction that
     forces recall — Nepali meaning in, Korean word out. Falls back to the whole
     book when a unit is too thin to build distractors from. */
  if (QUIZ_MODE === "lesson") {
    let pool = sjWordsOf(sjUnit()).filter(([ko, ne]) => /^[가-힣]+$/.test(ko) && ne);
    if (pool.length < 4) pool = sjWordsOf(0).filter(([ko, ne]) => /^[가-힣]+$/.test(ko) && ne);
    const selected = [...pool].sort(() => Math.random() - 0.5).slice(0, QUIZ_SIZE);
    selected.forEach(([ko, ne]) => {
      const opts = [ko];
      while (opts.length < 3) {
        const r = pool[Math.floor(Math.random() * pool.length)][0];
        if (!opts.includes(r)) opts.push(r);
      }
      opts.sort(() => Math.random() - 0.5);
      QUIZ_ITEMS.push({ answer: ko, options: opts, prompt: ne });
    });
    return;
  }

  const pool = ["ㄱ","ㄴ","ㄷ","ㄹ","ㅁ","ㅂ","ㅅ","ㅇ","ㅈ","ㅎ","ㅏ","ㅓ","ㅗ","ㅜ","ㅡ","ㅣ","가","나","다","라"];
  for (let i = 0; i < QUIZ_SIZE; i++) {
    const ans = pool[Math.floor(Math.random() * pool.length)];
    const opts = [ans];
    while (opts.length < 3) {
      const r = pool[Math.floor(Math.random() * pool.length)];
      if (!opts.includes(r)) opts.push(r);
    }
    opts.sort(() => Math.random() - 0.5);
    QUIZ_ITEMS.push({ answer: ans, options: opts });
  }
}

function updateQuizBest() {
  if ((QUIZ_BEST[QUIZ_MODE] || 0) < QUIZ_SCORE) {
    QUIZ_BEST[QUIZ_MODE] = QUIZ_SCORE;
    try { localStorage.setItem("hangul_quiz_best_" + QUIZ_MODE, String(QUIZ_SCORE)); } catch (e) {}
  }
}

function resetQuizChoice() {
  QUIZ_STARTED = false;
  QUIZ_DONE = false;
  QUIZ_ITEMS = [];
  QUIZ_CURRENT = 0;
  QUIZ_SCORE = 0;
  QUIZ_MISSED = [];
  QUIZ_LOCKED = false;
  renderApp();
}

function checkQuizAnswer(btn, sel, correct) {
  if (QUIZ_LOCKED) return;
  QUIZ_LOCKED = true;
  const status = document.getElementById("quizStatus");
  const word = VOCAB_WORDS.find(w => w.ko === correct);
  const meaning = word ? (LANG === "ne" ? word.ne : word.en) : glossOf(correct);

  if (sel === correct) {
    btn.classList.add("ok");
    QUIZ_SCORE += 10;
    playSfx("correct", 0.5);
    addXp(4, "silent");
    trackGame("correct");
    if (status) status.textContent = LANG === "ne"
      ? `सही! ${correct}${meaning ? ` — ${meaning}` : ""}`
      : `Correct! ${correct}${meaning ? ` — ${meaning}` : ""}`;
  } else {
    btn.classList.add("bad");
    playSfx("wrong", 0.45);
    const right = [...document.querySelectorAll(".opt")].find(o => o.textContent.trim() === correct);
    if (right) right.classList.add("ok");
    const missed = word || { ko: correct, ne: glossOf(correct), en: glossOf(correct) };
    if (!QUIZ_MISSED.some(x => x.ko === missed.ko)) QUIZ_MISSED.push(missed);
    if (status) status.textContent = LANG === "ne"
      ? `सही उत्तर ${correct}${meaning ? ` (${meaning})` : ""} हो।`
      : `Not quite — the correct answer is ${correct}${meaning ? ` (${meaning})` : ""}.`;
  }

  // Hearing the answer again strengthens the sound–meaning link. Both word
  // quizzes get it, and only after the answer is locked — a "hear it" button
  // before the choice would have been the answer key sitting on the table.
  if (QUIZ_MODE === "pictures" || QUIZ_MODE === "lesson") say(correct);

  setTimeout(() => {
    QUIZ_CURRENT++;
    QUIZ_LOCKED = false;
    if (QUIZ_CURRENT >= QUIZ_SIZE) {
      QUIZ_DONE = true;
      updateQuizBest();
      finishQuizGame();
    }
    renderApp();
  }, 1400);
}

/* ========================================================
   STEP 9: WRITING STUDIO — stroke order, and a real score

   This canvas used to be a sheet of paper: draw, clear, next. Nothing ever
   looked at the ink. Step 9 was the only step in the ten-step path with no
   pass condition, which is a strange thing to hand a learner on the one
   skill that has an objectively correct answer.

   Hangul stroke order is fully specified and small — forty jamo, one to six
   strokes each. That is a data table, not a model, so this is a data table:
   WS_JAMO below, every point in a 100 x 100 box. A syllable is decomposed
   into its initial / medial / final indices and each part is fitted into its
   slot in the block, so 가 and 밥 run the same code path as ㅏ and ㅂ.

   Scoring is coverage and precision against the guide path, measured in both
   directions: a single dot in the middle fails coverage, a shaky line that
   stays on the stroke passes, and line thickness is not punished because the
   mask is a path, not pixels. Pass is 60 and the number is on screen, not
   hidden.
   ======================================================== */

const WS_TOL = 13;    // 13% of the box — about a finger-width of slop
const WS_PASS = 60;   // per-stroke; the character score is the mean

/* An ellipse as a polyline. ㅇ is written clockwise from the top. */
function wsEllipse(cx, cy, rx, ry) {
  const pts = [];
  for (let i = 0; i <= 28; i++) {
    const a = -Math.PI / 2 + (i / 28) * Math.PI * 2;
    pts.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]);
  }
  return pts;
}

/* Forty jamo, in the order a Korean child learns them. Compound vowels are
   composed from their parts below rather than typed out twice. */
const WS_JAMO = {
  /* --- 14 basic consonants --- */
  "ㄱ": [[[16, 26], [84, 26], [84, 88]]],
  "ㄴ": [[[16, 22], [16, 82], [86, 82]]],
  "ㄷ": [[[84, 22], [16, 22], [16, 82], [84, 82]]],
  "ㄹ": [[[16, 24], [84, 24]],
         [[16, 24], [16, 52], [84, 52]],
         [[84, 52], [84, 82], [16, 82]]],
  "ㅁ": [[[20, 20], [20, 82]],
         [[20, 20], [82, 20], [82, 82]],
         [[82, 82], [20, 82]]],
  "ㅂ": [[[24, 16], [24, 86]],
         [[76, 16], [76, 86]],
         [[24, 50], [76, 50]],
         [[24, 86], [76, 86]]],
  "ㅅ": [[[52, 18], [18, 86]],
         [[52, 18], [86, 84]]],
  "ㅇ": [wsEllipse(50, 52, 33, 35)],
  "ㅈ": [[[16, 22], [84, 22]],
         [[50, 22], [16, 88]],
         [[50, 22], [84, 88]]],
  "ㅊ": [[[50, 8], [50, 20]],
         [[16, 26], [84, 26]],
         [[50, 26], [18, 90]],
         [[50, 26], [82, 90]]],
  "ㅋ": [[[16, 26], [84, 26], [84, 88]],
         [[16, 56], [84, 56]]],
  "ㅌ": [[[84, 24], [16, 24]],
         [[16, 24], [16, 84], [84, 84]],
         [[16, 54], [84, 54]]],
  "ㅍ": [[[26, 18], [26, 88]],
         [[74, 18], [74, 88]],
         [[12, 18], [88, 18]],
         [[12, 88], [88, 88]]],
  "ㅎ": [[[50, 6], [50, 18]],
         [[18, 30], [82, 30]],
         wsEllipse(50, 62, 26, 22)],

  /* --- 5 tense consonants: the base letter, twice --- */
  "ㄲ": [[[8, 26], [44, 26], [44, 88]],
         [[56, 26], [92, 26], [92, 88]]],
  "ㄸ": [[[44, 22], [8, 22], [8, 82], [44, 82]],
         [[92, 22], [56, 22], [56, 82], [92, 82]]],
  "ㅃ": [[[16, 16], [16, 86]],
         [[36, 16], [36, 86]],
         [[64, 16], [64, 86]],
         [[84, 16], [84, 86]],
         [[16, 50], [84, 50]],
         [[16, 86], [84, 86]]],
  "ㅆ": [[[30, 18], [6, 86]],
         [[30, 18], [48, 84]],
         [[70, 18], [52, 86]],
         [[70, 18], [94, 84]]],
  "ㅉ": [[[4, 22], [46, 22]],
         [[25, 22], [6, 88]],
         [[25, 22], [44, 88]],
         [[54, 22], [96, 22]],
         [[75, 22], [56, 88]],
         [[75, 22], [94, 88]]],

  /* --- 10 basic vowels --- */
  "ㅏ": [[[54, 12], [54, 88]], [[54, 50], [88, 50]]],
  "ㅑ": [[[54, 12], [54, 88]], [[54, 34], [88, 34]], [[54, 62], [88, 62]]],
  "ㅓ": [[[14, 50], [46, 50]], [[46, 12], [46, 88]]],
  "ㅕ": [[[14, 34], [46, 34]], [[14, 62], [46, 62]], [[46, 12], [46, 88]]],
  "ㅗ": [[[50, 44], [50, 80]], [[12, 80], [88, 80]]],
  "ㅛ": [[[34, 44], [34, 80]], [[66, 44], [66, 80]], [[12, 80], [88, 80]]],
  "ㅜ": [[[12, 50], [88, 50]], [[50, 50], [50, 90]]],
  "ㅠ": [[[12, 50], [88, 50]], [[34, 50], [34, 90]], [[66, 50], [66, 90]]],
  "ㅡ": [[[12, 52], [88, 52]]],
  "ㅣ": [[[52, 10], [52, 90]]]
};

/* Fit a stroke set into a slot of the block. Aspect is preserved, because a
   stretched ㅏ is a different letter. */
function wsFit(strokes, box) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  strokes.forEach(s => s.forEach(p => {
    if (p[0] < x0) x0 = p[0];
    if (p[0] > x1) x1 = p[0];
    if (p[1] < y0) y0 = p[1];
    if (p[1] > y1) y1 = p[1];
  }));
  const bw = Math.max(1, x1 - x0), bh = Math.max(1, y1 - y0);
  const k = Math.min((box.x1 - box.x0) / bw, (box.y1 - box.y0) / bh);
  const ox = box.x0 + ((box.x1 - box.x0) - bw * k) / 2 - x0 * k;
  const oy = box.y0 + ((box.y1 - box.y0) - bh * k) / 2 - y0 * k;
  return strokes.map(s => s.map(p => [p[0] * k + ox, p[1] * k + oy]));
}

/* Compound vowels are their two parts, fitted side by side or stacked. This
   is the same composition rule the books print, so the studio and the
   reference shelf cannot disagree about what ㅘ is. */
function wsCompose(parts) {
  const out = [];
  parts.forEach(function (p) {
    wsFit(WS_JAMO[p.j], p.box).forEach(s => out.push(s));
  });
  return out;
}

(function () {
  const V = { x0: 4, x1: 96, y0: 4, y1: 96 };
  const left = { x0: 4, x1: 58, y0: 6, y1: 94 };
  const right = { x0: 64, x1: 96, y0: 6, y1: 94 };
  const top = { x0: 10, x1: 90, y0: 6, y1: 50 };
  const bot = { x0: 6, x1: 94, y0: 48, y1: 94 };
  const l2 = { x0: 4, x1: 56, y0: 6, y1: 94 };
  const r2 = { x0: 60, x1: 96, y0: 6, y1: 94 };

  WS_JAMO["ㅐ"] = wsCompose([{ j: "ㅏ", box: left }, { j: "ㅣ", box: right }]);
  WS_JAMO["ㅒ"] = wsCompose([{ j: "ㅑ", box: left }, { j: "ㅣ", box: right }]);
  WS_JAMO["ㅔ"] = wsCompose([{ j: "ㅓ", box: l2 }, { j: "ㅣ", box: r2 }]);
  WS_JAMO["ㅖ"] = wsCompose([{ j: "ㅕ", box: l2 }, { j: "ㅣ", box: r2 }]);

  WS_JAMO["ㅙ"] = wsCompose([{ j: "ㅗ", box: top }, { j: "ㅐ", box: bot }]);
  WS_JAMO["ㅚ"] = wsCompose([{ j: "ㅗ", box: top }, { j: "ㅣ", box: bot }]);
  WS_JAMO["ㅝ"] = wsCompose([{ j: "ㅜ", box: top }, { j: "ㅓ", box: bot }]);
  WS_JAMO["ㅞ"] = wsCompose([{ j: "ㅜ", box: top }, { j: "ㅔ", box: bot }]);
  WS_JAMO["ㅟ"] = wsCompose([{ j: "ㅜ", box: top }, { j: "ㅣ", box: bot }]);
  WS_JAMO["ㅢ"] = wsCompose([{ j: "ㅡ", box: top }, { j: "ㅣ", box: bot }]);
})();

/* Canonical learning order — the "next" button walks this instead of picking
   a random string, so arriving from the vowels screen with ㅏ and pressing
   next gives ㅑ, not 밥. */
const WS_ORDER = ["ㄱ","ㄴ","ㄷ","ㄹ","ㅁ","ㅂ","ㅅ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ",
                  "ㄲ","ㄸ","ㅃ","ㅆ","ㅉ",
                  "ㅏ","ㅑ","ㅓ","ㅕ","ㅗ","ㅛ","ㅜ","ㅠ","ㅡ","ㅣ",
                  "ㅐ","ㅒ","ㅔ","ㅖ","ㅘ","ㅙ","ㅚ","ㅝ","ㅞ","ㅟ","ㅢ"];

const WS_V_VERT = ["ㅏ","ㅐ","ㅑ","ㅒ","ㅓ","ㅔ","ㅕ","ㅖ","ㅣ"];
const WS_V_HORZ = ["ㅗ","ㅛ","ㅜ","ㅠ","ㅡ"];
const WS_V_MIX  = ["ㅘ","ㅙ","ㅚ","ㅝ","ㅞ","ㅟ","ㅢ"];

/* Target character -> ordered list of guide strokes. A bare jamo fills the
   block; a syllable is laid out by the shape of its vowel. */
function wsStrokesFor(ch) {
  if (!ch) return [];
  if (WS_JAMO[ch]) return WS_JAMO[ch].slice();

  const code = ch.charCodeAt(0) - 0xAC00;
  if (code < 0 || code > 11171) return [];
  const ci = Math.floor(code / 588);
  const vi = Math.floor((code % 588) / 28);
  const fi = code % 28;
  const c = CI[ci], v = VI[vi], f = FI[fi];

  const mainY1 = f ? 64 : 96;
  let cBox, vBox;

  if (WS_V_VERT.indexOf(v) >= 0) {
    cBox = { x0: 6, x1: 54, y0: 6, y1: mainY1 };
    vBox = { x0: 56, x1: 96, y0: 6, y1: mainY1 };
  } else if (WS_V_HORZ.indexOf(v) >= 0) {
    cBox = { x0: 20, x1: 80, y0: 6, y1: mainY1 * 0.52 };
    vBox = { x0: 6, x1: 94, y0: mainY1 * 0.48, y1: mainY1 };
  } else {
    cBox = { x0: 6, x1: 46, y0: 6, y1: mainY1 * 0.66 };
    vBox = { x0: 48, x1: 96, y0: 6, y1: mainY1 };
  }

  const out = [];
  if (c !== "ㅇ") wsFit(WS_JAMO[c] || [], cBox).forEach(s => out.push(s));
  else wsFit(WS_JAMO["ㅇ"], cBox).forEach(s => out.push(s));
  wsFit(WS_JAMO[v] || [], vBox).forEach(s => out.push(s));
  if (f) {
    const fBase = f === "ㄲ" ? "ㄱ" : f === "ㅆ" ? "ㅅ" : f;
    const src = WS_JAMO[fBase] || WS_JAMO["ㅇ"];
    wsFit(src, { x0: 24, x1: 76, y0: 68, y1: 98 }).forEach(s => out.push(s));
  }
  return out;
}

/* ---- scoring ---- */
function wsDensify(pts, step) {
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i];
    if (i === 0) { out.push(a); continue; }
    const b = pts[i - 1];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    const n = Math.max(1, Math.ceil(d / step));
    for (let k = 1; k <= n; k++) {
      out.push([b[0] + (a[0] - b[0]) * (k / n), b[1] + (a[1] - b[1]) * (k / n)]);
    }
  }
  return out;
}

function wsNearest(p, set) {
  let best = Infinity;
  for (let i = 0; i < set.length; i++) {
    const dx = set[i][0] - p[0], dy = set[i][1] - p[1];
    const d = dx * dx + dy * dy;
    if (d < best) best = d;
  }
  return Math.sqrt(best);
}

function wsLen(pts) {
  let n = 0;
  for (let i = 1; i < pts.length; i++) n += Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]);
  return n;
}

function wsScoreStroke(user, guide) {
  if (!user || user.length < 2 || !guide || guide.length < 2) return 0;
  const G = wsDensify(guide, 2.5);
  const U = wsDensify(user, 2.5);

  /* Tolerance follows the stroke. A fixed 13 units swallows ㅎ's twelve-unit
     top tick whole — any dot near it counts as full coverage — while a
     90-unit ㄱ barely notices 13. */
  const gLen = wsLen(guide);
  const tol = Math.min(WS_TOL, Math.max(6, gLen * 0.26));

  let cover = 0;
  for (let i = 0; i < G.length; i++) if (wsNearest(G[i], U) <= tol) cover++;
  cover /= G.length;

  let prec = 0;
  for (let i = 0; i < U.length; i++) if (wsNearest(U[i], G) <= tol) prec++;
  prec /= U.length;

  /* Coverage carries more weight: a short scribble that happens to sit on the
     stroke should not outscore a long honest attempt. */
  let score = 0.58 * cover + 0.42 * prec;

  /* Half a stroke is not a stroke. Coverage alone forgives a truncated line —
     every point you did draw sits perfectly on the guide — so the length gate
     is what makes "draw the whole thing" a requirement. Calibrated against
     the guides: 50% of ㄱ scores 35, 70% scores 52, 80% scores 71, 90% scores
     90. The curve is gentle near 1.0 so a naturally short finish is not
     punished, and steep below 0.8 so a truncated stroke cannot pass. */
  const uLen = wsLen(user);
  const ratio = uLen / Math.max(1, gLen);
  if (ratio < 0.95) score *= Math.pow(ratio / 0.95, 1.8);

  /* Stroke order includes which end you start at. A reversed trace of the
     right shape is not the stroke — but a closed loop (ㅇ) can legitimately
     start anywhere on the circle, so loops are exempt. */
  const closed = Math.hypot(guide[0][0] - guide[guide.length - 1][0],
                            guide[0][1] - guide[guide.length - 1][1]) < 6;
  if (!closed) {
    const startGap = Math.hypot(user[0][0] - guide[0][0], user[0][1] - guide[0][1]);
    if (startGap > tol * 2.2) score *= 0.55;
  }

  return Math.round(100 * Math.max(0, score));
}

/* ---- state ---- */
let WS = {
  ch: "가",
  strokes: [],
  done: 0,
  user: [],
  live: null,
  scores: [],
  attempts: 0,
  finished: false,
  total: 0,
  hintRaf: 0
};

function wsInit(ch) {
  WS.ch = ch;
  WS.strokes = wsStrokesFor(ch);
  WS.done = 0;
  WS.user = [];
  WS.live = null;
  WS.scores = [];
  WS.attempts = 0;
  WS.finished = false;
  WS.total = 0;
  wsStopHint();
}

function wsCurrent() { return WS.strokes[WS.done] || null; }

/* ---- drawing ---- */
const WS_SIZE = 300;

function wsPath(ctx, pts, k) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0] * k, pts[0][1] * k);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0] * k, pts[i][1] * k);
}

function wsPaint() {
  const cvs = document.getElementById("drawPad");
  if (!cvs) return;
  const ctx = cvs.getContext("2d");
  const k = cvs.width / 100;
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  /* The block guides: a cross and the two thirds, the same grid the paper
     uses. Drawn first so the strokes sit on top. */
  ctx.save();
  ctx.strokeStyle = "rgba(140,120,96,0.20)";
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 5]);
  [33.33, 66.66].forEach(function (p) {
    ctx.beginPath(); ctx.moveTo(p * k, 0); ctx.lineTo(p * k, cvs.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, p * k); ctx.lineTo(cvs.width, p * k); ctx.stroke();
  });
  ctx.restore();

  /* Every stroke of the character: finished ones solid, the next one strong,
     the rest a faint roadmap. */
  WS.strokes.forEach(function (s, i) {
    if (i < WS.done) return;
    ctx.save();
    ctx.strokeStyle = i === WS.done ? "rgba(173,70,101,0.62)" : "rgba(120,104,86,0.16)";
    ctx.lineWidth = i === WS.done ? 8 : 6;
    wsPath(ctx, s, k);
    ctx.stroke();
    ctx.restore();
  });

  /* Locked user strokes, in ink. */
  ctx.save();
  ctx.strokeStyle = getComputedStyle(document.documentElement)
    .getPropertyValue("--ink").trim() || "#2b2520";
  ctx.lineWidth = 9;
  WS.user.forEach(function (s) {
    if (!s || s.length < 2) return;
    wsPath(ctx, s, k);
    ctx.stroke();
  });
  if (WS.live && WS.live.length > 1) {
    wsPath(ctx, WS.live, k);
    ctx.stroke();
  }
  ctx.restore();

  /* The start of the stroke you are on: a numbered dot, because stroke order
     is the thing being taught and "start here" is half of it. */
  const cur = wsCurrent();
  if (cur && !WS.finished) {
    const p = cur[0];
    ctx.save();
    ctx.fillStyle = "#ad4665";
    ctx.beginPath();
    ctx.arc(p[0] * k, p[1] * k, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fffdf9";
    ctx.font = "bold 9px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(String(WS.done + 1), p[0] * k, p[1] * k + 0.5);
    ctx.restore();
  }
}

/* ---- hint: run a dot along the current stroke ---- */
function wsStopHint() {
  if (WS.hintRaf) { cancelAnimationFrame(WS.hintRaf); WS.hintRaf = 0; }
}

function wsHint() {
  const cvs = document.getElementById("drawPad");
  const cur = wsCurrent();
  if (!cvs || !cur) return;
  wsStopHint();
  const ctx = cvs.getContext("2d");
  const k = cvs.width / 100;
  const pts = wsDensify(cur, 1.5);
  let i = 0;
  const step = function () {
    if (!document.getElementById("drawPad")) { WS.hintRaf = 0; return; }
    wsPaint();
    ctx.save();
    ctx.fillStyle = "#7fbf9f";
    ctx.beginPath();
    ctx.arc(pts[i][0] * k, pts[i][1] * k, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    i += 1;
    if (i < pts.length) {
      WS.hintRaf = requestAnimationFrame(step);
    } else {
      WS.hintRaf = 0;
      setTimeout(wsPaint, 260);
    }
  };
  WS.hintRaf = requestAnimationFrame(step);
}

/* ---- UI sync (no full re-render, so the canvas keeps its listeners) ---- */
function wsSync() {
  const pips = document.getElementById("wsPips");
  if (pips) {
    pips.innerHTML = WS.strokes.map(function (s, i) {
      return '<i class="ws-pip' + (i < WS.done ? " on" : i === WS.done ? " now" : "") + '"></i>';
    }).join("");
  }
  const sc = document.getElementById("wsScore");
  if (sc) {
    const avg = WS.scores.length
      ? Math.round(WS.scores.reduce(function (a, b) { return a + b; }, 0) / WS.scores.length)
      : null;
    sc.textContent = avg === null
      ? (LANG === "ne" ? "अङ्क: —" : "Score: —")
      : (LANG === "ne" ? "अङ्क: " + avg : "Score: " + avg);
    sc.className = "ws-score" + (avg === null ? "" : avg >= 80 ? " great" : avg >= WS_PASS ? " ok" : " low");
  }
  const msg = document.getElementById("wsMsg");
  if (msg) {
    if (WS.finished) {
      msg.textContent = "";
    } else if (WS.attempts > 0) {
      msg.textContent = LANG === "ne"
        ? "अलिकति बाहिर — फेरि कोसिस गर्नुहोस्"
        : "A little off — try that stroke again";
    } else {
      msg.textContent = LANG === "ne"
        ? "रेखामा औंलाले लेख्नुहोस्"
        : "Trace the highlighted stroke";
    }
    msg.className = "ws-msg" + (WS.attempts > 0 ? " warn" : "");
  }
  const undo = document.getElementById("wsUndo");
  if (undo) undo.disabled = WS.done === 0;
}

/* ---- input ---- */
let isDrawing = false;
let canvasCtx = null;

function initCanvas() {
  const cvs = document.getElementById("drawPad");
  if (!cvs) return;
  canvasCtx = cvs.getContext("2d");
  wsPaint();
  wsSync();

  const pos = function (e) {
    const rect = cvs.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;
    return [Math.max(-6, Math.min(106, x)), Math.max(-6, Math.min(106, y))];
  };

  const down = function (e) {
    if (WS.finished || !wsCurrent()) return;
    e.preventDefault();
    isDrawing = true;
    wsStopHint();
    WS.live = [pos(e)];
    wsPaint();
  };
  const move = function (e) {
    if (!isDrawing) return;
    e.preventDefault();
    const p = pos(e);
    const last = WS.live[WS.live.length - 1];
    if (last && Math.hypot(p[0] - last[0], p[1] - last[1]) < 0.6) return;
    WS.live.push(p);
    wsPaint();
  };
  const up = function (e) {
    if (!isDrawing) return;
    isDrawing = false;
    if (e) e.preventDefault();
    const drawn = WS.live;
    WS.live = null;
    if (!drawn || drawn.length < 3) { wsPaint(); return; }
    wsCommit(drawn);
  };

  cvs.addEventListener("pointerdown", down);
  cvs.addEventListener("pointermove", move);
  cvs.addEventListener("pointerup", up);
  cvs.addEventListener("pointercancel", up);
  cvs.addEventListener("pointerleave", function (e) {
    if (isDrawing && e.buttons === 0) up(e);
  });
  window.addEventListener("pointerup", function () { if (isDrawing) up(null); }, { once: true });
}

function wsCommit(drawn) {
  const guide = wsCurrent();
  if (!guide) return;
  const score = wsScoreStroke(drawn, guide);
  WS.attempts += 1;

  if (score >= WS_PASS) {
    WS.user[WS.done] = drawn;
    WS.scores[WS.done] = score;
    WS.done += 1;
    WS.attempts = 0;
    wsPaint();
    wsSync();
    if (WS.done >= WS.strokes.length) wsFinish();
    return;
  }

  /* Failed: flash the guide red once so the correction is visible, then wipe
     only the live stroke — the strokes already earned stay on the canvas. */
  const cvs = document.getElementById("drawPad");
  if (cvs) {
    const ctx = cvs.getContext("2d");
    const k = cvs.width / 100;
    ctx.save();
    ctx.strokeStyle = "rgba(190,70,70,0.55)";
    ctx.lineWidth = 7;
    wsPath(ctx, guide, k);
    ctx.stroke();
    ctx.restore();
    setTimeout(wsPaint, 320);
  }
  wsSync();
}

function wsFinish() {
  WS.finished = true;
  WS.total = Math.round(WS.scores.reduce(function (a, b) { return a + b; }, 0) / WS.scores.length);
  wsPaint();

  const g = ensureGame();
  g.stats.writes = (g.stats.writes || 0) + 1;
  g.stats.writeSum = (g.stats.writeSum || 0) + WS.total;
  g.stats.writeBest = Math.max(g.stats.writeBest || 0, WS.total);
  g.wrote = g.wrote || {};
  g.wrote[WS.ch] = Math.max(g.wrote[WS.ch] || 0, WS.total);
  saveGame();

  addXp(WS.total >= 90 ? 15 : WS.total >= 75 ? 11 : 8, "silent");
  unlockAchievements();
  say(WS.ch);

  const box = document.getElementById("wsResult");
  if (box) {
    const band = WS.total >= 90
      ? (LANG === "ne" ? "उत्कृष्ट" : "Excellent")
      : WS.total >= 75 ? (LANG === "ne" ? "राम्रो" : "Good")
      : WS.total >= WS_PASS ? (LANG === "ne" ? "ठीकै" : "Passable")
      : (LANG === "ne" ? "फेरि अभ्यास" : "Practise again");
    box.className = "ws-result open " + (WS.total >= 75 ? "good" : WS.total >= WS_PASS ? "mid" : "low");
    box.innerHTML =
      '<div class="ws-result-num">' + WS.total + '<small>/100</small></div>' +
      '<div class="ws-result-band">' + band + "</div>" +
      '<div class="ws-result-meta">' +
        WS.strokes.length + (LANG === "ne" ? " स्ट्रोक · " : " strokes · ") +
        WS.ch + " · +" + (WS.total >= 90 ? 15 : WS.total >= 75 ? 11 : 8) + " XP" +
      "</div>" +
      '<div class="ws-result-acts">' +
        '<button type="button" class="ws-btn" onclick="wsReset()">' +
          (LANG === "ne" ? "फेरि लेख्नुहोस्" : "Write again") + "</button>" +
        '<button type="button" class="ws-btn primary" onclick="changeDrawTarget()">' +
          (LANG === "ne" ? "अर्को अक्षर →" : "Next letter →") + "</button>" +
      "</div>";
  }
  wsSync();
}

function wsReset() {
  const ch = WS.ch;
  wsInit(ch);
  const box = document.getElementById("wsResult");
  if (box) { box.className = "ws-result"; box.innerHTML = ""; }
  wsPaint();
  wsSync();
}

function wsUndo() {
  if (WS.done === 0) return;
  WS.done -= 1;
  WS.user[WS.done] = null;
  WS.scores[WS.done] = null;
  WS.scores = WS.scores.filter(function (x) { return x !== null; });
  WS.finished = false;
  const box = document.getElementById("wsResult");
  if (box) { box.className = "ws-result"; box.innerHTML = ""; }
  wsPaint();
  wsSync();
}

function clearCanvas() {
  wsReset();
}

function changeDrawTarget() {
  const at = WS_ORDER.indexOf(DRAW_TARGET);
  DRAW_TARGET = WS_ORDER[(at + 1) % WS_ORDER.length];
  navigateTo("writing_studio");
}

function wsSetTarget(ch) {
  DRAW_TARGET = ch;
  navigateTo("writing_studio");
}

function missionById(id) {
  for (let i = 0; i < MISSIONS.length; i++) if (MISSIONS[i].id === id) return MISSIONS[i];
  return null;
}

function missionLesson(m) {
  return {
    id: m.id,
    kind: "mission",
    titleNe: m.titleNe,
    titleEn: m.titleEn,
    m: m,
    steps: [{ type: "scene", m: m }].concat(m.steps)
  };
}

let activeBunpoLesson = null;
let bunpoStepsQueue = [];
let bunpoStepIdx = 0;
let bunpoSelectedVal = null;
let bunpoAssembledSlots = [];
let bunpoIsChecked = false;
let bunpoScore = 0;

function generateDayBunpoLesson(d) {
  const vList = d.vocab || [];
  const primaryWord = vList.length > 0 ? vList[0] : { ko: "한국어", ne: "कोरियन भाषा" };
  const secondWord = vList.length > 1 ? vList[1] : { ko: "감사합니다", ne: "धन्यवाद" };

  return {
    id: `day_${d.day}`,
    titleNe: `Day ${d.day}: ${d.neTitle}`,
    titleEn: `Day ${d.day}: ${d.enTitle}`,
    steps: [
      {
        type: "intro",
        char: primaryWord.ko,
        pronNe: primaryWord.ne,
        pronEn: primaryWord.en || primaryWord.ne,
        name: LANG === "ne" ? `दिन ${d.day} नियम` : `Day ${d.day} Rule`,
        audio: primaryWord.ko,
        tipNe: d.rules || d.summaryNe,
        tipEn: d.summaryEn,
        examples: vList.slice(0, 4).map(v => ({
          ko: v.ko,
          ne: v.ne,
          en: v.en || v.ne,
          audio: v.ko
        }))
      },
      {
        type: "match",
        ko: primaryWord.ko,
        audio: primaryWord.ko,
        pronNe: primaryWord.ne,
        promptNe: `'${primaryWord.ko}' को सही अर्थ छान्नुहोस्:`,
        promptEn: `Select the correct meaning of '${primaryWord.ko}':`,
        options: [
          primaryWord.ne,
          secondWord.ne,
          "पानी (Water)",
          "घर (House)"
        ].sort(() => Math.random() - 0.5),
        answer: primaryWord.ne,
        explainNe: `${primaryWord.ko} = ${primaryWord.ne}`,
        explainEn: `${primaryWord.ko} means ${primaryWord.en || primaryWord.ne}`
      },
      {
        type: "choice",
        promptNe: `यो शब्दको उच्चारण सुन्नुहोस् र सही कोरियन रूप छान्नुहोस्:`,
        promptEn: `Listen and choose the matching Korean word:`,
        audioPrompt: secondWord.ko,
        options: [
          secondWord.ko,
          primaryWord.ko,
          "가방",
          "다리"
        ].sort(() => Math.random() - 0.5),
        answer: secondWord.ko,
        explainNe: `${secondWord.ko} = ${secondWord.ne}`,
        explainEn: `${secondWord.ko} means ${secondWord.en || secondWord.ne}`
      }
    ]
  };
}

function startBunpoLesson(lessonId) {
  let lesson = null;
  if (typeof lessonId === "string" && lessonId.indexOf("m_") === 0) {
    const m = missionById(lessonId);
    if (m) lesson = missionLesson(m);
  } else if (typeof lessonId === "number" || (typeof lessonId === "string" && lessonId.startsWith("day_"))) {
    const dayNum = typeof lessonId === "number" ? lessonId : parseInt(lessonId.replace("day_", ""));
    const d = COURSE_44_DATA.find(x => x.day === dayNum);
    if (d) lesson = generateDayBunpoLesson(d);
  } else {
    lesson = BUNPO_CURRICULUM[lessonId];
  }

  if (!lesson) {
    alert("Lesson not found!");
    return;
  }

  activeBunpoLesson = lesson;
  bunpoStepsQueue = [...lesson.steps];
  bunpoStepIdx = 0;
  bunpoScore = 0;
  bunpoRewarded = false;

  const modal = document.getElementById("bunpoModal");
  if (modal) {
    modal.classList.add("open");
    renderBunpoStep();
  }
}

function renderBunpoStep() {
  const modal = document.getElementById("bunpoModal");
  if (!modal || !activeBunpoLesson) return;

  bunpoSelectedVal = null;
  bunpoIsChecked = false;
  bunpoAssembledSlots = [];

  const step = bunpoStepsQueue[bunpoStepIdx];
  const total = bunpoStepsQueue.length;

  if (!step) {
    renderBunpoCelebration();
    return;
  }

  // Build Progress Segments
  let segsHtml = "";
  for (let i = 0; i < total; i++) {
    let cls = "bunpo-prog-seg";
    if (i < bunpoStepIdx) cls += " done";
    else if (i === bunpoStepIdx) cls += " active";
    segsHtml += `<div class="${cls}"></div>`;
  }

  let bodyHtml = "";

  // 1. INTRO STEP
  if (step.type === "intro") {
    let examplesHtml = "";
    if (step.examples && step.examples.length > 0) {
      examplesHtml = `
        <div style="font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:6px;text-transform:uppercase;">
          ${LANG === "ne" ? "उदाहरण शब्दहरू (Tap to listen):" : "Example Words (Tap to listen):"}
        </div>
        <div class="bunpo-examples-grid">
          ${step.examples.map(ex => `
            <div class="bunpo-ex-chip" onclick="sayPron('${ex.audio}')">
              <span class="bunpo-ex-ko">${ex.ko}</span>
              <span class="bunpo-ex-ne">${LANG === "ne" ? ex.ne : ex.en}</span>
            </div>
          `).join("")}
        </div>
      `;
    }

    const heroLen = (step.char || "").replace(/\s/g, "").length;
    const longChar = heroLen > 1;
    const hasRealName = step.name && !/^(Day\s+\d+\s+Rule|दिन\s+\d+\s+नियम)$/i.test(step.name);
    const heroSub = hasRealName
      ? step.name
      : (LANG === "ne" ? "सुन्न थिच्नुहोस्" : "Tap to listen");
    const heroHtml = longChar
      ? `<div class="bunpo-sentence-hero" onclick="sayPron('${step.audio}')">
           <span class="bunpo-sentence-ko ko">${step.char}</span>
           <span class="bunpo-sentence-pron">${LANG === "ne" ? step.pronNe : step.pronEn}</span>
           <span class="bunpo-sentence-en">${heroSub}<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-left:4px"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></span>
         </div>`
      : `<div class="bunpo-glyph-hero">
           <div class="bunpo-glyph-circle ko" onclick="sayPron('${step.audio}')">
             ${step.char}
             <div class="bunpo-spk-float">🔊</div>
           </div>
           <div class="bunpo-glyph-title">${LANG === "ne" ? step.pronNe : step.pronEn}</div>
           <div class="bunpo-glyph-sub">${heroSub}</div>
         </div>`;

    bodyHtml = `
      <div class="bunpo-step-card">
        ${heroHtml}

        <div class="bunpo-tip">
          💡 <b>${LANG === "ne" ? "टिब्रेक सरको उच्चारण सुझाव:" : "Teacher's Pronunciation Tip:"}</b><br>
          ${LANG === "ne" ? step.tipNe : step.tipEn}
        </div>

        ${examplesHtml}
      </div>
    `;

    setTimeout(() => sayPron(step.audio), 300);
  }

  // 2. CHOICE STEP
  else if (step.type === "choice") {
    let audioBtn = "";
    if (step.audioPrompt) {
      audioBtn = `
        <div style="text-align:center;margin-bottom:14px;">
          <button type="button" class="bunpo-start-btn" style="padding:8px 16px;font-size:13px;" onclick="say('${step.audioPrompt}')">
            🔊 ${LANG === "ne" ? "आवाज सुन्नुहोस् (Listen)" : "Listen to Sound"}
          </button>
        </div>
      `;
      setTimeout(() => say(step.audioPrompt), 350);
    }

    bodyHtml = `
      <div class="bunpo-step-card">
        <div class="bunpo-prompt">${LANG === "ne" ? step.promptNe : step.promptEn}</div>
        ${audioBtn}
        <div class="bunpo-options-grid">
          ${step.options.map(opt => `
            <div class="bunpo-option" onclick="selectBunpoOption('${opt}', this)">
              ${opt}
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }

  // 3. BUILD STEP (SYLLABLE CONSTRUCTOR)
  else if (step.type === "build") {
    bunpoAssembledSlots = new Array(step.slots.length).fill(null);

    bodyHtml = `
      <div class="bunpo-step-card">
        <div class="bunpo-prompt">${LANG === "ne" ? step.promptNe : step.promptEn}</div>
        <div style="text-align:center;font-size:14px;color:var(--sub);margin-bottom:8px;">${step.targetPron}</div>
        
        <div class="bunpo-slots-wrap">
          ${step.slots.map((s, idx) => `
            <div class="bunpo-slot" id="bunpoSlot_${idx}" onclick="removeBunpoTile(${idx})"></div>
          `).join("")}
        </div>

        <div class="bunpo-tiles-bank">
          ${step.tiles.map((t, idx) => `
            <div class="bunpo-tile" id="bunpoTile_${idx}" onclick="placeBunpoTile('${t}', ${idx})">
              ${t}
            </div>
          `).join("")}
        </div>
      </div>
    `;
  }

  // 4. MATCH STEP
  else if (step.type === "match") {
    const matchLong = (step.ko || "").length > 3;
    bodyHtml = `
      <div class="bunpo-step-card">
        <div class="bunpo-glyph-hero">
          <div class="bunpo-glyph-circle" style="width:${matchLong ? "116px" : "90px"};height:${matchLong ? "116px" : "90px"};font-size:${matchLong ? "18px" : "28px"};padding:6px;text-align:center;line-height:1.35;" onclick="say('${step.audio}')">
            ${step.ko}
            <div class="bunpo-spk-float">🔊</div>
          </div>
          <div class="bunpo-glyph-sub">${step.pronNe || ""}</div>
        </div>

        <div class="bunpo-prompt">${LANG === "ne" ? step.promptNe : step.promptEn}</div>

        <div class="bunpo-options-grid">
          ${step.options.map(opt => `
            <div class="bunpo-option" style="font-size:14.5px;font-family:var(--font-main);" onclick="selectBunpoOption('${opt}', this)">
              ${opt}
            </div>
          `).join("")}
        </div>
      </div>
    `;

    setTimeout(() => say(step.audio), 350);
  }

  // 5. MISSION SCENE (task-based lesson card)
  else if (step.type === "scene") {
    const m = step.m;
    const tasks = LANG === "ne" ? m.tasksNe : m.tasksEn;
    bodyHtml = `
      <div class="bunpo-step-card">
        <div class="mission-scene">
          <div class="ava">${m.partner.emoji}</div>
          <div>
            <b>${m.partner.name} · ${LANG === "ne" ? m.partner.roleNe : m.partner.roleEn}</b>
            <small>${LANG === "ne" ? m.placeNe : m.placeEn}</small>
          </div>
        </div>
        <p class="mission-desc">${LANG === "ne" ? m.descNe : m.descEn}</p>
        <div class="mission-goal" onclick="say('${m.goalKo}')">
          <small>${LANG === "ne" ? "मिसनको लक्ष्य" : "Mission goal"}</small>
          <b>${m.goalKo} 🔊</b>
          <span>${m.goalRoman}</span>
          <span>${LANG === "ne" ? m.goalNe : m.goalEn}</span>
        </div>
        <div class="mission-scene-list">
          ${tasks.map(t => `<div class="mission-task"><i>✓</i><span>${t}</span></div>`).join("")}
        </div>
      </div>
    `;
    setTimeout(() => say(m.goalKo), 320);
  }

  // 6. MISSION STEP (reply inside the scene)
  else if (step.type === "mission") {
    const opts = shuffleArr(step.options.slice());
    bodyHtml = `
      <div class="bunpo-step-card">
        <div class="mission-chat">
          <div class="mission-bubble" onclick="say('${step.npcKo}')">

            <span class="roman">${step.npcRoman}</span>
            <span class="ne">${LANG === "ne" ? step.npcNe : step.npcEn}</span>
          </div>
        </div>
        <div class="mission-ask">${LANG === "ne" ? step.askNe : step.askEn}</div>
        <div class="mission-opts">
          ${opts.map(o => `
            <button type="button" class="mission-opt" onclick="selectBunpoOption('${o.ko}', this)">
              <span class="ko">${o.ko}</span>
              <span class="roman">${o.roman}</span>
              <span class="ne">${LANG === "ne" ? o.ne : o.en}</span>
            </button>
          `).join("")}
        </div>
      </div>
    `;
    setTimeout(() => say(step.npcKo), 380);
  }

  const isIntro = (step.type === "intro" || step.type === "scene");

  modal.innerHTML = `
    <div class="bunpo-modal-dialog">
      <div class="bunpo-modal-top">
        <button type="button" class="bunpo-close-btn" onclick="closeBunpoModal()">✕</button>
        <div class="bunpo-progress-wrap">

      </div>

        ${bodyHtml}
      </div>

          </div>
