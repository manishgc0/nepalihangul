  right: 0;
  background: var(--paper);
  border-top: 1px solid var(--line);
  padding: 14px 18px;
  box-shadow: 0 -8px 24px rgba(43, 37, 32, 0.08);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.bunpo-feedback-banner {
  display: none;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: 12px;
  animation: bunpoDrawerSlide 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes bunpoDrawerSlide {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.bunpo-feedback-banner.correct {
  background: var(--sage-soft);
  border: 1px solid #c2e5d3;
}
.bunpo-feedback-banner.incorrect {
  background: var(--rose-soft);
  border: 1px solid var(--rose-line);
}
.bunpo-sentence-hero {
  text-align: center;
  padding: 16px 12px 14px;
  background: var(--cream);
  border: 1.5px solid var(--line);
  border-radius: 16px;
  cursor: pointer;
}
.bunpo-sentence-ko {
  display: block;
  font-family: "Noto Sans KR", "Mukta", sans-serif;
  font-size: clamp(23px, 6.5vw, 32px);
  font-weight: 800;
  line-height: 1.4;
  color: var(--ink);
  word-break: keep-all;
  overflow-wrap: anywhere;
}
.bunpo-sentence-pron {
  display: block;
  margin-top: 6px;
  font-size:15px;
  font-weight: 600;
  color: var(--rose-ink);
}
.bunpo-sentence-en {
  display: block;
  margin-top: 2px;
  font-size:13.5px;
  color: var(--sub);
}
.bunpo-fb-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size:17px;
  color: #fff;
  flex-shrink: 0;
}
.bunpo-feedback-banner.correct .bunpo-fb-icon {
  background: var(--sage);
}
.bunpo-feedback-banner.incorrect .bunpo-fb-icon {
  background: var(--rose-ink);
}
.bunpo-fb-title {
  font-size:15px;
  font-weight: 800;
  margin-bottom: 2px;
}
.bunpo-feedback-banner.correct .bunpo-fb-title {
  color: #2d7a54;
}
.bunpo-feedback-banner.incorrect .bunpo-fb-title {
  color: var(--rose-ink);
}
.bunpo-fb-text {
  font-size:13.5px;
  color: var(--sub);
}

.bunpo-action-cta {
  width: 100%;
  padding: 12px 20px;
  border-radius: 999px;
  border: none;
  background: var(--rose-ink);
  color: #fff;
  font-size:16px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s ease;
}
.bunpo-action-cta:disabled {
  background: var(--line-2);
  color: var(--sub);
  opacity: 0.6;
  cursor: not-allowed;
}
.bunpo-action-cta.continue {
  background: #2d7a54;
}

/* ============================================================
   GAME LAYER — quests, streak, hearts, XP, review deck
   Bunpo-style progression adapted to the cream / pastel theme
   ============================================================ */

.game-hud {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 14px;
  align-items: center;
  background: var(--paper);
  border: 1.5px solid var(--line);
  border-radius: 18px;
  padding: 14px 16px;
  margin: 0 0 18px;
  box-shadow: 0 6px 18px -14px rgba(74, 52, 32, .55);
}
.game-hud.compact { margin: 0 0 14px; }

/* SRS due strip — the deck was only reachable from inside the game screen */
.due-card{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;
  width:100%;margin:0 0 14px;padding:12px 15px;text-align:left;
  background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r-2);
  font-family:inherit;cursor:pointer;
  transition:background .12s ease,border-color .12s ease;
}
.due-card:hover{background:var(--sky-soft);border-color:var(--sky-line)}
.due-card.done{cursor:default;background:var(--sage-soft);border-color:var(--sage)}
.due-card.done:hover{background:var(--sage-soft);border-color:var(--sage)}
.due-card.locked{cursor:pointer}
.due-ico{font-size:20px;line-height:1;width:24px;text-align:center}
.due-t{min-width:0}
.due-t b{display:block;font-size:var(--fs-label);font-weight:800;color:var(--ink);line-height:1.4}
.due-t i{display:block;font-style:normal;font-size:var(--fs-micro);color:var(--ink-3);line-height:1.5;margin-top:2px}
.due-go{font-size:16px;font-weight:700;color:var(--rose-ink)}

.hud-ring {
  --pct: 0;
  width: 68px;
  height: 68px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: conic-gradient(var(--rose-ink) calc(var(--pct) * 1%), var(--cream-2) 0);
  position: relative;
  flex-shrink: 0;
}
.hud-ring::after {
  content: "";
  position: absolute;
  inset: 7px;
  border-radius: 50%;
  background: var(--paper);
  border: 1px solid var(--line);
}
.hud-ring b {
  position: relative;
  z-index: 1;
  font-family: "Baloo 2", "Mukta", sans-serif;
  font-size:14.5px;
  line-height: 1.1;
  color: var(--ink);
  text-align: center;
}
.hud-ring b small { display: block; font-size:10px; color: var(--sub); font-weight: 700; letter-spacing: .4px; }

.hud-main { min-width: 0; }
.hud-top {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}
.hud-level {
  font-family: "Baloo 2", "Mukta", sans-serif;
  font-size:14px;
  font-weight: 700;
  color: var(--rose-ink);
  background: var(--rose-soft);
  border: 1px solid var(--rose-line);
  border-radius: 999px;
  padding: 2px 9px;
}
.hud-title { font-size:15px; font-weight: 700; color: var(--ink); }
.hud-title small { display: block; font-size:12.5px; font-weight: 600; color: var(--sub); }

.xp-track {
  height: 9px;
  border-radius: 999px;
  background: var(--cream-2);
  border: 1px solid var(--line);
  overflow: hidden;
}
.xp-track i {
  display: block;
  height: 100%;
  width: 0;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--rose) 0%, var(--rose-ink) 100%);
  transition: width .45s cubic-bezier(.22, 1, .36, 1);
}
.hud-meta {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size:12px;
  font-weight: 600;
  color: var(--sub);
  margin-top: 5px;
}

.hud-side {
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: flex-end;
}
.hud-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size:13px;
  font-weight: 800;
  color: var(--ink);
  background: var(--cream);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 9px;
  white-space: nowrap;
}
.hud-pill.flame { color: #b4552b; background: #fdf0e6; border-color: #f3d8c4; }
.hud-pill.cool { color: var(--sky-ink); background: var(--sky-soft); border-color: var(--sky-line); }

.heart-row { display: inline-flex; gap: 2px; }
.heart-row .hrt {
  width: 13px;
  height: 13px;
  display: inline-block;
  background: var(--rose-ink);
  clip-path: path("M6.5 12S0 8.1 0 3.9C0 1.7 1.7 0 3.8 0 5 0 6 1 6.5 1.7 7 1 8 0 9.2 0 11.3 0 13 1.7 13 3.9 13 8.1 6.5 12 6.5 12Z");
  opacity: .28;
}
.heart-row .hrt.on { opacity: 1; }

/* ---------- Quest cards ---------- */
.quest-wrap { display: grid; gap: 10px; }
.quest-card {
  display: grid;
  grid-template-columns: 38px 1fr auto;
  gap: 12px;
  align-items: center;
  background: var(--paper);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 11px 13px;
}
.quest-card.done { background: var(--sage-soft); border-color: #cbe6d8; }
.quest-ico {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 18px;
  background: var(--cream);
  border: 1px solid var(--line);
}
.quest-card.done .quest-ico { background: #fff; border-color: #cbe6d8; }
.quest-body b { display: block; font-size:14.5px; color: var(--ink); font-weight: 700; line-height: 1.3; }
.quest-body small { display: block; font-size:12.5px; color: var(--sub); font-weight: 600; margin-top: 2px; }
.quest-track { height: 5px; border-radius: 999px; background: var(--cream-2); margin-top: 6px; overflow: hidden; }
.quest-track i { display: block; height: 100%; background: var(--sage); border-radius: 999px; transition: width .4s ease; }
.quest-xp { font-size:12.5px; font-weight: 800; color: var(--rose-ink); white-space: nowrap; }

/* ---------- Achievement stamps ---------- */
.ach-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
  gap: 10px;
}
.ach {
  position: relative;
  text-align: center;
  padding: 12px 8px 10px;
  border-radius: 14px;
  background: var(--paper);
  border: 1.5px solid var(--line);
  transition: transform .18s ease, box-shadow .18s ease;
}
.ach .ach-ico { font-size: 24px; line-height: 1; display: block; margin-bottom: 6px; filter: grayscale(1); opacity: .45; }
.ach .ach-name { font-size:12px; font-weight: 700; color: var(--sub); line-height: 1.25; display: block; }
.ach.on {
  background: linear-gradient(180deg, #fffdf9 0%, var(--rose-soft) 100%);
  border-color: var(--rose-line);
  box-shadow: 0 8px 20px -16px rgba(173, 70, 101, .8);
}
.ach.on .ach-ico { filter: none; opacity: 1; animation: achPop .45s cubic-bezier(.22, 1.4, .4, 1); }
.ach.on .ach-name { color: var(--rose-ink); }
@keyframes achPop {
  0% { transform: scale(.6) rotate(-8deg); }
  60% { transform: scale(1.12) rotate(3deg); }
  100% { transform: scale(1) rotate(0); }
}

/* ---------- Review deck modal ---------- */
.gmodal-overlay {
  position: fixed;
  inset: 0;
  z-index: 10000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 14px;
  background: rgba(43, 37, 32, .58);
  -webkit-backdrop-filter: blur(5px);
  backdrop-filter: blur(5px);
}
.gmodal-overlay.open { display: flex; animation: bunpoFadeIn .18s ease; }
.gmodal {
  width: 100%;
  max-width: 560px;
  max-height: 92vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--cream);
  border: 1.5px solid var(--line);
  border-radius: 20px;
  box-shadow: 0 20px 60px -20px rgba(43, 37, 32, .5);
}
.gmodal-top {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  background: var(--paper);
}
.gmodal-close {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--cream);
  color: var(--ink-2);
  font-size:15px;
  font-weight: 700;
  cursor: pointer;
  flex-shrink: 0;
}
.gmodal-progress { display: flex; gap: 3px; flex: 1; }
.gmodal-progress i {
  height: 6px;
  flex: 1;
  border-radius: 99px;
  background: var(--cream-2);
  border: 1px solid var(--line);
}
.gmodal-progress i.done { background: var(--sage); border-color: #b6ddc9; }
.gmodal-progress i.now { background: var(--rose-ink); border-color: var(--rose-ink); }
.gmodal-body { padding: 18px 16px 20px; overflow-y: auto; }

.rev-prompt {
  text-align: center;
  font-size:14px;
  font-weight: 700;
  color: var(--sub);
  margin-bottom: 10px;
}
.rev-pic {
  width: 100%;
  max-width: 260px;
  aspect-ratio: 4 / 3;
  margin: 0 auto 12px;
  border-radius: 16px;
  border: 1.5px solid var(--line);
  background: var(--white);
  overflow: hidden;
  display: grid;
  place-items: center;
}
.rev-pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.rev-pic .rev-emoji { font-size: 62px; line-height: 1; }
.rev-word {
  text-align: center;
  font-family: "Noto Sans KR", "Mukta", sans-serif;
  font-size: 40px;
  font-weight: 800;
  color: var(--ink);
  line-height: 1.15;
  margin: 2px 0 4px;
}
.rev-sub { text-align: center; font-size:15px; font-weight: 600; color: var(--sub); margin-bottom: 14px; }

.rev-options { display: grid; gap: 9px; }
.rev-opt {
  width: 100%;
  text-align: left;
  padding: 13px 15px;
  border-radius: 13px;
  border: 1.5px solid var(--line);
  background: var(--paper);
  color: var(--ink);
  font: inherit;
  font-size:16px;
  font-weight: 600;
  cursor: pointer;
  transition: border-color .15s, background .15s, transform .12s;
}
.rev-opt:active { transform: scale(.985); }
.rev-opt.ok { border-color: #7fbf9f; background: var(--sage-soft); color: #23654a; }
.rev-opt.bad { border-color: var(--rose-ink); background: var(--rose-soft); color: var(--rose-ink); }
.rev-opt:disabled { cursor: default; }

.rev-feedback {
  margin-top: 12px;
  padding: 11px 13px;
  border-radius: 12px;
  font-size:14px;
  font-weight: 600;
  line-height: 1.5;
  display: none;
}
.rev-feedback.show { display: block; }
.rev-feedback.good { background: var(--sage-soft); border: 1px solid #cbe6d8; color: #23654a; }
.rev-feedback.bad { background: var(--rose-soft); border: 1px solid var(--rose-line); color: var(--rose-ink); }

.combo-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size:13px;
  font-weight: 800;
  color: #b4552b;
  background: #fdf0e6;
  border: 1px solid #f3d8c4;
  border-radius: 999px;
  padding: 3px 9px;
}
.combo-pill.hot { animation: comboPulse .6s ease; }
@keyframes comboPulse {
  0% { transform: scale(1); }
  45% { transform: scale(1.18); }
  100% { transform: scale(1); }
}

.rev-summary { text-align: center; padding: 10px 4px 4px; }
.rev-summary .big { font-size: 46px; line-height: 1; margin-bottom: 8px; }
.rev-summary h3 { font-size: 20px; font-weight: 800; color: var(--ink); margin: 0 0 6px; }
.rev-summary p { font-size:15px; color: var(--sub); margin: 0 0 16px; line-height: 1.55; }
.rev-stats { display: flex; justify-content: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
.rev-stat {
  min-width: 82px;
  padding: 10px 12px;
  border-radius: 13px;
  background: var(--paper);
  border: 1.5px solid var(--line);
}
.rev-stat b { display: block; font-family: "Baloo 2", "Mukta", sans-serif; font-size: 20px; color: var(--rose-ink); line-height: 1.1; }
.rev-stat small { font-size:12px; font-weight: 700; color: var(--sub); }

/* ---------- Toasts / XP floats ---------- */
.toast-root {
  position: fixed;
  left: 50%;
  bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  z-index: 10001;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  pointer-events: none;
  width: min(92vw, 400px);
}
@media (min-width: 900px) {
  .toast-root { left: auto; right: 28px; bottom: 28px; transform: none; align-items: flex-end; }
}
.toast {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 10px 15px;
  border-radius: 999px;
  background: var(--ink);
  color: #fff8ee;
  font-size:14px;
  font-weight: 700;
  box-shadow: 0 14px 30px -16px rgba(43, 37, 32, .9);
  animation: toastIn .28s cubic-bezier(.22, 1.3, .4, 1);
}
.toast.xp { background: var(--rose-ink); }
.toast.up { background: #2d7a54; }
.toast.ach { background: #8a6a2f; }
.toast.out { animation: toastOut .3s ease forwards; }
@keyframes toastIn {
  from { opacity: 0; transform: translateY(14px) scale(.94); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes toastOut {
  to { opacity: 0; transform: translateY(-8px) scale(.96); }
}

/* ---------- Task missions (Bunpo scene lessons) ---------- */
.mission-grid{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:780px){.mission-grid{grid-template-columns:1fr 1fr}}
.mission-card{position:relative;display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--paper);text-align:left;cursor:pointer;font-family:inherit;color:inherit;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}
.mission-card:hover,.mission-card:focus-visible{transform:translateY(-2px);border-color:var(--rose-line);box-shadow:0 16px 30px -26px rgba(43,37,32,.8);outline:none}
.mission-card.done{border-color:#c6e6d3;background:var(--sage-soft)}
.mission-ava{flex:0 0 auto;display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--cream-2);border:1px solid var(--line);font-size:21px;line-height:1}
.mission-body{flex:1;min-width:0}
.mission-body h3{margin:0 0 2px;font-size:16px;color:var(--ink);letter-spacing:-.1px}
.mission-body p{margin:0 0 8px;font-size:13.5px;line-height:1.45;color:var(--sub)}
.mission-body .mt{display:block;font-size:16px;font-weight:800;color:var(--ink);line-height:1.35;margin-bottom:2px}
.mission-body .mp{display:block;font-size:13.5px;line-height:1.45;color:var(--sub);margin-bottom:8px}
.mission-tags{display:flex;gap:6px;flex-wrap:wrap}
.mission-tag{font-size:12px;font-weight:800;color:var(--ink-2);background:var(--cream);border:1px solid var(--line);border-radius:999px;padding:3px 8px}
.mission-tag.ok{color:#2d7a54;background:#eaf6ee;border-color:#c6e6d3}
.mission-tag.speak{cursor:pointer;transition:background .16s,border-color .16s}
.mission-tag.speak:hover{background:var(--rose-soft);border-color:var(--rose-line)}
.mission-flag{position:absolute;top:9px;right:11px;font-size:13px}

.mission-scene{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:16px;background:var(--cream);border:1px solid var(--line);margin-bottom:12px}
.mission-scene .ava{display:grid;place-items:center;flex:0 0 auto;width:50px;height:50px;border-radius:50%;background:var(--paper);border:1.5px solid var(--rose-line);font-size:23px;line-height:1}
.mission-scene b{display:block;font-size:14.5px;color:var(--ink);line-height:1.3}
.mission-scene small{display:block;font-size:12.5px;color:var(--sub);margin-top:1px}
.mission-desc{font-size:14px;line-height:1.6;color:var(--ink-2);margin:0 0 12px;text-align:left}
.mission-goal{display:grid;gap:1px;padding:11px 13px;border-radius:14px;background:var(--rose-soft);border:1px solid var(--rose-line);cursor:pointer;text-align:left}
.mission-goal small{font-size:11.5px;font-weight:900;letter-spacing:.1em;color:var(--rose-ink);text-transform:uppercase}
.mission-goal b{font-family:"Noto Sans KR","Mukta",sans-serif;font-size:17px;color:var(--ink);line-height:1.4}
.mission-goal span{font-size:12.5px;color:var(--ink-2);font-weight:700}
.mission-scene-list{display:grid;gap:7px;margin-top:11px}
.mission-task{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;line-height:1.5;color:var(--ink-2);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:left}
.mission-task i{font-style:normal;font-weight:900;color:var(--rose-ink);flex:0 0 auto}

.mission-chat{display:flex;gap:9px;margin:0 0 13px;justify-content:flex-start}
.mission-bubble{max-width:86%;padding:10px 13px;border-radius:16px 16px 16px 5px;background:var(--paper);border:1.5px solid var(--line);cursor:pointer;text-align:left}
.mission-bubble .ko{display:block;font-family:"Noto Sans KR","Mukta",sans-serif;font-size:16.5px;font-weight:700;color:var(--ink);line-height:1.5}
.mission-bubble .roman{display:block;font-size:12.5px;color:var(--sub);font-weight:700;margin-top:2px}
.mission-bubble .ne{display:block;font-size:13.5px;color:var(--ink-2);margin-top:4px;font-weight:600}
.mission-ask{font-size:13.5px;font-weight:800;letter-spacing:.01em;color:var(--rose-ink);margin:0 0 8px;text-align:left;line-height:1.45}
.mission-opts{display:grid;gap:8px}
.mission-opt{position:relative;display:block;width:100%;text-align:left;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;font-family:inherit;color:inherit;transition:border-color .15s ease,background .15s ease,transform .15s ease}
.mission-opt:hover{border-color:var(--rose-line);transform:translateX(2px)}
.mission-opt.selected{border-color:var(--rose-ink);background:var(--rose-soft)}
.mission-opt.ok{border-color:#4a8a6d;background:var(--sage-soft)}
.mission-opt.ok .ko{color:#2f7a55}
.mission-opt.bad{border-color:var(--rose-ink);background:var(--rose-soft)}
.mission-opt.bad .ko{color:var(--rose-ink);text-decoration:line-through;text-decoration-thickness:1.5px}
.mission-opt.ok::after,.mission-opt.bad::after{position:absolute;top:8px;right:10px;font-family:"Mukta",sans-serif;font-size:16px;font-weight:700;line-height:1}
.mission-opt.ok::after{content:"✓";color:#2f7a55}
.mission-opt.bad::after{content:"✕";color:var(--rose-ink)}
.mission-opt .ko{display:block;font-family:"Noto Sans KR","Mukta",sans-serif;font-size:16px;font-weight:700;color:var(--ink);line-height:1.45}
.mission-opt .roman{display:block;font-size:12px;color:var(--sub);font-weight:700}
.mission-opt .ne{display:block;font-size:13px;color:var(--ink-2);font-weight:600;margin-top:2px}

.sfx-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink-2);font-size:13px;font-weight:800;font-family:inherit;cursor:pointer}
.sfx-btn:hover{border-color:var(--rose-line);color:var(--ink)}
.sfx-btn.on{color:var(--rose-ink);border-color:var(--rose-line);background:var(--rose-soft)}

/* ---------- Hangul Runner (canvas game) ---------- */
.runner-feature{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:16px 18px;margin:16px 0 20px;
  border:1px solid var(--line);border-radius:var(--r-3);
  background:var(--paper);
}
.runner-feature-art{
  display:flex;align-items:center;flex:0 0 auto;
}
.runner-feature-art span{
  display:grid;place-items:center;
  width:44px;height:44px;border-radius:14px;
  background:var(--paper);border:1px solid var(--line);
  font-family:"Noto Sans KR","Mukta",sans-serif;font-weight:900;font-size:20px;color:var(--ink);
  box-shadow:0 8px 18px -14px rgba(43,37,32,.6);
}
.runner-feature-art span:nth-child(1){transform:rotate(-7deg) translateY(2px)}
.runner-feature-art span:nth-child(2){transform:rotate(3deg) translateY(-3px);background:var(--rose-soft);border-color:var(--rose-line)}
.runner-feature-art span:nth-child(3){transform:rotate(9deg) translateY(2px)}
.runner-feature-body{flex:1;min-width:190px}
.runner-feature-body h3{margin:0 0 3px;font-size:17px;color:var(--ink);letter-spacing:-.2px}
.runner-feature-body p{margin:0;font-size:14px;line-height:1.5;color:var(--sub)}

.runner-card{
  position:relative;margin:16px 0 22px;
  border:1px solid var(--line);border-radius:24px;
  background:var(--paper);overflow:hidden;
  box-shadow:0 30px 60px -46px rgba(43,37,32,.6);
  scroll-margin-top:14px;
}
.runner-top{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px 14px;border-bottom:1px solid var(--line);background:var(--paper);
}
.runner-prompt{display:flex;align-items:baseline;gap:9px;flex:1;min-width:132px}
.runner-prompt small{
  font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--sub);
}
.runner-prompt b{
  font-family:"Baloo 2","Mukta",sans-serif;font-size:27px;line-height:1;
  color:var(--ink);letter-spacing:-.5px;
}
.runner-prompt b.empty{color:var(--line-2)}
.runner-talk{
  display:grid;place-items:center;width:30px;height:30px;border-radius:10px;
  border:1px solid var(--line);background:var(--cream-2);color:var(--ink);
  font-size:14px;cursor:pointer;flex:0 0 auto;
}
.runner-talk:hover{background:var(--sky-soft);border-color:var(--sky-line)}
.runner-score{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.runner-pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 10px;border-radius:999px;
  background:var(--cream-2);border:1px solid var(--line);
  font-size:12.5px;font-weight:800;color:var(--ink);white-space:nowrap;
}
.runner-pill b{font-family:"Baloo 2",sans-serif;font-size:14.5px;color:var(--rose-ink)}
.runner-pill.mute{
  cursor:pointer;font-family:inherit;font-size:13px;line-height:1;
  padding:5px 9px;transition:background .18s,border-color .18s;
}
.runner-pill.mute:hover{background:var(--sky-soft);border-color:var(--sky-line)}
.runner-pill.mute.off{background:var(--rose-soft);border-color:var(--rose-line)}
.runner-pill.speed{
  cursor:pointer;font-family:inherit;font-size:12px;line-height:1;
  padding:5px 10px;letter-spacing:.02em;
  transition:background .18s,border-color .18s;
}
.runner-pill.speed:hover{background:var(--rose-soft);border-color:var(--rose-line)}
.runner-lives{display:inline-flex;gap:4px;align-items:center}
.runner-lives i{
  display:block;width:10px;height:10px;border-radius:3px;
  background:var(--line-2);transform:rotate(45deg);transition:background .2s;
}
.runner-lives i.on{background:var(--rose-ink)}
.runner-stage{position:relative;background:var(--cream-2);overflow:hidden}
#runnerCanvas{display:block;width:100%;height:clamp(300px,46vh,470px);touch-action:none;cursor:pointer}
.runner-hint{
  text-align:center;font-size:12px;font-weight:700;color:var(--sub);
  padding:0 14px 12px;line-height:1.4;
}
.runner-pads{display:flex;gap:10px;padding:10px 14px 13px;border-top:1px solid var(--line)}
.runner-pads button{
  flex:1;padding:11px 0;border-radius:14px;border:1px solid var(--line-2);
  background:var(--cream-2);color:var(--ink);font-size:18px;font-weight:800;
  cursor:pointer;line-height:1;transition:transform .12s, background .18s;
}
.runner-pads button:active{transform:scale(.96);background:var(--rose-soft)}
.runner-overlay{
  position:absolute;inset:0;display:none;place-items:center;padding:22px;z-index:3;
  background:rgba(250,245,236,.94);
}
html.dark .runner-overlay{background:rgba(23,19,15,.94)}
.runner-overlay.open{display:grid}
.runner-panel{width:100%;max-width:330px;text-align:center}
.runner-panel .rp-chip{
  display:inline-block;padding:4px 11px;border-radius:999px;
  background:var(--rose-soft);border:1px solid var(--rose-line);
  font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--rose-ink);
}
.runner-panel h3{margin:10px 0 4px;font-size:22px;color:var(--ink);letter-spacing:-.4px}
.runner-panel p{margin:0 0 14px;font-size:14px;line-height:1.55;color:var(--sub)}
.runner-panel .rp-score{
  font-family:"Baloo 2",sans-serif;font-size:52px;line-height:1;color:var(--rose-ink);margin:6px 0 2px;
}
.runner-panel .rp-grid{display:flex;gap:8px;justify-content:center;margin:14px 0 18px;flex-wrap:wrap}
.runner-panel .rp-grid div{
  flex:1;min-width:74px;padding:9px 6px;border-radius:12px;
  background:var(--cream-2);border:1px solid var(--line);
}
.runner-panel .rp-grid b{display:block;font-family:"Baloo 2",sans-serif;font-size:17px;color:var(--ink);line-height:1.1}
.runner-panel .rp-grid small{font-size:11px;font-weight:700;color:var(--sub)}
.runner-panel .rp-actions{display:flex;gap:9px;flex-wrap:wrap}
.runner-panel .rp-actions button{
  flex:1;min-width:130px;padding:12px 14px;border-radius:14px;border:0;cursor:pointer;
  font-size:14.5px;font-weight:800;
}
.runner-panel .rp-actions .primary{background:var(--ink);color:#fff8ee}
.runner-panel .rp-actions .ghost{background:transparent;border:1px solid var(--line-2);color:var(--ink)}

/* Pace chooser on the ready card */
.runner-panel .rp-pace{margin:0 0 16px;text-align:center}
.runner-panel .rp-pace > small{
  display:block;font-size:11px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:var(--sub);margin-bottom:7px;
}
.runner-panel .rp-pace-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.runner-panel .rp-pace-btn{
  flex:1 1 0;min-width:78px;padding:8px 10px;border-radius:12px;cursor:pointer;
  background:var(--cream-2);border:1px solid var(--line);color:var(--ink);
  font-family:inherit;line-height:1.15;transition:background .16s,border-color .16s,transform .16s;
}
.runner-panel .rp-pace-btn b{display:block;font-size:13px;font-weight:800}
.runner-panel .rp-pace-btn small{display:block;font-size:10.5px;font-weight:700;color:var(--sub);margin-top:1px}
.runner-panel .rp-pace-btn:hover{background:var(--rose-soft);border-color:var(--rose-line)}
.runner-panel .rp-pace-btn.on{
  background:var(--ink);border-color:var(--ink);transform:translateY(-1px);
}
.runner-panel .rp-pace-btn.on b{color:#fff8ee}
.runner-panel .rp-pace-btn.on small{color:rgba(255,248,238,.72)}

/* Small-screen nav fits one extra tab */
@media (max-width: 430px) {
  .bunpo-examples-grid { grid-template-columns: 1fr; }
  .bunpo-slot { min-width: 46px; height: 46px; padding: 0 7px; }
  .bunpo-tiles-bank { gap: 8px; }
  .bunpo-slots-wrap { gap: 7px; }
  .bunpo-tile { font-size: 18px; padding: 0 10px; }
  .bunpo-slot { font-size: 17px; }
  #nav button { font-size:11.5px; gap: 3px; padding: 9px 0 8px; }
  #nav button svg { width: 19px; height: 19px; }
  #nav button span { white-space: nowrap; }
  .game-hud { grid-template-columns: auto 1fr; }
  .hud-side { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; align-items: center; }
}

@media (prefers-reduced-motion: reduce) {
  .ach.on .ach-ico, .toast, .combo-pill.hot { animation: none !important; }
  .xp-track i, .quest-track i { transition: none !important; }
}

/* ============ NUMBER PIANO (संख्या पियानो) ============ */
.piano-card {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 18px 16px 20px;
  margin: 16px 0 20px;
  box-shadow: 0 4px 20px rgba(43, 37, 32, 0.05);
  position: relative;
  overflow: hidden;
}
html.dark .piano-card {
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
}
.piano-card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, #c9778e 0%, #d99a8f 34%, #e0bd8a 58%, #9dbdd6 82%, #a9c7dd 100%);
  opacity: 0.85;
}
.piano-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 14px;
}
.piano-title-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
}
.piano-badge-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: var(--cream-2);
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  box-shadow: inset 0 1px 2px rgba(255,255,255,0.7);
  flex-shrink: 0;
}
.piano-heading {
  margin: 0;
  font-size: 18px;
  font-weight: 800;
  color: var(--ink);
  letter-spacing: -0.01em;
}
.piano-subtitle {
  font-size: 12px;
  color: var(--ink-2);
  font-weight: 600;
  margin-top: 1px;
}
.piano-controls {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.piano-sound-toggle, .piano-mode-btn {
  background: var(--cream);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 11px;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--ink);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.16s ease;
  font-family: inherit;
}
.piano-sound-toggle:hover, .piano-mode-btn:hover {
  background: var(--rose-soft);
  border-color: var(--rose-line);
}
.piano-sound-toggle.active, .piano-mode-btn.active {
  background: var(--ink);
  color: var(--cream);
  border-color: var(--ink);
}

/* Screen / LED Display — soft inset panel, matches the cream shell */
.piano-display {
  position: relative;
  background: linear-gradient(180deg, var(--white) 0%, var(--cream) 100%);
  color: var(--ink);
  border-radius: 14px;
  padding: 12px 16px 12px 19px;
  margin-bottom: 14px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.9),
    0 2px 10px rgba(43,37,32,0.05);
  border: 1px solid var(--line);
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 14px;
  overflow: hidden;
}
html.dark .piano-display {
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 2px 10px rgba(0,0,0,0.3);
}
.piano-display::before {
  content: "";
  position: absolute;
  top: 0; left: 0; bottom: 0;
  width: 4px;
  background: linear-gradient(180deg, #d98aa0 0%, #e3b48d 100%);
}
.pdisp-big-ko {
  font-size: 36px;
  font-weight: 900;
  color: var(--rose-ink);
  line-height: 1;
  min-width: 54px;
  text-align: center;
  transition: transform 0.15s ease;
}
.pdisp-info {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}
.pdisp-headline {
  font-size: 16px;
  font-weight: 800;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.pdisp-tag {
  background: var(--rose-soft);
  color: var(--rose-ink);
  border: 1px solid var(--rose-line);
  border-radius: 999px;
  padding: 1px 8px;
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.03em;
}
.pdisp-sub {
  font-size: 12.5px;
  color: var(--ink-2);
  line-height: 1.4;
}
.pdisp-note-badge {
  text-align: right;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
  padding-left: 12px;
  border-left: 1px dashed var(--line-2);
}
.pdisp-note-name {
  font-size: 16px;
  font-weight: 800;
  color: #4f8f74;
  letter-spacing: 0.03em;
}
html.dark .pdisp-note-name {
  color: var(--sage);
}
.pdisp-freq {
  font-size: 10.5px;
  color: var(--ink-2);
  font-family: ui-monospace, monospace;
  opacity: 0.8;
}

/* History / Melody Tracker */
.piano-history-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 12px;
  padding: 6px 10px;
  background: var(--cream);
  border-radius: 12px;
  border: 1px solid var(--line);
  font-size: 12px;
  min-height: 38px;
}
.piano-history-chips {
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
  white-space: nowrap;
  flex: 1;
  padding: 2px 0;
  -webkit-overflow-scrolling: touch;
}
.piano-history-chips::-webkit-scrollbar { display: none; }
.piano-h-chip {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 2px 7px;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.piano-h-actions {
  display: flex;
  gap: 5px;
  flex-shrink: 0;
}
.piano-h-btn {
  background: transparent;
  border: 1px solid transparent;
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-2);
  cursor: pointer;
  padding: 3px 6px;
  border-radius: 6px;
  transition: all 0.15s ease;
  font-family: inherit;
}
.piano-h-btn:hover {
  background: var(--cream-2);
  border-color: var(--line);
  color: var(--ink);
}

/* Piano Keyboard */
.piano-scroll-hint {
  display: none;
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-2);
  text-align: center;
  margin-bottom: 6px;
}
@media (max-width: 620px) {
  .piano-scroll-hint { display: block; }
  .piano-key { height: 190px; padding: 24px 2px 10px; }
  .pkey-ko { font-size: 19px; margin-bottom: 5px; }
  .pkey-ne { font-size: 9px; }
  .pkey-note { font-size: 7.5px; }
  .piano-keyboard { min-width: 520px; padding: 9px 9px 11px; }
}
.piano-keyboard-wrap {
  width: 100%;
  overflow-x: auto;
  padding: 2px 2px 10px;
  -webkit-overflow-scrolling: touch;
}
.piano-keyboard-wrap::-webkit-scrollbar {
  height: 6px;
}
.piano-keyboard-wrap::-webkit-scrollbar-thumb {
  background: var(--line-2);
  border-radius: 999px;
}
.piano-keyboard {
  user-select: none;
  -webkit-user-select: none;
  min-width: 560px;
  background: linear-gradient(180deg, #2b2520 0%, #1a1613 55%, #100d0b 100%);
  padding: 11px 11px 13px;
  border-radius: 14px;
  border: 1px solid #3a322a;
  box-shadow:
    inset 0 2px 5px rgba(0,0,0,0.65),
    inset 0 -1px 0 rgba(255,255,255,0.05),
    0 10px 26px rgba(43,37,32,0.18);
}
/* red felt strip behind the keys — the detail that reads as "real instrument" */
.piano-felt {
  height: 8px;
  margin: 0 1px 10px;
  border-radius: 3px;
  background: linear-gradient(180deg, #b04a5c 0%, #8a2b3c 48%, #4d1119 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.30),
    inset 0 -1px 0 rgba(0,0,0,0.55),
    0 3px 6px rgba(0,0,0,0.6);
}
.piano-keys {
  position: relative;
}
.piano-white-row {
  display: flex;
  align-items: stretch;
}
.piano-key {
  position: relative;
  flex: 1 1 0;
  min-width: 0;
  height: 214px;
  padding: 27px 3px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  cursor: pointer;
  outline: none;
  font-family: inherit;
  color: var(--ink);
  border: none;
  border-radius: 2px 2px 5px 5px;
  background:
    linear-gradient(90deg,
      rgba(110,88,58,0.10) 0%,
      rgba(110,88,58,0.00) 12%,
      rgba(255,255,255,0.55) 26%,
      rgba(255,255,255,0.00) 58%,
      rgba(110,88,58,0.02) 86%,
      rgba(110,88,58,0.12) 100%),
    linear-gradient(180deg, #f6eee0 0%, #fffdf9 14%, #fffefc 72%, #f9f2e5 100%);
  box-shadow:
    inset 0 7px 9px -7px rgba(60,44,26,0.45),
    inset 0 1px 0 rgba(255,255,255,0.9),
    inset 0 -10px 14px -8px rgba(122,98,64,0.22),
    0 3px 0 #d6c4a6,
    0 7px 10px rgba(0,0,0,0.32);
  transition: transform 0.06s ease, box-shadow 0.06s ease, background 0.08s ease;
  touch-action: manipulation;
}
.piano-key + .piano-key {
  border-left: 1px solid rgba(146,122,88,0.20);
}
.piano-key:hover {
  background:
    linear-gradient(90deg,
      rgba(110,88,58,0.08) 0%,
      rgba(110,88,58,0.00) 12%,
      rgba(255,255,255,0.80) 26%,
      rgba(255,255,255,0.00) 58%,
      rgba(110,88,58,0.01) 86%,
      rgba(110,88,58,0.10) 100%),
    linear-gradient(180deg, #f9f3e7 0%, #ffffff 14%, #ffffff 72%, #fbf5ea 100%);
}
.piano-key:active, .piano-key.pressed {
  transform: translateY(3px);
  background:
    linear-gradient(90deg,
      rgba(160,66,94,0.13) 0%,
      rgba(160,66,94,0.00) 12%,
      rgba(255,255,255,0.55) 26%,
      rgba(255,255,255,0.00) 58%,
      rgba(160,66,94,0.02) 86%,
      rgba(160,66,94,0.15) 100%),
    linear-gradient(180deg, #f7e6ec 0%, #fff7fa 16%, #fdf0f4 72%, #f7dde5 100%);
  box-shadow:
    inset 0 7px 9px -7px rgba(120,40,66,0.40),
    inset 0 1px 0 rgba(255,255,255,0.85),
    inset 0 -4px 8px rgba(160,66,94,0.16),
    0 1px 0 #cfb495,
    0 2px 4px rgba(0,0,0,0.26),
    0 0 18px rgba(243,183,200,0.45);
}
/* black keys float above the white row, pointer-events only on the keys themselves */
.piano-black-layer {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 58%;
  pointer-events: none;
}
.piano-black-key {
  position: absolute;
  top: 0;
  width: 4.6%;
  height: 100%;
  padding: 0 0 6px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  pointer-events: auto;
  cursor: pointer;
  border: none;
  border-radius: 0 0 3px 3px;
  background:
    linear-gradient(90deg,
      #514639 0%,
      #2e2620 9%,
      #18140f 44%,
      #241d17 88%,
      #0a0806 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.22),
    inset 0 -7px 7px rgba(255,255,255,0.05),
    0 4px 5px rgba(0,0,0,0.55),
    0 9px 0 #050404,
    0 10px 4px rgba(0,0,0,0.38);
  transition: transform 0.05s ease, box-shadow 0.05s ease, background 0.08s ease;
  touch-action: manipulation;
}
.piano-black-key:active, .piano-black-key.pressed {
  transform: translateY(2px);
  background:
    linear-gradient(90deg,
      #6b4a44 0%,
      #45302b 9%,
      #2b1e1a 44%,
      #3a2824 88%,
      #17100e 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.18),
    inset 0 -3px 4px rgba(255,255,255,0.05),
    0 2px 3px rgba(0,0,0,0.5),
    0 0 16px rgba(243,183,200,0.55);
}
.piano-key:focus-visible {
  outline: 2px solid var(--rose-ink);
  outline-offset: -3px;
}
.piano-black-key:focus-visible {
  outline: 2px solid #f0a7bd;
  outline-offset: -2px;
}
.pkey-acc {
  font-size: 7px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: rgba(255,255,255,0.38);
  text-transform: uppercase;
  line-height: 1;
}
.piano-black-key.pressed .pkey-acc {
  color: rgba(255,255,255,0.9);
}
.pkey-shortcut {
  position: absolute;
  top: 7px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 9px;
  font-weight: 800;
  color: #8a7c63;
  letter-spacing: 0.04em;
  line-height: 1;
  pointer-events: none;
}
.pkey-ko {
  margin-bottom: 7px;
  font-size: 22px;
  font-weight: 900;
  color: #2b2520;
  line-height: 1;
  text-align: center;
  letter-spacing: -0.01em;
  pointer-events: none;
}
.piano-key.pressed .pkey-ko {
  color: var(--rose-ink);
}
.pkey-foot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  pointer-events: none;
}
.pkey-ne {
  font-size: 10px;
  font-weight: 700;
  color: #7b6f5e;
  text-align: center;
  line-height: 1.1;
}
.pkey-note {
  font-size: 8px;
  font-weight: 800;
  color: #6d8fa8;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  line-height: 1;
}

/* Practice & Quiz Section */
.piano-activities {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed var(--line);
}
.piano-act-btn {
  flex: 1 1 calc(33.33% - 8px);
  min-width: 125px;
  background: var(--cream);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 8px 12px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  color: var(--ink);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.16s ease;
}
.piano-act-btn:hover {
  background: var(--rose-soft);
  border-color: var(--rose-line);
  transform: translateY(-1px);
}
.piano-act-btn.active {
  background: var(--rose-ink);
  color: #ffffff;
  border-color: var(--rose-ink);
}

/* Quiz Overlay Box */
.piano-quiz-box {
  background: var(--rose-soft);
  border: 1px solid var(--rose-line);
  border-radius: 14px;
  padding: 10px 14px;
  margin-top: 10px;
  display: none;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
.piano-quiz-txt {
  font-size: 13px;
  font-weight: 700;
  color: var(--rose-ink);
}
.piano-quiz-btn {
  background: var(--rose-ink);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 5px 11px;
  font-size: 11.5px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
}

/* ============ Sejong curriculum spine ============ */
.view-tabs{
  display:flex;gap:6px;margin:2px 0 14px;
  padding:4px;border-radius:var(--r-pill);
  background:var(--cream-2);border:1px solid var(--line);
}
.view-tab{
  flex:1;min-width:0;padding:8px 10px;
  border:none;background:transparent;border-radius:var(--r-pill);
  font-family:inherit;font-size:var(--fs-label);font-weight:700;
  color:var(--ink-2);cursor:pointer;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
  transition:background .15s ease,color .15s ease;
}
.view-tab:hover{color:var(--ink)}
.view-tab.on{background:var(--paper);color:var(--rose-ink);box-shadow:0 2px 8px -4px rgba(43,37,32,.35)}

/* ============ Books: the Nepali-medium reference shelf ============ */
.bk-lead{
  margin:0 0 14px;font-size:var(--fs-body);line-height:1.62;color:var(--ink-2);
  max-width:62ch;
}
.bk-tabs{margin-bottom:18px;flex-wrap:wrap}
/* seven tabs at 390 px: a lone tab that grows fills the row and reads like a
   heading, so each tab is a fixed third and never grows. 3 + 3 + 1. */
.bk-tabs .view-tab{flex:0 0 calc(33.333% - 6px);min-width:0}
@media (min-width:560px){ .bk-tabs .view-tab{flex:1 1 0} }
.bk-h{
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  margin:22px 0 10px;font-size:var(--fs-title);color:var(--ink);font-weight:800;
}
.bk-src{
  font-size:var(--fs-micro);font-weight:700;letter-spacing:.04em;
  color:var(--ink-3);text-transform:none;
  padding:2px 7px;border-radius:var(--r-pill);
  background:var(--cream-2);border:1px solid var(--line);
}
.bk-note{
  margin:12px 0 0;font-size:var(--fs-label);line-height:1.6;color:var(--ink-3);
  max-width:64ch;
}
.bk-prov{margin-top:26px;padding-top:14px;border-top:1px solid var(--line)}

/* ============ Books: the dictionary (CS1 p189–233) ============ */
.bk-dsearch{position:relative;margin:14px 0 12px}
.bk-dsearch input{
  width:100%;box-sizing:border-box;padding:12px 40px 12px 14px;
  font-family:inherit;font-size:var(--fs-body);color:var(--ink);
  background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r-2);
  -webkit-appearance:none;appearance:none;
}
.bk-dsearch input::placeholder{color:var(--ink-3)}
.bk-dsearch input:focus{outline:none;border-color:var(--rose-line);box-shadow:0 0 0 3px var(--rose-soft)}
.bk-dclear{
  position:absolute;top:50%;right:6px;transform:translateY(-50%);
  width:30px;height:30px;display:grid;place-items:center;
  background:none;border:0;border-radius:var(--r-1);
  color:var(--ink-3);font-size:14px;cursor:pointer;font-family:inherit;
}
.bk-dclear:hover{background:var(--cream-2);color:var(--ink)}

.bk-dchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}

/* the dictionary, its word lists and its two pair tables are one screen */
.bk-dmodes{
  display:flex;flex-wrap:wrap;gap:4px;margin:14px 0 0;padding:4px;
  background:var(--cream-2);border:1px solid var(--line);border-radius:var(--r-2);
}
/* four labels at 390 px: one row would squeeze समानार्थी past legibility,
   so they sit two by two until there is room for four. */
.bk-dmode{
  flex:1 1 calc(50% - 2px);min-width:0;padding:9px 4px;
  font-family:inherit;font-size:var(--fs-label);font-weight:700;color:var(--ink-2);
  background:none;border:0;border-radius:var(--r-1);cursor:pointer;
  transition:background .12s ease,color .12s ease;
}
@media (min-width:560px){ .bk-dmode{flex:1 1 0} }
.bk-dmode i{
  display:block;font-style:normal;font-size:9px;font-weight:600;
  color:var(--ink-3);line-height:1.2;margin-top:1px;font-variant-numeric:tabular-nums;
}
.bk-dmode:hover{background:var(--paper)}
.bk-dmode.on{background:var(--rose-ink);color:var(--paper)}
.bk-dmode.on i{color:var(--rose-soft)}
/* 22 topics do not fit a chip row; a picker is smaller than a scroller that
   hides half its options. */
.bk-dsel{
  display:block;width:100%;margin:0 0 10px;padding:11px 12px;
  font-family:inherit;font-size:var(--fs-label);font-weight:700;color:var(--ink);
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r-1);
  cursor:pointer;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),
                   linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.bk-dsel:focus-visible{outline:2px solid var(--rose-ink);outline-offset:1px}
/* the book's * and bullet: a woman says this term, a man says that one */
.bk-d-g{
  font-style:normal;font-weight:700;font-size:11px;color:var(--rose-ink);
  margin-left:3px;vertical-align:super;line-height:0;
}
/* the corrections card — the book has real errors and they are listed, not
   silently fixed and not silently copied */
/* the sign boards: each card is a whole sentence, so it gets a plaque rather
   than a one-line row. One column at 390, two at 560, three at 900. */
.bk-sgrid{display:grid;grid-template-columns:1fr;gap:9px;margin:0 0 4px}
@media (min-width:560px){ .bk-sgrid{grid-template-columns:1fr 1fr} }
@media (min-width:900px){ .bk-sgrid{grid-template-columns:1fr 1fr 1fr} }
.bk-scard{
  display:block;width:100%;text-align:left;padding:12px 13px 13px;
  font-family:inherit;background:var(--paper);border:1px solid var(--line);
  border-left:3px solid var(--rose-soft);border-radius:var(--r-2);
  cursor:pointer;transition:border-color .12s ease,transform .12s ease;
}
.bk-scard:hover{border-left-color:var(--rose-ink)}
.bk-scard:active{transform:scale(.995)}
.bk-s-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.bk-s-sign{
  display:block;font-size:16px;font-weight:700;color:var(--ink);line-height:1.35;
  letter-spacing:.01em;
}
.bk-s-pg{
  flex:none;font-size:9px;font-weight:700;color:var(--ink-3);
  font-variant-numeric:tabular-nums;padding-top:3px;
}
.bk-s-ko{
  display:block;font-size:var(--fs-small);color:var(--ink-2);line-height:1.5;
  margin-top:7px;
}
.bk-s-ne{
  display:block;font-size:var(--fs-small);color:var(--ink);line-height:1.6;
  margin-top:5px;padding-top:6px;border-top:1px dashed var(--line);
}
.bk-s-nil{
  color:var(--ink-3);font-style:italic;border-top-style:dotted;
}
.bk-fix{
  margin:16px 0 0;padding:0 14px;border:1px solid var(--line);
  border-radius:var(--r-2);background:var(--cream-2);
}
.bk-fix summary{
  padding:11px 0;cursor:pointer;font-size:var(--fs-label);font-weight:700;
  color:var(--ink-2);line-height:1.45;
}
.bk-fix summary::marker{color:var(--ink-3)}
.bk-fix ul{margin:0 0 12px;padding-left:18px}
.bk-fix li{font-size:var(--fs-small);color:var(--ink-2);line-height:1.6;margin-bottom:7px}.bk-dchip{
  position:relative;min-width:40px;padding:8px 9px 7px;
  font-family:inherit;font-size:16px;font-weight:700;color:var(--ink);
  background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r-1);
  cursor:pointer;transition:background .12s ease,border-color .12s ease,color .12s ease;
}
.bk-dchip i{
  display:block;font-style:normal;font-size:9px;font-weight:600;
  letter-spacing:.02em;color:var(--ink-3);line-height:1.1;margin-top:1px;
}
.bk-dchip:hover{background:var(--rose-soft);border-color:var(--rose-line)}
.bk-dchip.on{background:var(--rose-ink);border-color:var(--rose-ink);color:var(--paper)}
.bk-dchip.on i{color:var(--rose-soft)}
.bk-dchip.gone{
  color:var(--ink-3);background:var(--cream-2);
  border-style:dashed;cursor:not-allowed;opacity:.55;
}
/* the sign-board groups are phrases, not single jamo — the letter chip's 16 px
   turns a four-word heading into a block */
.bk-wchip{font-size:var(--fs-small);padding:9px 12px 8px}
.bk-wchip i{display:inline;margin:0 0 0 5px;font-size:10px;font-weight:700}

.bk-dmeta{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  margin:0 0 8px;font-size:var(--fs-micro);color:var(--ink-3);
  font-variant-numeric:tabular-nums;
}
.bk-dgone{text-align:right;max-width:60%;line-height:1.35}

.bk-drows{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line)}
.bk-drow{
  display:grid;
  grid-template-columns:auto 1fr auto;
  grid-template-areas:"ko dev pg" "ko ne ne";
  align-items:center;column-gap:9px;row-gap:0;
  width:100%;padding:7px 4px;text-align:left;
  background:none;border:0;border-bottom:1px solid var(--line);
  font-family:inherit;cursor:pointer;transition:background .1s ease;
}
.bk-drow:hover{background:var(--rose-soft)}
.bk-d-ko{
  grid-area:ko;
  font-size:18px;font-weight:700;color:var(--ink);
  min-width:62px;line-height:1.3;
}
.bk-d-dev{grid-area:dev;font-size:11px;color:var(--rose-ink);font-weight:600;line-height:1.3}
.bk-d-ne{
  grid-area:ne;font-size:var(--fs-label);color:var(--ink);line-height:1.35;
}
.bk-d-ne i{font-style:normal;color:var(--ink-3);font-size:var(--fs-micro)}
.bk-d-pg{
  grid-area:pg;align-self:start;margin-top:2px;font-size:9px;font-weight:700;letter-spacing:.03em;
  color:var(--ink-3);background:var(--cream-2);
  border:1px solid var(--line);border-radius:var(--r-pill);
  padding:1px 5px;white-space:nowrap;
}
.bk-more{
  display:block;width:100%;margin:12px 0 0;padding:11px;
  font-family:inherit;font-size:var(--fs-label);font-weight:700;color:var(--rose-ink);
  background:var(--paper);border:1px solid var(--rose-line);border-radius:var(--r-2);
  cursor:pointer;
}
.bk-more:hover{background:var(--rose-soft)}
.bk-dempty{text-align:center;padding:22px 0}

/* home entry — the books screen lives under the पाठ nav group, so without this
   it is only reachable by finding the tab strip on the Sejong screen */
.bk-promo{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;
  width:100%;margin:0 0 14px;padding:13px 15px;text-align:left;
  background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r-2);
  font-family:inherit;cursor:pointer;transition:background .12s ease,border-color .12s ease;
}
.bk-promo:hover{background:var(--rose-soft);border-color:var(--rose-line)}
.bk-promo-k{
  display:grid;place-items:center;width:38px;height:38px;flex:none;
  border-radius:var(--r-1);background:var(--cream-2);border:1px solid var(--line);
  font-size:18px;font-weight:700;color:var(--rose-ink);
}
.bk-promo-t{min-width:0}
.bk-promo-t b{display:block;font-size:var(--fs-label);color:var(--ink);line-height:1.4}
.bk-promo-t i{display:block;font-style:normal;font-size:var(--fs-micro);color:var(--ink-3);line-height:1.5;margin-top:2px}
.bk-promo-arrow{color:var(--rose-ink);font-size:16px;font-weight:700}

/* composer */
.bk-compose{margin:0 0 6px}
.bk-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.bk-k{
  min-width:38px;height:38px;padding:0 6px;
  border:1px solid var(--line-2);border-radius:var(--r-1);
  background:var(--paper);color:var(--ink);
  font-family:inherit;font-size:17px;font-weight:700;line-height:1;
  cursor:pointer;transition:background .12s ease,border-color .12s ease;
}
.bk-k:hover{background:var(--cream-2)}
.bk-k.on{background:var(--rose-soft);border-color:var(--rose-line);color:var(--rose-ink)}
.bk-k.tense{color:var(--ink-3)}
.bk-k.tense.on{color:var(--rose-ink)}

.bk-res{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  margin:6px 0 4px;padding:18px 14px;
  background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r-3);
  cursor:pointer;transition:background .12s ease;
}
.bk-res:hover{background:var(--cream-2)}
.bk-res:focus-visible{outline:2px solid var(--rose-ink);outline-offset:3px}
.bk-res-j{font-size:52px;font-weight:700;line-height:1.1;color:var(--ink)}
.bk-res-dev{font-size:26px;font-weight:700;color:var(--rose-ink);line-height:1.3}
.bk-res-sub{font-size:var(--fs-micro);color:var(--ink-3);letter-spacing:.03em;margin-top:4px}

/* letter tables */
.bk-table{
  width:100%;border-collapse:collapse;margin:0 0 4px;
  font-size:var(--fs-label);background:var(--paper);
  border:1px solid var(--line);border-radius:var(--r-2);overflow:hidden;
}
.bk-table th{
  text-align:left;padding:7px 8px;font-size:var(--fs-micro);font-weight:800;
  letter-spacing:.03em;color:var(--ink-3);background:var(--cream-2);
  border-bottom:1px solid var(--line);white-space:nowrap;
}
.bk-table td{padding:7px 8px;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:middle}
.bk-table tr:last-child td{border-bottom:none}
.bk-table tr.on{background:var(--rose-soft)}
.bk-td-j{font-size:17px;font-weight:700;color:var(--ink);width:1%}
.bk-td-dev{font-size:15px;color:var(--ink);width:1%}
.bk-td-rom{font-size:var(--fs-micro);color:var(--ink-3);width:1%;white-space:nowrap}
.bk-td-ex{cursor:pointer;white-space:nowrap}
.bk-td-ex:hover{color:var(--rose-ink)}
.bk-td-ex em{font-style:normal;font-size:16px;color:var(--rose-ink);margin-left:4px}
.bk-td-tag{font-size:var(--fs-micro);color:var(--ink-3);width:1%}

/* rule cards */
.bk-rule{
  margin:0 0 14px;padding:14px 15px;
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r-2);
}
.bk-rule header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bk-rule h3{margin:0 0 6px;font-size:var(--fs-lead);font-weight:800;color:var(--ink)}
.bk-rule p{margin:0 0 10px;font-size:var(--fs-label);line-height:1.66;color:var(--ink-2)}
.bk-unit{color:var(--rose-ink)}
.bk-unit button,button.bk-unit{
  background:none;border:none;padding:0;font-family:inherit;
  font-size:inherit;font-weight:800;color:var(--rose-ink);cursor:pointer;
  border-bottom:1px dotted var(--rose-line);
}
button.bk-unit:hover{color:var(--ink)}
.bk-exs,.bk-crows{display:flex;flex-direction:column;gap:5px}
.bk-ex,.bk-crow{
  display:grid;align-items:baseline;gap:8px;
  padding:7px 9px;text-align:left;width:100%;
  border:1px solid var(--line);border-radius:var(--r-1);
  background:var(--cream);color:var(--ink);font-family:inherit;cursor:pointer;
  transition:background .12s ease,border-color .12s ease;
}
.bk-ex{grid-template-columns:auto 1fr}
.bk-ex:hover,.bk-crow:hover{background:var(--rose-soft);border-color:var(--rose-line)}
.bk-ex-j{font-size:16px;font-weight:700;white-space:nowrap}
.bk-ex-dev{font-size:var(--fs-label);color:var(--rose-ink);font-weight:700;white-space:nowrap}
.bk-ex-ne{grid-column:1 / -1;font-size:var(--fs-micro);color:var(--ink-3);line-height:1.5}

.bk-crow{grid-template-columns:auto auto 1fr auto}
.bk-c1{font-size:15px;font-weight:700;color:var(--ink)}
.bk-c2{font-size:var(--fs-label);color:var(--ink-2);white-space:nowrap}
.bk-c3{font-size:var(--fs-label);color:var(--rose-ink);font-weight:700;white-space:nowrap}
.bk-c4{font-size:var(--fs-micro);color:var(--ink-3);text-align:right;white-space:nowrap}

/* greetings */
.bk-greets{display:flex;flex-direction:column;gap:6px}
.bk-greet{
  display:grid;grid-template-columns:1fr auto;gap:2px 10px;
  padding:10px 12px;text-align:left;width:100%;
  border:1px solid var(--line);border-radius:var(--r-1);
  background:var(--paper);font-family:inherit;cursor:pointer;
  transition:background .12s ease,border-color .12s ease;
}
.bk-greet:hover{background:var(--rose-soft);border-color:var(--rose-line)}
.bk-g-j{font-size:16px;font-weight:700;color:var(--ink);line-height:1.5}
.bk-g-ne{font-size:var(--fs-label);color:var(--ink-2);line-height:1.5;grid-column:1}
.bk-g-tag{
  grid-row:1 / 3;grid-column:2;align-self:center;
  font-size:var(--fs-micro);color:var(--ink-3);white-space:nowrap;
  padding:2px 7px;border-radius:var(--r-pill);background:var(--cream-2);border:1px solid var(--line);
}

/* grammar tab — one row shape for every example, three for the tables */
.bk-grows{display:flex;flex-direction:column;gap:5px}
.bk-grow{
  display:grid;grid-template-columns:auto 1fr auto;gap:1px 10px;
  padding:8px 10px;text-align:left;width:100%;
  border:1px solid var(--line);border-radius:var(--r-1);
  background:var(--cream);font-family:inherit;cursor:pointer;
  transition:background .12s ease,border-color .12s ease;
}
.bk-grow:hover{background:var(--rose-soft);border-color:var(--rose-line)}
.bk-g-ko{
  grid-column:1;font-size:15px;font-weight:700;color:var(--ink);
  line-height:1.45;align-self:center;
}
.bk-g-dev{
  grid-column:2;font-size:var(--fs-label);font-weight:700;color:var(--rose-ink);
  line-height:1.45;
}
.bk-g-ne{
  grid-column:1 / 3;font-size:var(--fs-micro);color:var(--ink-3);line-height:1.5;
}
.bk-g-tag{
  grid-row:1 / 3;grid-column:3;align-self:center;
  font-size:var(--fs-micro);color:var(--ink-3);white-space:nowrap;
  padding:2px 7px;border-radius:var(--r-pill);
  background:var(--paper);border:1px solid var(--line);
}

/* collapsibles: the six-tense grid and the seven irregular classes */
.bk-det{
  margin:0 0 7px;border:1px solid var(--line);border-radius:var(--r-2);
  background:var(--paper);overflow:hidden;
}
.bk-det summary{
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  padding:11px 13px;cursor:pointer;list-style:none;
  font-size:var(--fs-label);color:var(--ink);
}
.bk-det summary::-webkit-details-marker{display:none}
.bk-det summary::after{
  content:"＋";margin-left:auto;font-size:13px;font-weight:800;
  color:var(--ink-3);line-height:1;
}
.bk-det[open] summary::after{content:"−"}
.bk-det summary b{font-size:var(--fs-lead);font-weight:800}
.bk-det summary span{font-size:var(--fs-micro);color:var(--ink-3)}
.bk-det summary i{
  font-style:normal;font-size:var(--fs-micro);font-weight:700;
  color:var(--rose-ink);padding:1px 7px;border-radius:var(--r-pill);
  background:var(--rose-soft);border:1px solid var(--rose-line);
}
.bk-det[open] summary{border-bottom:1px solid var(--line)}
.bk-det-ne{
  margin:0;padding:10px 13px 0;font-size:var(--fs-label);line-height:1.65;
  color:var(--ink-2);
}
.bk-trows,.bk-irows{
  display:flex;flex-direction:column;gap:4px;padding:10px 13px 13px;
}

/* the rotated six-tense table */
.bk-trow{
  display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:baseline;
  padding:7px 9px;text-align:left;width:100%;
  border:1px solid var(--line);border-radius:var(--r-1);
  background:var(--cream);font-family:inherit;cursor:pointer;
  transition:background .12s ease;
}
.bk-trow:hover{background:var(--rose-soft)}
.bk-t-lab{
  grid-column:1;font-size:var(--fs-micro);font-weight:700;color:var(--ink-3);
  white-space:nowrap;
}
.bk-t-ko{grid-column:2;font-size:15px;font-weight:700;color:var(--ink);line-height:1.45}
.bk-t-dev{
  grid-column:3;font-size:var(--fs-micro);font-weight:700;color:var(--rose-ink);
  white-space:nowrap;
}

/* the irregular classes */
.bk-irow{
  display:grid;grid-template-columns:auto auto 1fr;gap:1px 6px;align-items:baseline;
  padding:7px 9px;text-align:left;width:100%;
  border:1px solid var(--line);border-radius:var(--r-1);
  background:var(--cream);font-family:inherit;cursor:pointer;
  transition:background .12s ease;
}
.bk-irow:hover{background:var(--rose-soft)}
.bk-i-dict{grid-column:1;font-size:15px;font-weight:700;color:var(--ink-3)}
.bk-i-arrow{grid-column:2;font-size:11px;color:var(--line-2)}
.bk-i-conj{grid-column:3;font-size:15px;font-weight:700;color:var(--ink)}
.bk-i-dev{
  grid-column:1 / 3;font-size:var(--fs-micro);font-weight:700;color:var(--rose-ink);
}
.bk-i-ne{grid-column:3;font-size:var(--fs-micro);color:var(--ink-3);text-align:right}

/* conjunctions */
.bk-conj h3{display:flex;align-items:baseline;gap:7px}
.bk-conj-n{
  display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;
  border-radius:var(--r-pill);background:var(--cream-2);border:1px solid var(--line);
  font-size:var(--fs-micro);font-weight:800;color:var(--ink-3);
}

@media (max-width:420px){
  .bk-table{font-size:12px}
  .bk-table th,.bk-table td{padding:6px}
  .bk-td-rom{display:none}
  .bk-table thead th:nth-child(3){display:none}
  .bk-res-j{font-size:44px}
  .bk-crow{grid-template-columns:auto 1fr auto;row-gap:2px}
  .bk-c4{grid-column:2 / -1;text-align:left}
}

/* ========================================================

// Language State: 'ne' (Nepali) or 'en' (English / Roman English)
// This site is built for Nepali learners, so Nepali is the default.
let LANG = "ne";
try {
  const saved = localStorage.getItem("hangul_lang_pref");
  if (saved === "ne" || saved === "en") LANG = saved;
} catch(e) {}
document.documentElement.lang = LANG;

function setLanguage(l) {
  LANG = l;
  try { localStorage.setItem("hangul_lang_pref", l); } catch(e) {}
  document.documentElement.lang = l;
  renderApp();
}

// Global Navigation Flow Stack
let FLOW_HISTORY = ["home"];

// Bilingual Localization Dictionary

const VOWELS_COMPOUND = [

// Korean Phonetic Normalization & Spoken Jamo Dictionary
const JAMO_SPOKEN_MAP = {
  // Basic vowels -> full syllables with zero-consonant ㅇ
  "ㅏ": "아", "ㅑ": "야", "ㅓ": "어", "ㅕ": "여", "ㅗ": "오",
  "ㅛ": "요", "ㅜ": "우", "ㅠ": "유", "ㅡ": "으", "ㅣ": "이",
  // Compound vowels
  "ㅐ": "애", "ㅒ": "얘", "ㅔ": "에", "ㅖ": "예",
  "ㅘ": "와", "ㅙ": "왜", "ㅚ": "외", "ㅝ": "워",
  "ㅞ": "웨", "ㅟ": "위", "ㅢ": "의",
  // Basic consonants -> syllable sounds
  "ㄱ": "가", "ㄴ": "나", "ㄷ": "다", "ㄹ": "라", "ㅁ": "마",
  "ㅂ": "바", "ㅅ": "사", "ㅇ": "아", "ㅈ": "자", "ㅊ": "차",
  "ㅋ": "카", "ㅌ": "타", "ㅍ": "파", "ㅎ": "하",
  // Double consonants
  "ㄲ": "까", "ㄸ": "따", "ㅃ": "빠", "ㅆ": "싸", "ㅉ": "짜"
};

function normalizeKorean(txt) {
  if (!txt) return "";
  txt = String(txt).trim();
  if (JAMO_SPOKEN_MAP[txt]) return JAMO_SPOKEN_MAP[txt];

  // If passed two jamos like "ㄱ" + "ㅏ", compose them into "가"
  if (txt.length >= 2) {
    const ci = CI.indexOf(txt[0]);
    const vi = VI.indexOf(txt[1]);
    if (ci !== -1 && vi !== -1) {
      if (txt.length === 2) return syl(txt[0], txt[1]);
      const fi = FI.indexOf(txt[2]);
      if (fi !== -1) return syl3(txt[0], txt[1], txt[2]);
    }
  }
  return txt;
}

let COURSE_FILTER_PHASE = "all";
let COURSE_SEARCH_QUERY = "";
let COURSE_COMPLETED = JSON.parse(localStorage.getItem("hangul_course_completed") || "[]");

function getCourseCompletedCount() {
  return COURSE_COMPLETED.length;
}

function getCourseProgressText() {
  const done = COURSE_COMPLETED.length;
  const pct = Math.round((done / 44) * 100);
  if (LANG === "ne") {
    return `${done} / 44 दिन पूरा भयो (${pct}%)`;
  } else {
    return `${done} / 44 Days Completed (${pct}%)`;
  }
}

function toggleDayComplete(day, e) {
  if (e) e.stopPropagation();
  const idx = COURSE_COMPLETED.indexOf(day);
  if (idx === -1) {
    COURSE_COMPLETED.push(day);
    const g = ensureGame();
    g.stats.courseDays = COURSE_COMPLETED.length;
    saveGame();
    addXp(20, "silent");
    trackGame("lessons");
    toast("+" + 20 + " XP · " + (LANG === "ne" ? "दिन पूरा" : "day done"), "xp");
  } else {
    COURSE_COMPLETED.splice(idx, 1);
  }
  localStorage.setItem("hangul_course_completed", JSON.stringify(COURSE_COMPLETED));

/* The "Sejong 1A" tab used to guess membership from a category list, so it
   showed words that merely sounded textbook-y and hid the unit words that never
   made it into VOCAB_WORDS. It reads the spine now. */
function sjVocabRows() {
  const u = sjUnit();
  const unitOf = {};
  SEJONG_1A.forEach(x => x.words.forEach(([ko]) => { if (!unitOf[ko]) unitOf[ko] = x.u; }));
  const rows = [];
  const seen = {};
  VOCAB_WORDS.forEach(w => {
    if (!unitOf[w.ko]) return;
    if (u && unitOf[w.ko] !== u) return;
    seen[w.ko] = 1;
    rows.push(Object.assign({}, w, { sj: unitOf[w.ko] }));
  });
  sjWordsOf(u).forEach(([ko, ne]) => {
    if (seen[ko]) return;
    seen[ko] = 1;
    rows.push({ ko, ne, en: ne, pron: "", cat: "Sejong 1A", emoji: "📘", sj: unitOf[ko] || u });
  });
  return rows;
}

function getFilteredVocab() {
  const base = VOCAB_ACTIVE_CAT === "sejong" ? sjVocabRows() : VOCAB_WORDS;
  return base.filter(w => {

/* Every jamo -> the clean neural clip in audio/pron/ that speaks its example
   syllable. In Nepali accent, audio/pron/ has authentic Nepali neural recordings. */
const PRON_SLUG = {
  "ㅏ": "a", "ㅑ": "ya", "ㅓ": "eo", "ㅕ": "yeo", "ㅗ": "o", "ㅛ": "yo",
  "ㅜ": "u", "ㅠ": "yu", "ㅡ": "eu", "ㅣ": "i",
  "ㅐ": "ae", "ㅒ": "yae", "ㅔ": "e", "ㅖ": "ye", "ㅘ": "wa", "ㅙ": "wae",
  "ㅚ": "oe", "ㅝ": "wo", "ㅞ": "we", "ㅟ": "wi", "ㅢ": "ui",
  "ㄱ": "g", "ㄴ": "n", "ㄷ": "d", "ㄹ": "r", "ㅁ": "m", "ㅂ": "b",
  "ㅅ": "s", "ㅇ": "ng", "ㅈ": "j", "ㅊ": "ch", "ㅋ": "k", "ㅌ": "t",
  "ㅍ": "p", "ㅎ": "h",
  "ㄲ": "kk", "ㄸ": "tt", "ㅃ": "pp", "ㅆ": "ss", "ㅉ": "jj"
};

function pronSrc(ch) {
  const s = PRON_SLUG[ch];
  if (!s) return "";
  if (AUDIO_ACCENT === "ko") {
    return "audio/pron_ko/" + s + ".mp3";
  }
  return "audio/pron/" + s + ".mp3";
}

/* Play a letter's baked clip; anything that is not a single jamo falls through
   to the normal say() chain so this is safe to call from shared controls. */
function sayPron(ch, btnEl) {
  const src = pronSrc(ch);
  if (!src) { say(ch, btnEl); return; }
  const el = btnEl || (typeof window !== "undefined" && window.event ? window.event.currentTarget : null);
  if (el && el.classList) {
    el.classList.add("playing-sound");
    setTimeout(() => el.classList.remove("playing-sound"), 1000);
  }
  playClip(src, function () { say(ch); });
}

/* ---- Tier 0: the baked library ----------------------------------------
   Every syllable, batchim combination and curated word the app can speak was
   synthesised once into audio/lib/. The file name is the string's codepoints in
   hex, so the browser derives it with no index — which matters, because
   fetch() of a local JSON is blocked on file://. Opened straight off disk this
   tier is the only one that works, and it covers everything except free text. */
const _libMiss = Object.create(null);
const LIB_MISS_TTL = 30000;

/* A miss must expire. This was a permanent latch, so one click made while a clip
   was still missing poisoned that string for the rest of the page session — the
   file could land on disk a second later and every tap would still skip tier 1
   and fall through to a 404. Thirty seconds is long enough to avoid hammering
   the network on a genuinely absent file, short enough that a rebuilt library
   is picked up without a reload. */
function libMissed(key) {
  const at = _libMiss[key];
  if (!at) return false;
  if (Date.now() - at > LIB_MISS_TTL) { delete _libMiss[key]; return false; }
  return true;
}

function libSrc(txt, accent) {
  const acc = accent || AUDIO_ACCENT;
  let out = acc === "ko" ? "audio/lib_ko/" : "audio/lib/";
  for (let i = 0; i < txt.length; i++) {
    if (i) out += "-";
    out += txt.codePointAt(i).toString(16);
    if (txt.codePointAt(i) > 0xffff) i++;
  }
  return out + ".mp3";
}

/* Both libraries are not the same size. audio/lib_ko carries the Korean-native
   voice and is built separately, so any string added after that build exists in
   one library only. Play the preferred accent, then the other library, then give
   up to the network. A missing voice is a worse outcome than the wrong accent. */
function playTier1(txt, onMissing) {
  const first = libSrc(txt, AUDIO_ACCENT);
  const second = libSrc(txt, AUDIO_ACCENT === "ko" ? "ne" : "ko");
  playClip(first, function () {
    if (second === first) { onMissing(); return; }
    playClip(second, onMissing);
  });
}

function stopAudio() {
  if (_currentAudio) {
    try { _currentAudio.pause(); } catch (e) {}
    _currentAudio = null;
  }
}

/* Play one URL. onMissing fires only for a real load failure (missing file,
   bad codec) — never for an autoplay rejection, which is a policy issue and
   should not send us chasing a different source. */
function playClip(src, onMissing) {
  try {
    stopAudio();
    const au = new Audio(src);
    au.playbackRate = AUDIO_RATE;
    au.defaultPlaybackRate = AUDIO_RATE;
    _currentAudio = au;
    let settled = false;
    const miss = function () {
      if (settled) return;
      settled = true;
      try { au.pause(); } catch (e) {}
      if (onMissing) onMissing();
    };
    au.addEventListener("error", miss);
    const p = au.play();
    if (p !== undefined) p.catch(function () {
      if (au.error) miss();
    });
    return au;
  } catch (e) {
    if (onMissing) onMissing();
    return null;
  }
}

function say(rawTxt, btnEl) {
  const txt = normalizeKorean(rawTxt);
  if (!txt) return;

  // Add visual playing pulse to clicked button or event target
  const el = btnEl || (typeof window !== "undefined" && window.event ? window.event.currentTarget : null);
  if (el && el.classList) {
    el.classList.add("playing-sound");
    setTimeout(() => el.classList.remove("playing-sound"), 1000);
  }

  const cacheKey = AUDIO_ACCENT + ":" + txt;
  if (libMissed(cacheKey)) { sayRemote(txt); return; }
  playTier1(txt, function () {
    _libMiss[cacheKey] = Date.now();
    sayRemote(txt);
  });
}

/* Tier 1: /api/tts when server.py is running.
   Tier 2: the browser's speech synthesis.
   Tier 3: one toast, because silence with no explanation is the worst result. */
function sayRemote(txt) {
  try {
    stopAudio();
    const au = new Audio("/api/tts?v=" + Date.now() + "&accent=" + encodeURIComponent(AUDIO_ACCENT) + "&q=" + encodeURIComponent(txt));
    au.playbackRate = AUDIO_RATE;
    au.defaultPlaybackRate = AUDIO_RATE;
    _currentAudio = au;
    let settled = false;
    const fallback = function () {
      if (settled) return;
      settled = true;
      if (speakWithWebSpeech(txt)) return;
      ttsWarnOnce();
    };
    au.addEventListener("error", fallback);
    const p = au.play();
    if (p !== undefined) p.catch(function () {
      if (au.error) fallback();
    });
    return;
  } catch (e) {
    if (!speakWithWebSpeech(txt)) ttsWarnOnce();
  }
}

function speakWithWebSpeech(txt) {
  try {
    if (!("speechSynthesis" in window) || !window.SpeechSynthesisUtterance) return false;
    if (!_sysVoices.length) {
      _sysVoices = speechSynthesis.getVoices() || [];
    }
    const kv = _sysVoices.find(x => x.lang === "ko-KR" || x.lang === "ko_KR" || /^ko/i.test(x.lang));
    // No voices at all means speak() is a silent no-op on most Linux setups
    if (!kv && !_sysVoices.length) return false;
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = "ko-KR";
    u.rate = AUDIO_RATE;
    if (kv) u.voice = kv;
    speechSynthesis.speak(u);
    return true;
  } catch (e) { return false; }
}

/* Chrome populates getVoices() asynchronously and returns [] on the first call.
   Without a warm-up, the first phrase that needs the fallback decides there is
   no Korean voice and that answer sticks for the session. */
(function warmVoices() {
  try {
    if (!("speechSynthesis" in window)) return;
    const load = function () { _sysVoices = speechSynthesis.getVoices() || []; };
    load();
    speechSynthesis.addEventListener("voiceschanged", load);
  } catch (e) {}
})();

// Navigation Flow Control
function navigateTo(screenId) {
  if (FLOW_HISTORY[FLOW_HISTORY.length - 1] !== screenId) {
    FLOW_HISTORY.push(screenId);
  }
  window.scrollTo({ top: 0, behavior: "smooth" });
  renderApp();
}

function goBack() {
  if (FLOW_HISTORY.length > 1) {
    FLOW_HISTORY.pop();
    window.scrollTo({ top: 0, behavior: "smooth" });
    renderApp();
  } else {
    FLOW_HISTORY = ["home"];
    renderApp();
  }
}

function currentScreen() {
  return FLOW_HISTORY[FLOW_HISTORY.length - 1] || "home";
}

/* ========================================================
   VIEWS: Guided Step-by-Step Architecture
   ======================================================== */

/* ========================================================
   VIEW: पुस्तक — the Nepali-medium reference shelf

   Three printed Nepali-language Korean textbooks, transcribed by hand. What
   they carry that nothing else on this site does is the Devanagari reading:
   every Korean form written the way a Nepali speaker actually writes it,
   rather than in Revised Romanisation. 아 is आ, not "a". 어 is अ, not "eo".
   That mapping is the reason this screen exists — it is the pronunciation
   the audio library was built for, finally spelled out on screen.

   Provenance is per-section, because a reference you cannot check is a
   rumour. BKL = "Basic Korean Language Book" (83 pp), CS1 = the 239-page
   scan, CS2 = the 245-page scan. Page numbers are the printed ones.
   ======================================================== */
const BOOK_SOURCES = {
  BKL: { ne: "आधारभूत कोरियन भाषा पुस्तक", en: "Basic Korean Language Book", pages: 83 },
  CS1: { ne: "कोरियन भाषा (नेपाली माध्यम)", en: "Korean Language, Nepali medium", pages: 239 },
  CS2: { ne: "आधारभूत कोरियन भाषा", en: "Basic Korean, Nepali medium", pages: 245 }
};

/* Consonant -> the Devanagari letter that carries it. The last field marks the
   tense (कठोर) consonants: 된소리 has no separate Devanagari letter, so ㄲ is
   written क and marked, which is honest — inventing a glyph would be a lie the
   learner cannot unlearn. */
const BOOK_CONS = [
  ["ㄱ", "g",  "ग", 0], ["ㄴ", "n",  "न", 0], ["ㄷ", "d",  "द", 0],
  ["ㄹ", "r/l","र", 0], ["ㅁ", "m",  "म", 0], ["ㅂ", "b",  "ब", 0],
  ["ㅅ", "s",  "स", 0], ["ㅇ", "—",  "",  0], ["ㅈ", "j",  "ज", 0],
  ["ㅊ", "chh","छ", 0], ["ㅋ", "kh", "ख", 0], ["ㅌ", "th", "थ", 0],
  ["ㅍ", "ph", "फ", 0], ["ㅎ", "h",  "ह", 0],
  ["ㄲ", "kk", "क", 1], ["ㄸ", "tt", "ट", 1], ["ㅃ", "pp", "प", 1],
  ["ㅆ", "ss", "स", 1], ["ㅉ", "jj", "च", 1]
];

/* Vowel -> [standalone Devanagari, matra to hang on a consonant].
   ㅓ is the interesting one: it takes no matra at all, so 거 is simply ग.
   Korean ㅓ sits where Nepali अ sits, and Korean ㅏ where Nepali आ sits. */
const BOOK_VOWEL = {
  "ㅏ": ["आ",  "ा"],  "ㅑ": ["या",  "्या"], "ㅓ": ["अ",   ""],   "ㅕ": ["य",   "्य"],
  "ㅗ": ["ओ",  "ो"],  "ㅛ": ["यो",  "्यो"], "ㅜ": ["उ",   "ु"],  "ㅠ": ["यु",  "्यु"],
  "ㅡ": ["उ",  "्"],  "ㅣ": ["ई",  "ि"],
  "ㅐ": ["ए",  "े"],  "ㅒ": ["ये",  "्ये"], "ㅔ": ["ए",   "े"],  "ㅖ": ["ये",  "्ये"],
  "ㅘ": ["वा", "्वा"], "ㅙ": ["वे", "्वे"], "ㅚ": ["वे",  "्वे"], "ㅝ": ["व",   "्व"],
  "ㅞ": ["वे", "्वे"], "ㅟ": ["वइ", "्वइ"], "ㅢ": ["वइ", "्वइ"]
};

const BOOK_VOWEL_ORDER = ["ㅏ","ㅑ","ㅓ","ㅕ","ㅗ","ㅛ","ㅜ","ㅠ","ㅡ","ㅣ",
                          "ㅐ","ㅒ","ㅔ","ㅖ","ㅘ","ㅙ","ㅚ","ㅝ","ㅞ","ㅟ","ㅢ"];

/* The letter, composed. This is the same arithmetic the books print as a grid:
   consonant shape + vowel matra = syllable. ㅇ is the null initial, so it takes
   the vowel's standalone form. */
function bkRead(cons, vowel) {
  const v = BOOK_VOWEL[vowel];
  const c = BOOK_CONS.find(function (r) { return r[0] === cons; });
  if (!v || !c) return "";
  if (cons === "ㅇ") return v[0];
  return c[2] + v[1];
}

let BOOK_TAB = "letters";
let BK_CONS = "ㄱ";
let BK_VOWEL = "ㅏ";

function bkSetTab(t) { BOOK_TAB = t; renderApp(); }
function bkSetCons(c) { BK_CONS = c; renderApp(); }
function bkSetVowel(v) { BK_VOWEL = v; renderApp(); }

/* ---- section 1: the composer and the two letter tables ---- */
function bkLetters() {
  const sylNow = syl(BK_CONS, BK_VOWEL);
  const read = bkRead(BK_CONS, BK_VOWEL);
  const tense = (BOOK_CONS.find(function (r) { return r[0] === BK_CONS; }) || [])[3];

  const consChips = BOOK_CONS.map(function (r) {
    const on = r[0] === BK_CONS;
    return '<button type="button" class="bk-k' + (on ? ' on' : '') + (r[3] ? ' tense' : '') +
      '" onclick="bkSetCons(\'' + r[0] + '\')" title="' + r[1] + '">' + r[0] + '</button>';
  }).join("");

  const vowelChips = BOOK_VOWEL_ORDER.map(function (v) {
    const on = v === BK_VOWEL;
    return '<button type="button" class="bk-k' + (on ? ' on' : '') +
      '" onclick="bkSetVowel(\'' + v + '\')">' + v + '</button>';
  }).join("");

  const table = BOOK_CONS.map(function (r) {
    const ex = bkRead(r[0], "ㅏ");
    return '<tr class="' + (r[0] === BK_CONS ? 'on' : '') + '">' +
      '<td class="bk-td-j">' + r[0] + '</td>' +
      '<td class="bk-td-dev">' + (r[2] ? r[2] + '्' : '—') + '</td>' +
      '<td class="bk-td-rom">' + r[1] + '</td>' +
      '<td class="bk-td-ex" onclick="say(\'' + syl(r[0], "ㅏ") + '\', this)">' +
        syl(r[0], "ㅏ") + ' <em>' + ex + '</em></td>' +
      '<td class="bk-td-tag">' + (r[3] ? (LANG === 'ne' ? 'कठोर' : 'tense') : '') + '</td>' +
      '</tr>';
  }).join("");

  const vtable = BOOK_VOWEL_ORDER.map(function (v) {
    const pair = BOOK_VOWEL[v];
    const full = bkRead("ㅇ", v);
    return '<tr class="' + (v === BK_VOWEL ? 'on' : '') + '">' +
      '<td class="bk-td-j">' + v + '</td>' +
      '<td class="bk-td-dev">' + pair[0] + '</td>' +
      '<td class="bk-td-ex" onclick="say(\'' + full + '\', this)">' + full + '</td>' +
      '<td class="bk-td-rom">' + (pair[1] ? 'ग' + pair[1] : 'ग') + '</td>' +
      '</tr>';
  }).join("");

  return `
    <div class="bk-compose">
      <div class="bk-row">${consChips}</div>
      <div class="bk-row">${vowelChips}</div>
      <div class="bk-res" onclick="say('${sylNow}', this)" role="button" tabindex="0"
           aria-label="${LANG === 'ne' ? 'उच्चारण सुन्नुहोस्' : 'Hear it'}">
        <span class="bk-res-j">${sylNow}</span>
        <span class="bk-res-dev">${read}</span>
        <span class="bk-res-sub">${BK_CONS} + ${BK_VOWEL}${tense ? ' · ' + (LANG === 'ne' ? 'कठोर' : 'tense') : ''}</span>
      </div>
    </div>

    <h3 class="bk-h">${LANG === "ne" ? "व्यञ्जन" : "Consonants"} <span class="bk-src">BKL p3 · CS2 p4</span></h3>
    <table class="bk-table">
      <thead><tr>
        <th>${LANG === "ne" ? "अक्षर" : "Letter"}</th>
        <th>${LANG === "ne" ? "देवनागरी" : "Devanagari"}</th>
        <th>${LANG === "ne" ? "अङ्ग्रेजी" : "English"}</th>
        <th>${LANG === "ne" ? "उदाहरण" : "Example"}</th>
        <th></th>
      </tr></thead>
      <tbody>${table}</tbody>
    </table>

    <h3 class="bk-h">${LANG === "ne" ? "स्वर" : "Vowels"} <span class="bk-src">BKL p4 · CS2 p5</span></h3>
    <table class="bk-table">
      <thead><tr>
        <th>${LANG === "ne" ? "स्वर" : "Vowel"}</th>
        <th>${LANG === "ne" ? "देवनागरी" : "Devanagari"}</th>
        <th>${LANG === "ne" ? "पूर्ण अक्षर" : "Full letter"}</th>
        <th>${LANG === "ne" ? "संयोजन" : "Composed"}</th>
      </tr></thead>
      <tbody>${vtable}</tbody>
    </table>
    <p class="bk-note">${LANG === "ne"
      ? "ㅐ र ㅔ दुवैलाई पुस्तकमा ए लेखिएको छ — आधुनिक कोरियनमा यी दुईको उच्चारण लगभग एउटै भइसकेको छ। ㅚ, ㅟ, ㅢ को संयोजन पुस्तकअनुसार वे/वइ राखिएको छ।"
      : "Both ㅐ and ㅔ are written ए in these books — in modern Korean the two have merged in pronunciation. ㅚ, ㅟ and ㅢ follow the books' वे/वइ convention."}</p>
  `;
}

/* ---- section 2: the pronunciation rules ---- */

];

function bkRules() {
  return BOOK_RULES.map(function (r) {
