<html lang="ne">
<head>

<meta name="theme-color" content="#faf5ec" id="tc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<meta name="description" content="Learn Korean Hangul easily through Nepali and English with audio, stroke writing, grammar, and EPS vocabulary.">
<title>नेपालीमा हाङ्गुल — Nepali Hangul (Bilingual)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Mukta:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* paper + ink */
  --cream:#faf5ec;
  --cream-2:#f3ead9;
  --paper:#fffdf9;
  --white:#ffffff;
  --ink:#2b2520;
  --ink-2:#6f6557;
  /* Third ink step: captions, provenance, the grey that carries body-size text.
     Measured, not guessed — 5.45:1 on --paper and 4.64:1 on --cream-2, so it
     clears AA on both surfaces it actually sits on. The first value here was
     #8a7f6f, which was 3.87:1 and failed. */
  --ink-3:#726757;
  --line:#e8ddca;
  --line-2:#d8cab2;

  /* type + space + radius scale — every component below reads these instead of
     inventing a 13.5px here and a 14.5px there. Three type steps carry body
     copy, one carries UI labels, one carries numerals. */
  --fs-micro:11.5px;
  --fs-label:12.5px;
  --fs-body:15px;
  --fs-lead:16.5px;
  --fs-title:19px;
  --fs-num:34px;
  --sp-1:6px;
  --sp-2:10px;
  --sp-3:16px;
  --sp-4:24px;
  --sp-5:36px;
  --r-1:10px;
  --r-2:14px;
  --r-3:20px;
  --r-pill:999px;

  /* pastel accents (jamo art) */
  --rose:#f3b7c8;
  --rose-ink:#ad4665;
  --rose-soft:#fceff3;
  --rose-line:#f2cfda;
  --sky:#a9cfe4;
  --sky-ink:#35719a;
  --sky-soft:#eef6fb;
  --sky-line:#d6e9f4;
  --sage:#7fbf9f;
  --sage-soft:#eef8f2;

  /* legacy aliases used by inline styles */
  --bg:var(--cream);
  --tile:var(--white);
  --text:var(--ink);
  --sub:var(--ink-2);
  --fill:var(--cream-2);
  --soft:#f7f0e2;
  --red:var(--rose-ink);
  --tint:rgba(243,183,200,.30);
  --green:var(--sage);
  --gbg:var(--sage-soft);
  --rbg:var(--rose-soft);
  --blue:var(--sky-ink);
  --bbg:var(--sky-soft);
  --grad:none;
  --sh:none;
  --card-sh:none;
  color-scheme:light;
}

html.dark{
  color-scheme:dark;
  background:#17130f;
  --cream:#17130f;
  --cream-2:#241d16;
  --paper:#1d1812;
  --white:#211b14;
  --ink:#f7efe1;
  --ink-2:#b3a692;
  --ink-3:#8d8171;
  --line:#362c21;
  --line-2:#493c2d;
  --rose:#e5a0b5;
  --rose-ink:#f0a7bd;
  --rose-soft:#33222a;
  --rose-line:#4a3040;
  --sky:#9dc4dc;
  --sky-ink:#9ccbe6;
  --sky-soft:#1b2a33;
  --sky-line:#2b3d48;
  --sage:#7fd0a6;
  --sage-soft:#16281f;
  --bg:var(--cream);
  --tile:var(--white);
  --text:var(--ink);
  --sub:var(--ink-2);
  --fill:var(--cream-2);
  --soft:#241d15;
  --red:var(--rose-ink);
  --tint:rgba(229,160,181,.18);
  --green:var(--sage);
  --gbg:var(--sage-soft);
  --rbg:var(--rose-soft);
  --blue:var(--sky-ink);
  --bbg:var(--sky-soft);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  padding:20px 18px 104px;
  background-color:var(--cream);
  background-image:
    radial-gradient(900px 620px at 6% -8%, rgba(243,183,200,.34), transparent 62%),
    radial-gradient(820px 640px at 102% 104%, rgba(169,207,228,.34), transparent 62%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:"Mukta",-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-size:17px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
html.dark body{
  background-image:
    radial-gradient(900px 620px at 6% -8%, rgba(229,160,181,.10), transparent 62%),
    radial-gradient(820px 640px at 102% 104%, rgba(157,196,220,.10), transparent 62%);
}
#app{
  position:relative;
  z-index:1;
  width:100%;
  max-width:600px;
  margin:0 auto;
}
.ko{font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Mukta",sans-serif}
.ne{font-family:"Mukta",sans-serif}

/* ============ background jamo art ============ */
.bg-art{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:0;
}
.bg-art .g{
  position:absolute;
  left:var(--x);
  top:var(--y);
  font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  font-size:var(--s);
  font-weight:700;
  line-height:1;
  color:transparent;
  -webkit-text-stroke:2px var(--c);
  transform:
    translate3d(
      calc(var(--mx,0) * var(--depth,1) * 1px),
      calc(var(--my,0) * var(--depth,1) * 0.8px),
      0
    )
    rotate(calc(var(--r) + var(--mx,0) * 0.055deg));
  will-change:transform;
  opacity:.55;
  user-select:none;
}
.bg-art .g.ne{
  font-family:"Mukta",sans-serif;
  font-weight:600;
  -webkit-text-stroke-width:1.7px;
}
.bg-art .g.fill{
  color:var(--c);
  -webkit-text-stroke:0;
  opacity:.22;
}
html.dark .bg-art .g{opacity:.30}
html.dark .bg-art .g.fill{opacity:.12}
.bg-art.go .g{
  animation:glyphFade .75s ease backwards;
  animation-delay:calc(90ms + var(--i,0) * 38ms);
}

/* ============ type ============ */
.title{
  font-family:"Baloo 2","Mukta",-apple-system,sans-serif;
  font-size:clamp(31px,4.4vw,44px);
  font-weight:700;
  line-height:1;
  letter-spacing:-.02em;
  margin:2px 0 32px;
  color:var(--ink);
  text-wrap:balance;
}
.title em{
  position:relative;
  font-style:normal;
  color:var(--rose-ink);
  white-space:nowrap;
}
.title em::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:.04em;
  height:.16em;
  border-radius:99px;
  background:var(--tint);
  z-index:-1;
}
.title span{
  display:block;
  margin-top:6px;
  font-family:"Mukta",sans-serif;
  font-size:clamp(15px,1.7vw,19px);
  font-weight:500;
  letter-spacing:0;
  color:var(--ink-2);
}
.head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
  margin:28px 0 12px;
  font-family:"Baloo 2","Mukta",sans-serif;
  font-size:18px;
  font-weight:600;
  line-height:1.2;
  letter-spacing:-.01em;
}
.head small{font-family:"Mukta",sans-serif;font-size:15px;font-weight:500;color:var(--ink-2)}
.sub{font-size:15.5px;line-height:1.65;color:var(--ink-2)}

/* ============ brand + top bars ============ */
.brand-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:2px 0 16px;
  margin-bottom:18px;
  border-bottom:1px solid var(--line);
}
.brand-name{
  display:flex;
  align-items:center;
  gap:10px;
  padding:0;
  border:0;
  background:none;
  color:inherit;
  cursor:pointer;
  text-align:left;
  font-family:"Baloo 2","Mukta",sans-serif;
  font-size:19px;
  font-weight:600;
  letter-spacing:-.01em;
  min-height:44px;
  color:var(--ink);
}
.brand-mark{
  display:grid;
  place-items:center;
  width:34px;
  height:34px;
  border-radius:50%;
  background:var(--rose-soft);
  border:1px solid var(--rose-line);
  color:var(--rose-ink);
  font-size:16px;
  font-weight:700;
  flex-shrink:0;
}
.lang-switch{
  display:flex;
  gap:2px;
  padding:3px;
  border-radius:999px;
  background:var(--white);
  border:1px solid var(--line);
}
.lang-btn{
  border:0;
  background:none;
  min-height:36px;
  padding:8px 12px;
  border-radius:999px;
  font:inherit;
  font-size:14px;
  font-weight:600;
  color:var(--ink-2);
  cursor:pointer;
  transition:background .15s,color .15s;
}
.lang-btn:hover{color:var(--ink)}
.lang-btn.active{background:var(--ink);color:var(--cream)}

/* ============ top & audio speed controls ============ */
.top-controls{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}
.speed-control{
  display:inline-flex;
  align-items:center;
  gap:2px;
  padding:3px 5px;
  border-radius:999px;
  background:var(--white);
  border:1px solid var(--line);
}
.accent-control{
  display:inline-flex;
  align-items:center;
  gap:2px;
  padding:3px 5px;
  border-radius:999px;
  background:var(--white);
  border:1px solid var(--line);
}
.accent-btn{
  border:0;
  background:none;
  min-height:36px;
  padding:6px 10px;
  border-radius:999px;
  font:inherit;
  font-size:13px;
  font-weight:600;
  color:var(--ink-2);
  cursor:pointer;
  transition:all .15s ease;
  white-space:nowrap;
}
.accent-btn:hover{
  background:var(--cream);
  color:var(--ink);
}
.accent-btn.active{
  background:rgba(227,38,54,0.12);
  color:var(--red);
  font-weight:700;
  box-shadow:0 1px 3px rgba(227,38,54,0.18);
}
.accent-badge{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:2px 8px;
  border-radius:12px;
  font-size:11.5px;
  font-weight:600;
  margin-left:6px;
}
.accent-badge.accent-ne{
  background:rgba(227,38,54,0.1);
  color:var(--red);
  border:1px solid rgba(227,38,54,0.25);
}
.accent-badge.accent-ko{
  background:rgba(34,100,156,0.1);
  color:var(--blue, #22649c);
  border:1px solid rgba(34,100,156,0.25);
}
.accent-pill-group{
  display:inline-flex;
  gap:4px;
  padding-right:8px;
  border-right:1px solid var(--line);
}
.speed-pill-group{
  display:inline-flex;
  gap:4px;
}
.speed-icon{
  display:inline-flex;
  align-items:center;
  color:var(--ink-2);
  padding:0 3px 0 4px;
}
.speed-btn{
  border:0;
  background:none;
  min-height:36px;
  padding:6px 9px;
  border-radius:999px;
  font:inherit;
  font-size:14px;
  font-weight:600;
  color:var(--ink-2);
  cursor:pointer;
  transition:all .15s ease;
  white-space:nowrap;
}
.speed-btn:hover{
  background:var(--cream);
  color:var(--ink);
}
.speed-btn.active{
  background:var(--blue-soft, #e8f3fb);
  color:var(--blue, #22649c);
  font-weight:700;
  box-shadow:0 1px 3px rgba(34,100,156,0.15);
}

/* Learning Hero Dedicated Speed Bar */
.speed-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:10px 0 16px;
  padding:9px 14px;
  border-radius:14px;
  background:var(--paper);
  border:1px solid var(--line);
  font-size:14.5px;
}
.speed-bar-label{
  display:flex;
  align-items:center;
  gap:6px;
  font-weight:600;
  color:var(--ink-2);
}
.speed-bar-options{
  display:flex;
  gap:6px;
}
.sp-opt{
  border:1px solid var(--line);
  background:var(--white);
  min-height:36px;
  padding:8px 12px;
  border-radius:999px;
  font:inherit;
  font-size:14px;
  font-weight:600;
  color:var(--ink);
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:4px;
  transition:all .15s ease;
}
.sp-opt small{
  color:var(--ink-2);
  font-weight:500;
}
.sp-opt:hover{
  border-color:var(--ink-2);
  background:var(--cream);
}
.sp-opt.on{
  border-color:var(--blue, #22649c);
  background:var(--blue-soft, #e8f3fb);
  color:var(--blue, #22649c);
  font-weight:700;
  box-shadow:0 2px 6px rgba(34,100,156,0.18);
}
.sp-opt.on small{
  color:var(--blue, #22649c);
  font-weight:600;
}

.nav-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:16px;
}
.back-btn{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:38px;
  padding:8px 14px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--white);
  color:var(--ink);
  font:inherit;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  transition:background .15s,border-color .15s;
}
.back-btn:hover{background:var(--cream);border-color:var(--line-2)}
.step-badge{
  padding:5px 11px;
  border-radius:999px;
  background:var(--rose-soft);
  border:1px solid var(--rose-line);
  color:var(--rose-ink);
  font-size:13px;
  font-weight:600;
  letter-spacing:.2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:62%;
}
.step-badge.plain{
  background:var(--cream-2);
  border-color:var(--line);
  color:var(--ink-2);
}

/* ============ hero / focal card ============ */
.hero{
  position:relative;
  overflow:hidden;
  padding:26px 24px 28px;
  border-radius:28px;
  background:var(--white);
  border:1px solid var(--line);
  box-shadow:0 30px 60px -48px rgba(74,52,32,.55);
  color:var(--ink);
}
.hero::before,
.hero::after{
  content:"";
  position:absolute;
  border-radius:50%;
  pointer-events:none;
}
.hero::before{
  width:240px;height:240px;
  right:-96px;top:-110px;
  background:radial-gradient(circle,var(--rose-soft) 0%,transparent 70%);
}
.hero::after{
  width:190px;height:190px;
  left:-100px;bottom:-110px;
  background:radial-gradient(circle,var(--sky-soft) 0%,transparent 70%);
}
.hero>*{position:relative;z-index:1}
.hero small{
  display:block;
  font-size:13px;
  font-weight:600;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:var(--ink-2);
}
.hero p{color:var(--ink-2);font-size:15.5px;line-height:1.6;margin:6px 0 0}
.hv{
  font-family:"Baloo 2","Mukta",sans-serif;
  font-size:clamp(30px,4vw,40px);
  font-weight:700;
  letter-spacing:-.02em;
  line-height:1.15;
  margin:6px 0 0;
  color:var(--ink);
}
.glyph{
  display:flex;
  align-items:center;
  justify-content:center;
  width:clamp(132px,17vw,168px);
  height:clamp(132px,17vw,168px);
  margin:16px auto 14px !important;
  border-radius:50%;
  background:var(--cream);
  border:2px solid var(--line);
  box-shadow:inset 0 0 0 9px var(--white);
  font-size:clamp(60px,8.4vw,80px) !important;
  font-weight:700;
  line-height:1;
}
.roman{
  font-size:14.5px;
  font-weight:500;
  color:var(--ink-2);
  margin-top:6px;
}

/* ============ meter ============ */
.meter{display:flex;align-items:center;gap:12px;margin-top:18px}
.meter div{
  flex:1;
  height:6px;
  border-radius:99px;
  background:var(--cream-2);
  overflow:hidden;
}
.meter i{
  display:block;
  height:100%;
  min-width:6px;
  border-radius:99px;
  background:linear-gradient(90deg,var(--rose),var(--rose-ink));
  transition:width .35s ease;
}
.meter b{
  font-size:13.5px;
  font-weight:600;
  color:var(--ink-2);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}

/* ============ roadmap ============ */
.track-wrap{margin:18px 0 6px}
.track-step{
  position:relative;
  display:flex;
  gap:14px;
  padding-bottom:16px;
}
.track-step:last-child{padding-bottom:0}
.track-line{
  position:absolute;
  left:22px;
  top:48px;
  bottom:0;
  width:2px;
  background:var(--line);
}
.track-icon{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:center;
  width:46px;
  height:46px;
  flex-shrink:0;
  border-radius:50%;
  background:var(--white);
  border:1px solid var(--line);
  color:var(--ink);
  font-size:18px;
  font-weight:700;
}
.track-step:nth-child(3n+1) .track-icon{background:var(--rose-soft);border-color:var(--rose-line);color:var(--rose-ink)}
.track-step:nth-child(3n+2) .track-icon{background:var(--sky-soft);border-color:var(--sky-line);color:var(--sky-ink)}
.track-step:nth-child(3n) .track-icon{background:var(--cream);border-color:var(--line-2);color:var(--ink-2)}
.track-step.active .track-icon{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.track-card{
  flex:1;
  min-width:0;
  padding:14px 16px;
  border-radius:18px;
  background:var(--white);
  border:1px solid var(--line);
  color:inherit;
  font:inherit;
  text-align:left;
  cursor:pointer;
  transition:border-color .15s,transform .15s,box-shadow .15s;
}
.track-card:hover{
  border-color:var(--rose-line);
  transform:translateY(-2px);
  box-shadow:0 20px 36px -32px rgba(74,52,32,.6);
}
.track-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:0 0 4px;
  font-size:17.5px;
  font-weight:700;
  line-height:1.35;
  color:var(--ink);
}
.track-desc{display:block;margin:0;font-size:15px;line-height:1.5;color:var(--ink-2)}
.track-tag{
  flex-shrink:0;
  padding:2px 9px;
  border-radius:999px;
  background:var(--cream);
  color:var(--ink-2);
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
}
.track-step.active .track-tag{background:var(--rose-soft);color:var(--rose-ink)}

/* ============ buttons ============ */
.flow-actions{display:flex;flex-direction:column;gap:9px;margin-top:20px}
.flow-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  min-height:48px;
  padding:15px 20px;
  border:1px solid transparent;
  border-radius:16px;
  background:var(--ink);
  color:var(--cream);
  font:inherit;
  font-size:17px;
  font-weight:700;
  line-height:1.35;
  text-align:center;
  cursor:pointer;
  transition:background .15s,transform .12s;
}
.flow-btn:hover{background:#3b332a;transform:translateY(-1px)}
.flow-btn:active{transform:translateY(0)}
.flow-btn.ghost{
  background:var(--white);
  border-color:var(--line);
  color:var(--ink);
}
.flow-btn.ghost:hover{background:var(--cream);border-color:var(--line-2)}
button.primary{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:100%;
  min-height:48px;
  padding:13px 18px;
  border:1px solid transparent;
  border-radius:16px;
  background:var(--ink);
  color:var(--cream);
  font:inherit;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
}

/* ============ segmented control ============ */
.seg{
  display:flex;
  gap:4px;
  padding:4px;
  border-radius:999px;
  background:var(--cream-2);
  border:1px solid var(--line);
  overflow:hidden;
}
.seg button{
  flex:1 1 0;
  min-width:0;
  min-height:40px;
  padding:10px 12px;
  border:0;
  border-radius:999px;
  background:none;
  color:var(--ink-2);
  font:inherit;
  font-size:15px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  cursor:pointer;
  transition:background .15s,color .15s;
}
.seg button:hover{color:var(--ink)}
.seg button.on{
  background:var(--white);
  color:var(--ink);
  box-shadow:0 1px 3px rgba(74,52,32,.10);
}

/* ============ chips ============ */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{
  display:inline-flex;
  align-items:center;
  gap:4px;
  min-height:40px;
  padding:9px 14px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--white);
  color:var(--ink);
  font:inherit;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  transition:background .15s,border-color .15s,color .15s,transform .12s;
}
.chip.ko{font-family:"Noto Sans KR","Mukta",sans-serif;font-size:17px}
.chip:hover{background:var(--cream);border-color:var(--line-2);transform:translateY(-1px)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--cream)}

/* ============ tiles / lists ============ */
.tile{
  padding:15px 17px;
  margin:12px 0;
  border-radius:18px;
  background:var(--white);
  border:1px solid var(--line);
}
.tile p{margin:0;font-size:15.5px;line-height:1.6;color:var(--ink-2)}
.tile b{color:var(--ink);font-weight:700}
.list{
  margin:12px 0;
  border-radius:20px;
  background:var(--white);
  border:1px solid var(--line);
  overflow:hidden;
}
.lrow{
  display:flex;
  align-items:center;
  gap:14px;
  width:100%;
  padding:14px 16px;
  border:0;
  border-bottom:1px solid var(--line);
  background:none;
  color:inherit;
  font:inherit;
  text-align:left;
  cursor:pointer;
  transition:background .15s;
}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--cream)}
.lrow .ln{
  display:grid;
  place-items:center;
  width:42px;
  height:42px;
  flex-shrink:0;
  border-radius:50%;
  background:var(--cream);
  border:1px solid var(--line);
  color:var(--ink);
  font-size:17px;
  font-weight:700;
}
.lrow .lt{flex:1;min-width:0}
.lrow .lt b{display:block;font-size:17px;font-weight:700;line-height:1.4}
.lrow .lt small{display:block;font-size:14.5px;line-height:1.45;color:var(--ink-2);margin-top:2px}
.lrow .lg{
  display:grid;
  place-items:center;
  width:34px;
  height:34px;
  flex-shrink:0;
  border-radius:50%;
  color:var(--ink-2);
}
.lrow .lg svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lrow:hover .lg{background:var(--white);color:var(--rose-ink)}

/* ============ speaker button ============ */
.spk{
  position:absolute;
  right:18px;
  bottom:18px;
  display:grid;
  place-items:center;
  width:44px;
  height:44px;
  border-radius:50%;
  border:1px solid var(--line);
  background:var(--cream);
  color:var(--ink);
  cursor:pointer;
  transition:background .15s,transform .15s;
}
.spk:hover{background:var(--cream-2);transform:scale(1.04)}
.spk svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}

@keyframes spkPulse {
  0% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(79,158,219,0)); }
  50% { transform: scale(1.18); filter: drop-shadow(0 0 10px rgba(79,158,219,0.7)); }
  100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(79,158,219,0)); }
}
.playing-sound {
  animation: spkPulse 0.45s ease-in-out infinite !important;
  color: var(--blue, #22649c) !important;
  border-color: var(--blue, #22649c) !important;
  background: var(--cream-2, #f3ead9) !important;
}

/* ============ tip ============ */
.tip{
  padding:14px 16px;
  margin:14px 0;
  border-radius:16px;
  background:var(--sky-soft);
  border:1px solid var(--sky-line);
  color:#42616f;
  font-size:15px;
  line-height:1.6;
}
html.dark .tip{color:#b7d3e2}
.tip b{color:#2f5366;font-weight:700}
html.dark .tip b{color:#d9edf8}

/* ============ rule cards ============ */
.rule-card{
  padding:18px;
  margin:12px 0;
  border-radius:20px;
  background:var(--white);
  border:1px solid var(--line);
}
.rule-card h3{color:var(--rose-ink)}
.rule-flow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:12px 14px;
  margin:10px 0;
  border-radius:14px;
  background:var(--cream);
  border:1px solid var(--line);
}
.rule-box{text-align:center;min-width:0}
.rule-box small{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.rule-box b{display:block;font-size:18px;font-weight:700;line-height:1.35;color:var(--ink)}
.rule-arrow{color:var(--rose-ink);font-size:20px;font-weight:700}
/* Below ~380px the written→spoken row is too tight for 19px Hangul: stack it. */
@media (max-width:380px){
  .rule-flow{flex-wrap:wrap;justify-content:center;gap:10px}
  .rule-box{flex:1 1 100%}
  .rule-arrow{transform:rotate(90deg);line-height:1}
}

/* ============ vocab tabs & search ============ */
.vocab-tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:6px 2px 10px;
  margin-bottom:8px;
  -webkit-overflow-scrolling:touch;
}
.vocab-tabs::-webkit-scrollbar{display:none}
.vtab{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:8px 14px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--white);
  color:var(--ink-2);
  font-size:14.5px;
  font-weight:600;
  white-space:nowrap;
  cursor:pointer;
  transition:all .15s ease;
}
.vtab:hover{background:var(--cream);color:var(--ink)}
.vtab.active{background:var(--rose-ink);color:#fff;border-color:var(--rose-ink)}
.vocab-thumb{
  width:44px;
  height:44px;
  border-radius:12px;
  object-fit:cover;
  border:1px solid var(--line);
  background:var(--cream);
  flex-shrink:0;
}
.vocab-search-wrap{
  position:relative;
  margin-bottom:14px;
}
.vocab-search-input{
  width:100%;
  padding:11px 14px 11px 38px;
  border-radius:14px;
  border:1px solid var(--line);
  background:var(--white);
  color:var(--ink);
  font-size:15px;
  outline:none;
  box-sizing:border-box;
}
.vocab-search-input:focus{border-color:var(--rose-ink)}
.vocab-search-icon{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  color:var(--ink-2);
  pointer-events:none;
}

/* ============ grammar table & dialogue ============ */
.gram-table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  margin:10px 0;
  border-radius:14px;
  overflow:hidden;
  border:1px solid var(--line);
  font-size:14.5px;
}
.gram-table th{
  background:var(--cream);
  padding:9px 12px;
  font-weight:700;
  color:var(--ink);
  text-align:left;
  border-bottom:1px solid var(--line);
}
.gram-table td{
  padding:10px 12px;
  border-bottom:1px solid var(--line);
  color:var(--ink);
}
.gram-table tr:last-child td{border-bottom:0}
.gram-badge{
  display:inline-block;
  padding:2px 8px;
  border-radius:6px;
  font-size:13px;
  font-weight:700;
}
.gram-badge.yes{background:#e6f4ea;color:#137333}
.gram-badge.no{background:#fce8e6;color:#c5221f}
html.dark .gram-badge.yes{background:#134e26;color:#a8dab5}
html.dark .gram-badge.no{background:#5c1815;color:#f29c99}
.gram-examples{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-top:10px;
}
.gram-ex-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:9px 12px;
  border-radius:12px;
  background:var(--cream);
  border:1px solid var(--line);
}
.gram-ex-row .ex-txt{flex:1;min-width:0}
.gram-ex-row .ex-ko{font-size:17px;font-weight:700;color:var(--ink);display:block}
.gram-ex-row .ex-sub{font-size:14px;color:var(--ink-2);display:block;margin-top:2px}
.reading-dialogue{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  margin:14px 0;
}
.dialogue-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
  padding-bottom:8px;
  border-bottom:1px dashed var(--line);
}
.dialogue-bubble{
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:10px 12px;
  margin-bottom:8px;
  border-radius:12px;
  background:var(--cream);
  border:1px solid var(--line);
}
.dialogue-bubble:last-child{margin-bottom:0}
.dialogue-bubble .db-avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--white);
  border:1px solid var(--line);
  font-weight:700;
  font-size:14px;
  color:var(--rose-ink);
  flex-shrink:0;
}
.dialogue-bubble .db-content{flex:1;min-width:0}
.dialogue-bubble .db-ko{font-size:16.5px;font-weight:700;color:var(--ink);line-height:1.4}
.dialogue-bubble .db-trans{font-size:14px;color:var(--ink-2);margin-top:2px}

/* ============ 44-Day Course Styles ============ */
.course-banner-card{
  background:linear-gradient(135deg, #1b365d 0%, #0d213f 100%);
  color:#fff;
  border-radius:24px;
  padding:22px 24px;
  margin:18px 0 24px;
  box-shadow:0 8px 28px rgba(13,33,63,0.18);
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:transform .2s ease, box-shadow .2s ease;
  border:1px solid rgba(255,255,255,0.15);
}
.course-banner-card:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 34px rgba(13,33,63,0.26);
}
.course-banner-card::after{
  content:"44";
  position:absolute;
  right:-10px;
  bottom:-25px;
  font-size:120px;
  font-weight:900;
  color:rgba(255,255,255,0.05);
  line-height:1;
  pointer-events:none;
}
.cbc-badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:4px 12px;
  border-radius:999px;
  background:rgba(255,255,255,0.16);
  font-size:13.5px;
  font-weight:700;
  letter-spacing:.04em;
  margin-bottom:10px;
  backdrop-filter:blur(4px);
}
.pulse-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#4ade80;
  box-shadow:0 0 8px #4ade80;
  animation:pulseDot 1.6s infinite ease-in-out;
}
@keyframes pulseDot{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.3);opacity:0.6}
}
.cbc-title{
  font-size:22px;
  font-weight:800;
  line-height:1.3;
  margin-bottom:8px;
}
.cbc-sub{
  font-size:15px;
  line-height:1.55;
  color:rgba(255,255,255,0.85);
  margin:0 0 16px;
  max-width:540px;
}
.cbc-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  flex-wrap:wrap;
  padding-top:12px;
  border-top:1px solid rgba(255,255,255,0.12);
}
.cbc-prog-track{
  flex:1;
  min-width:140px;
  height:7px;
  background:rgba(255,255,255,0.2);
  border-radius:999px;
  overflow:hidden;
}
.cbc-prog-bar{
  height:100%;
  background:#4ade80;
  border-radius:999px;
  transition:width .3s ease;
}
.cbc-progress-text{
  font-size:14px;
  font-weight:600;
  color:rgba(255,255,255,0.9);
}
.cbc-btn{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:#fff;
  color:#0d213f;
  padding:7px 16px;
  border-radius:999px;
  font-size:14.5px;
  font-weight:700;
  box-shadow:0 2px 8px rgba(0,0,0,0.12);
  transition:background .15s;
}
.course-banner-card:hover .cbc-btn{
  background:#f0f5ff;
}

.course-pill-btn{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:5px 12px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--white);
  color:var(--ink);
  font-size:13.5px;
  font-weight:700;
  cursor:pointer;
  transition:all .15s ease;
}
.course-pill-btn:hover{
  background:var(--rose-ink);
  color:#fff;
  border-color:var(--rose-ink);
}

/* Course view */
.course-header-box{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px 20px;
  margin:12px 0 16px;
}
.course-stat-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:10px;
}
.course-phase-tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:4px 2px 10px;
  margin-bottom:14px;
  -webkit-overflow-scrolling:touch;
}
.course-phase-tabs::-webkit-scrollbar{display:none}
.cptab{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:7px 13px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--white);
  color:var(--ink-2);
  font-size:14px;
  font-weight:600;
  white-space:nowrap;
  cursor:pointer;
  transition:all .15s ease;
}
.cptab:hover{background:var(--cream);color:var(--ink)}
.cptab.active{background:var(--rose-ink);color:#fff;border-color:var(--rose-ink)}

.course-search-wrap{
  position:relative;
  margin-bottom:16px;
}
.course-search-input{
  width:100%;
  padding:11px 14px 11px 38px;
  border-radius:14px;
  border:1px solid var(--line);
  background:var(--white);
  color:var(--ink);
  font-size:15px;
  outline:none;
  box-sizing:border-box;
}
.course-search-input:focus{border-color:var(--rose-ink)}
.course-search-icon{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  color:var(--ink-2);
  pointer-events:none;
}

.cday-card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
  transition:border-color .15s, box-shadow .15s;
}
.cday-card.completed{
  border-color:#86efac;
  background:rgba(240,253,244,0.3);
}
html.dark .cday-card.completed{
  border-color:#14532d;
  background:rgba(20,83,45,0.15);
}
.cday-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
  flex-wrap:wrap;
}
.cday-badges{
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
}
.cday-num{
  background:var(--rose-ink);
  color:#fff;
  font-size:13.5px;
  font-weight:800;
  padding:3px 9px;
  border-radius:8px;
  letter-spacing:.02em;
}
.cday-phase{
  background:var(--cream);
  color:var(--ink-2);
  font-size:13px;
  font-weight:600;
  padding:3px 9px;
  border-radius:8px;
  border:1px solid var(--line);
}
.cday-dur{
  color:var(--ink-2);
  font-size:13px;
  font-weight:600;
}
.cday-check-btn{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:4px 10px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--white);
  color:var(--ink-2);
  font-size:13.5px;
  font-weight:600;
  cursor:pointer;
  transition:all .15s ease;
}
.cday-check-btn.checked{
  background:#dcfce7;
  color:#15803d;
  border-color:#86efac;
  font-weight:700;
}
html.dark .cday-check-btn.checked{
  background:#14532d;
  color:#bbf7d0;
  border-color:#166534;
}
.cday-title{
  font-size:18px;
  font-weight:800;
  color:var(--ink);
  line-height:1.35;
  margin-bottom:4px;
}
.cday-vtitle{
  font-size:14px;
  color:var(--sub);
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:5px;
}
.cday-summary{
  font-size:15px;
  color:var(--ink);
  line-height:1.6;
  margin-bottom:12px;
  background:var(--cream);
  padding:10px 14px;
  border-radius:12px;
  border:1px solid var(--line);
}
.cday-points{
  list-style:none;
  padding:0;
  margin:0 0 12px;
  font-size:14.5px;
  line-height:1.6;
  color:var(--ink);
}
.cday-points li{
  position:relative;
  padding-left:18px;
  margin-bottom:6px;
}
.cday-points li::before{
  content:"•";
  position:absolute;
  left:4px;
  color:var(--rose-ink);
  font-weight:700;
  font-size:17px;
}
.cday-samples{
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
  margin-bottom:14px;
}
.cday-sample-label{
  font-size:13px;
  font-weight:700;
  color:var(--ink-2);
  text-transform:uppercase;
  letter-spacing:.04em;
}
.cday-actions{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  padding-top:12px;
  border-top:1px dashed var(--line);
}
.cact-btn{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:7px 13px;
  border-radius:10px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  transition:all .15s ease;
  border:1px solid var(--line);
  background:var(--cream);
  color:var(--ink);
  text-decoration:none;
}
.cact-btn:hover{
  background:var(--cream-2);
  border-color:var(--ink-2);
}
.cact-btn.primary{
  background:var(--rose-ink);
  color:#fff;
  border-color:var(--rose-ink);
}
.cact-btn.primary:hover{
  opacity:0.92;
}
.cday-player-wrap{
  margin-top:12px;
  border-radius:14px;
  overflow:hidden;
  border:1px solid var(--line);
  background:#000;
  aspect-ratio:16/9;
  width:100%;
}
.cday-player-wrap iframe{
  width:100%;
  height:100%;
  border:0;
}

/* ============ canvas ============ */
.canvas-wrap{
  position:relative;
  width:100%;
  aspect-ratio:1;
  max-width:320px;
  margin:16px auto;
  border-radius:24px;
  border:1px solid var(--line);
  background:var(--white);
  background-image:
    linear-gradient(var(--cream-2) 1px,transparent 1px),
    linear-gradient(90deg,var(--cream-2) 1px,transparent 1px);
  background-size:33.333% 33.333%;
  background-position:center;
  overflow:hidden;
}
.canvas-ghost{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:170px;
  font-weight:700;
  color:var(--ink);
  opacity:.05;
  pointer-events:none;
  user-select:none;
}
html.dark .canvas-ghost{opacity:.07}
canvas#drawPad{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  cursor:crosshair;
  touch-action:none;
}
.draw-tools{display:flex;gap:10px;justify-content:center;margin:12px 0}
.draw-tools button{
  min-height:40px;
  padding:10px 16px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--white);
  color:var(--ink);
  font:inherit;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  transition:background .15s;
}
.draw-tools button:hover{background:var(--cream)}

/* ============ writing studio: stroke order + scoring ============ */
.ws-lead{
  margin:0 0 12px;font-size:var(--fs-body);line-height:1.62;color:var(--ink-2);
  max-width:60ch;
}
.ws-target{
  display:flex;align-items:center;gap:10px;justify-content:center;
  margin:4px 0 2px;flex-wrap:wrap;
}
.ws-target b.ko{font-size:40px;line-height:1;color:var(--rose-ink)}
.ws-say{padding:8px 11px}
.ws-meta{font-size:var(--fs-micro);color:var(--ink-3);letter-spacing:.02em}
.ws-wrap{max-width:340px;margin:14px auto}
canvas#drawPad{cursor:crosshair;touch-action:none;max-width:100%;max-height:100%}

.ws-pips{display:flex;gap:5px;justify-content:center;margin:10px 0 6px;flex-wrap:wrap}
.ws-pip{
  width:24px;height:5px;border-radius:3px;background:var(--line-2);
  transition:background .15s ease;
}
.ws-pip.on{background:var(--sage)}
.ws-pip.now{background:var(--rose)}

.ws-hud{
  display:flex;align-items:center;justify-content:center;gap:12px;
  min-height:22px;margin:0 0 6px;flex-wrap:wrap;
}
.ws-score{font-size:var(--fs-label);font-weight:800;color:var(--ink-3);letter-spacing:.02em}
.ws-score.ok{color:var(--ink-2)}
.ws-score.great{color:var(--sage)}
.ws-score.low{color:var(--rose-ink)}
.ws-msg{font-size:var(--fs-micro);color:var(--ink-3)}
.ws-msg.warn{color:var(--rose-ink)}

.ws-tools{flex-wrap:wrap}
.ws-tools button:disabled{opacity:.42;cursor:default}

.ws-result{display:none}
.ws-result.open{
  display:block;margin:14px 0 4px;padding:16px;
  background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r-3);
  text-align:center;
}
.ws-result.good{border-color:var(--sage);background:var(--sage-soft)}
.ws-result.mid{border-color:var(--line-2)}
.ws-result.low{border-color:var(--rose-line);background:var(--rose-soft)}
.ws-result-num{font-size:var(--fs-num);font-weight:800;line-height:1;color:var(--ink)}
.ws-result-num small{font-size:var(--fs-lead);font-weight:700;color:var(--ink-3);margin-left:2px}
.ws-result-band{margin-top:4px;font-size:var(--fs-lead);font-weight:800;color:var(--rose-ink)}
.ws-result-meta{margin-top:4px;font-size:var(--fs-micro);color:var(--ink-3)}
.ws-result-acts{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.ws-btn{
  min-height:40px;padding:9px 15px;border-radius:var(--r-pill);
  border:1px solid var(--line-2);background:var(--paper);
  font-family:inherit;font-size:var(--fs-label);font-weight:700;
  color:var(--ink);cursor:pointer;
}
.ws-btn:hover{background:var(--cream-2)}
.ws-btn.primary{background:var(--rose-ink);border-color:var(--rose-ink);color:#fff}
.ws-btn.primary:hover{filter:brightness(1.06)}

.ws-pick-h{margin:20px 0 8px;font-size:var(--fs-lead);font-weight:800;color:var(--ink)}
.ws-picks{display:flex;flex-wrap:wrap;gap:6px}
.ws-pick{
  min-width:40px;height:40px;padding:0 6px;
  border:1px solid var(--line-2);border-radius:var(--r-1);
  background:var(--paper);color:var(--ink);
  font-family:inherit;font-size:18px;font-weight:700;line-height:1;
  cursor:pointer;transition:background .12s ease,border-color .12s ease;
}
.ws-pick:hover{background:var(--cream-2)}
.ws-pick.on{background:var(--rose-soft);border-color:var(--rose-line);color:var(--rose-ink)}

@media (max-width:420px){
  .ws-pick{min-width:36px;height:36px;font-size:16px}
  .ws-target b.ko{font-size:34px}
  .ws-tools button{flex:1 1 42%}
}

/* ============ quiz ============ */
.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
  max-width:520px;
  margin:14px auto;
}
.opt{
  position:relative;
  aspect-ratio:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border-radius:20px;
  border:1px solid var(--line);
  background:var(--white);
  color:var(--ink);
  font-size:clamp(26px,7vw,38px);
  font-weight:500;
  cursor:pointer;
  transition:border-color .15s,background .15s,transform .1s;
}
.opt:hover{border-color:var(--rose-line);background:var(--cream);transform:translateY(-1px)}
.opt:active{transform:scale(.985)}
.opt.ok{background:var(--sage-soft);border-color:#4a8a6d;color:#2f7a55}
.opt.bad{background:var(--rose-soft);border-color:var(--rose-ink);color:var(--rose-ink)}
.opt.ok::after,
.opt.bad::after{
  position:absolute;
  top:8px;
  right:10px;
  font-family:"Mukta",sans-serif;
  font-size:17px;
  font-weight:700;
  line-height:1;
}
.opt.ok::after{content:"✓";color:#2f7a55}
.opt.bad::after{content:"✕";color:var(--rose-ink)}
.opt small{font-family:"Mukta",sans-serif;font-size:12px;color:var(--ink-2);margin-top:2px}
.quiz-status{
  min-height:22px;
  margin:10px auto 0;
  max-width:520px;
  text-align:center;
  font-size:15px;
  font-weight:600;
  color:var(--ink-2);
}

/* quiz chooser */
.quiz-modes{
  display:grid;
  gap:12px;
  max-width:560px;
  margin:16px auto 4px;
}
.quiz-mode{
  display:flex;
  align-items:center;
  gap:14px;
  width:100%;
  padding:16px;
  border:1px solid var(--line);
  border-radius:20px;
  background:var(--white);
  color:var(--ink);
  font:inherit;
  text-align:left;
  cursor:pointer;
  transition:border-color .15s,background .15s,transform .1s,box-shadow .15s;
}
.quiz-mode:hover,
.quiz-mode:focus-visible{
  border-color:var(--rose-line);
  background:var(--cream);
  box-shadow:0 14px 30px -26px rgba(74,52,32,.8);
}
.quiz-mode:active{transform:scale(.99)}
.quiz-mode .qm-icon{
  flex:0 0 auto;
  display:grid;
  place-items:center;
  width:56px;
  height:56px;
  border-radius:16px;
  background:var(--rose-soft);
  color:var(--rose-ink);
}
.quiz-mode .qm-icon svg{
  width:26px;
  height:26px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.quiz-mode .qm-icon.ko{
  font-family:"Gowun Batang","Noto Serif KR",serif;
  font-size:26px;
  font-weight:600;
  line-height:1;
}
.quiz-mode .qm-body{
  display:flex;
  flex-direction:column;
  gap:2px;
  min-width:0;
}
.quiz-mode .qm-body b{
  font-family:"Mukta",sans-serif;
  font-size:17px;
  font-weight:700;
  line-height:1.25;
}
.quiz-mode .qm-body small{
  font-family:"Mukta",sans-serif;
  font-size:14.5px;
  line-height:1.45;
  color:var(--ink-2);
}
.quiz-mode .qm-body em{
  margin-top:3px;
  font-style:normal;
  font-size:13.5px;
  font-weight:600;
  color:var(--rose-ink);
}

/* picture-word quiz */
.quiz-hero{padding:18px 22px 20px}
.quiz-hero .hv{font-size:clamp(24px,3vw,32px)}
.quiz-title{margin-bottom:16px}
.pic-frame{

.pic-frame .pic-fallback small{

.pic-caption{

.pic-grid .opt{aspect-ratio:auto;min-height:88px;padding:14px 8px}
.quiz-prompt{

html.dark .quiz-mode,
html.dark .pic-frame{background:var(--white)}
html.dark .quiz-mode:hover,
html.dark .quiz-mode:focus-visible{background:var(--cream)}

@media (max-width:420px){

/* ============ navigation ============ */
#nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:9999;
  display:flex;
  align-items:stretch;
  justify-content:space-around;
  padding:0 6px env(safe-area-inset-bottom,0px);
  background:rgba(255,253,249,.94);
  border-top:1px solid var(--line);
  box-shadow:0 -18px 40px -34px rgba(74,52,32,.6);
  -webkit-backdrop-filter:blur(14px);
  backdrop-filter:blur(14px);
}
html.dark #nav{background:rgba(29,24,18,.94)}
#nav .nav-brand,
#nav .nav-foot{display:none}
#nav .nav-items{display:flex;flex:1;align-items:stretch;justify-content:space-around}
#nav button{
  position:relative;
  display:flex;
  flex:1;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  padding:10px 0 9px;
  border:0;
  background:none;
  color:var(--ink-2);
  font:inherit;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:color .15s,background .15s;
}
#nav button svg{
  width:21px;
  height:21px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
#nav button.on{color:var(--ink);font-weight:700}
#nav button.on svg{stroke:var(--rose-ink)}
#nav button.on::after{
  content:"";
  position:absolute;
  top:4px;
  left:50%;
  transform:translateX(-50%);
  width:18px;
  height:3px;
  border-radius:99px;
  background:var(--rose-ink);
}

/* ============ opening / loading animation ============ */
body.intro-lock{overflow:hidden}
body.intro-lock #app,
body.intro-lock #nav{opacity:0;pointer-events:none}
#app,#nav{transition:opacity .5s ease}
.intro{
  position:fixed;
  inset:0;
  z-index:100000;
  display:grid;
  place-items:center;
  background:transparent;
  transition:opacity .5s ease,visibility .5s;
}
.intro.done{opacity:0;visibility:hidden;pointer-events:none}
.intro__stage{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  padding:24px;
  margin-top:-4vh;
}
.intro__circle{
  position:relative;
  display:grid;
  place-items:center;
  width:clamp(152px,32vw,192px);
  aspect-ratio:1;
  border-radius:50%;
  background:var(--white);
  border:2px solid var(--line);
  box-shadow:0 34px 70px -46px rgba(74,52,32,.55),inset 0 0 0 10px var(--cream);
  opacity:0;
  transform:scale(.45);
  animation:introCircle .8s cubic-bezier(.34,1.56,.64,1) .05s forwards;
}
.intro__circle::before{
  content:"";
  position:absolute;
  inset:-15px;
  border-radius:50%;
  border:1px dashed var(--rose);
  opacity:.85;
  animation:introSpin 9s linear infinite;
}
.intro__ko{
  font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  font-size:clamp(66px,14vw,86px);
  font-weight:700;
  line-height:1;
  color:var(--ink);
}
.intro__badge{
  position:absolute;
  right:-4px;
  bottom:4px;
  display:grid;
  place-items:center;
  width:46px;
  height:46px;
  border-radius:50%;
  background:var(--sky-soft);
  border:1px solid var(--sky-line);
  color:var(--sky-ink);
  font-family:"Mukta",sans-serif;
  font-size:21px;
  font-weight:600;
}
.intro__word{
  margin-top:28px;
  font-family:"Baloo 2","Mukta",sans-serif;
  font-size:clamp(21px,3vw,27px);
  font-weight:600;
  letter-spacing:-.01em;
  color:var(--ink);
  opacity:0;
  transform:translateY(8px);
  animation:introUp .5s ease .34s forwards;
}
.intro__word b{color:var(--rose-ink);font-weight:700}
.intro__tag{
  margin-top:3px;
  font-size:13.5px;
  letter-spacing:.05em;
  color:var(--ink-2);
  opacity:0;
  transform:translateY(6px);
  animation:introUp .45s ease .44s forwards;
}
.intro__bar{
  width:132px;
  height:3px;
  margin-top:22px;
  border-radius:99px;
  background:var(--cream-2);
  overflow:hidden;
}
.intro__bar i{
  display:block;
  width:0;
  height:100%;
  border-radius:99px;
  background:var(--rose-ink);
  animation:introBar 1.05s cubic-bezier(.4,0,.2,1) .08s forwards;
}
.intro__hint{
  position:fixed;
  left:50%;
  bottom:max(5vh,30px);
  transform:translateX(-50%);
  font-size:12px;
  letter-spacing:.04em;
  color:var(--ink-2);
  opacity:0;
  animation:introUp .45s ease .6s forwards;
}
@keyframes introCircle{
  to{opacity:1;transform:scale(1)}
}
@keyframes introUp{
  to{opacity:1;transform:translateY(0)}
}
@keyframes introBar{
  to{width:100%}
}
@keyframes introSpin{
  to{transform:rotate(360deg)}
}

/* one-time staggered entrance of the app after the opening */
#app.reveal>*{animation:appRise .55s cubic-bezier(.2,.7,.3,1) both}
#app.reveal>*:nth-child(1){animation-delay:.02s}
#app.reveal>*:nth-child(2){animation-delay:.07s}
#app.reveal>*:nth-child(3){animation-delay:.12s}
#app.reveal>*:nth-child(4){animation-delay:.17s}
#app.reveal>*:nth-child(5){animation-delay:.22s}
#app.reveal>*:nth-child(n+6){animation-delay:.27s}
@keyframes appRise{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:none}
}
@keyframes glyphFade{
  from{opacity:0}
}

/* ============ a11y ============ */
