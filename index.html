:focus-visible{
  outline:2px solid var(--rose-ink);
  outline-offset:2px;
  border-radius:6px;
}
/* comfortable hit areas on touch devices (WCAG 2.5.5 best practice) */
@media (pointer:coarse){
  .seg button,
  .lang-btn,.speed-btn,.sp-opt,.chip,.back-btn,.draw-tools button{min-height:44px}
  .opt{min-height:88px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
  .intro{display:none!important}
  body.intro-lock{overflow:auto}
  body.intro-lock #app,
  body.intro-lock #nav{opacity:1;pointer-events:auto}
}


/* ============================================================
   BUNPO INTERACTIVE LESSON MODULE - ADAPTED TO EXISTING THEME
   ============================================================ */
.bunpo-launcher-card {
  background: var(--paper);
  border: 1.5px solid var(--line);
  border-radius: 16px;
  padding: 16px 18px;
  margin: 14px 0 20px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  box-shadow: 0 4px 12px rgba(43, 37, 32, 0.04);
}
.bunpo-launcher-left {
  flex: 1;
}
.bunpo-badge {
  display: inline-block;
  font-size:12px;
  font-weight: 800;
  color: var(--rose-ink);
  background: var(--rose-soft);
  border: 1px solid var(--rose-line);
  padding: 2px 8px;
  border-radius: 999px;
  margin-bottom: 6px;
  letter-spacing: 0.5px;
}
.bunpo-launcher-title {
  font-size:17px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 3px;
}
.bunpo-launcher-desc {
  font-size:14px;
  color: var(--sub);
  line-height: 1.4;
}
.bunpo-start-btn {
  border: none;
  background: var(--rose-ink);
  color: #fff;
  padding: 10px 18px;
  border-radius: 999px;
  font-size:14.5px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  box-shadow: 0 4px 12px rgba(173, 70, 101, 0.25);
  transition: transform 0.15s ease, background 0.15s ease;
}
.bunpo-start-btn:hover {
  transform: translateY(-2px);
  background: #963552;
}
/* One button, one API. Every promo card used to restate the same two inline
   properties (padding:12px 22px;font-size:14.5px) — six copies of a rule that
   belonged in the sheet. */
.bunpo-start-btn.sm { padding: 11px 20px; font-size: var(--fs-body); }
.bunpo-start-btn.sm:hover { transform: translateY(-1px); }

/* Home Pathway Row */
.bunpo-home-section {
  background: var(--paper);
  border: 1.5px solid var(--line);
  border-radius: 18px;
  padding: 18px 20px;
  margin: 20px 0;
  box-shadow: 0 4px 14px rgba(43, 37, 32, 0.04);
}
.bunpo-units-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
  margin-top: 14px;
}
.bunpo-mini-card {
  background: var(--cream);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.bunpo-mini-card:hover {
  background: #fff;
  border-color: var(--sky-ink);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(43, 37, 32, 0.06);
}
.bunpo-mini-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--rose-soft);
  color: var(--rose-ink);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size:17px;
  font-family: "Noto Sans KR", sans-serif;
  font-weight: 700;
  flex-shrink: 0;
}

/* Day Card Practice Button */
.bunpo-day-btn {
  border: 1px solid var(--sky-line);
  background: var(--sky-soft);
  color: var(--sky-ink);
  font-size:13px;
  font-weight: 700;
  padding: 5px 11px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.15s ease;
  margin-top: 8px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.bunpo-day-btn:hover {
  background: var(--sky);
  color: #fff;
}

/* ================= Bunpo Modal Overlay ================= */
.bunpo-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(43, 37, 32, 0.6);
  backdrop-filter: blur(4px);
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.bunpo-modal-overlay.open {
  display: flex;
  animation: bunpoFadeIn 0.2s ease;
}
@keyframes bunpoFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.bunpo-modal-dialog {
  max-width: 620px;
  width: 100%;
  max-height: 92vh;
  background: var(--cream);
  border: 1.5px solid var(--line);
  border-radius: 20px;
  box-shadow: 0 16px 48px rgba(43, 37, 32, 0.25);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  animation: bunpoSlideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes bunpoSlideUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.bunpo-modal-top {
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  padding: 12px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.bunpo-close-btn {
  border: none;
  background: var(--cream-2);
  width: 34px;
  height: 34px;
  border-radius: 50%;
  color: var(--ink-2);
  font-size:17px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s ease;
}
.bunpo-close-btn:hover {
  background: var(--line);
  color: var(--ink);
}

.bunpo-progress-wrap {
  flex: 1;
  display: flex;
  gap: 6px;
  align-items: center;
}
.bunpo-prog-seg {
  flex: 1;
  height: 8px;
  background: var(--cream-2);
  border-radius: 4px;
  transition: background 0.25s ease;
}
.bunpo-prog-seg.done {
  background: var(--sky-ink);
}
.bunpo-prog-seg.active {
  background: var(--rose-ink);
}

.bunpo-voice-tag {
  font-size:12px;
  font-weight: 700;
  background: var(--rose-soft);
  color: var(--rose-ink);
  border: 1px solid var(--rose-line);
  padding: 3px 8px;
  border-radius: 999px;
  white-space: nowrap;
}

.bunpo-modal-body {
  padding: 20px 18px 120px 18px;
  overflow-y: auto;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ===== Hangul Ninja — falling-word typing game ===== */
.nj-card {
  width: 100%;
  margin: 18px 0 14px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 4px 18px rgba(43,37,32,0.06);
}

/* ---- HUD ---- */
.nj-hud {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 9px 11px;
  background: linear-gradient(180deg, var(--cream) 0%, var(--cream-2) 100%);
  border-bottom: 1px solid var(--line);
}
.nj-pill {
  display: flex;
  align-items: baseline;
  gap: 4px;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--white);
  border: 1px solid var(--line);
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-2);
  white-space: nowrap;
}
.nj-pill b {
  font-size: 14px;
  font-weight: 900;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.nj-pill.combo b { color: var(--rose-ink); }
.nj-pill.combo.hot {
  background: var(--rose-soft);
  border-color: var(--rose-line);
}
.nj-pill.combo.hot b { color: var(--rose-ink); }
.nj-hearts {
  margin-left: auto;
  display: flex;
  gap: 2px;
  font-size: 13px;
  line-height: 1;
}
.nj-hearts .dead { opacity: .2; filter: grayscale(1); }

/* ---- playfield ---- */
.nj-field {
  position: relative;
  height: 300px;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 34px);
  mask-image: linear-gradient(180deg, transparent 0, #000 34px);
  background:
    radial-gradient(120% 70% at 50% 118%, rgba(173,70,101,0.10) 0%, rgba(173,70,101,0) 62%),
    linear-gradient(180deg, #fffdf9 0%, #f7efdf 62%, #f1e6d2 100%);
  touch-action: manipulation;
  user-select: none;
}
.nj-mark {
  position: absolute;
  left: 50%;
  top: 46%;
  transform: translate(-50%, -50%);
  font-family: "Noto Sans KR","Noto Sans CJK KR","Mukta",sans-serif;
  font-size: 148px;
  font-weight: 900;
  line-height: 1;
  color: rgba(43,37,32,0.045);
  pointer-events: none;
  user-select: none;
  z-index: 0;
}
.nj-grain {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background-image:
    radial-gradient(rgba(43,37,32,0.05) 0.5px, transparent 0.5px);
  background-size: 4px 4px;
  opacity: .5;
}
.nj-sun {
  position: absolute;
  left: 50%;
  bottom: 34px;
  transform: translateX(-50%);
  width: 92px; height: 92px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(242,188,203,0.95) 0%, rgba(242,188,203,0.35) 42%, rgba(242,188,203,0) 72%);
  opacity: .85;
  filter: blur(1px);
  pointer-events: none;
  z-index: 0;
}
.nj-floor {
  position: absolute;
  left: 0; right: 0; bottom: 24px;
  height: 2px;
  background: repeating-linear-gradient(90deg, #e6a8bb 0 10px, transparent 10px 20px);
  pointer-events: none;
  z-index: 1;
}
.nj-floor-tag {
  position: absolute;
  left: 10px; bottom: 4px;
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-2);
  opacity: .55;
  pointer-events: none;
}

/* ---- falling words ---- */
.nj-word {
  position: absolute;
  transform: translate(-50%, 0);
  padding: 7px 14px 8px;
  background: var(--white);
  border: 1.5px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 3px 10px rgba(43,37,32,0.10);
  white-space: nowrap;
  cursor: pointer;
  z-index: 2;
  transition: border-color .14s ease, box-shadow .14s ease, opacity .3s ease, transform .3s ease;
}
.nj-word .ko {
  display: block;
  font-family: "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Mukta",sans-serif;
  font-size: 23px;
  font-weight: 800;
  color: var(--ink);
  line-height: 1.2;
  letter-spacing: .01em;
}
.nj-word .ko .hit {
  color: var(--line-2);
  text-decoration: line-through;
  text-decoration-thickness: 2px;
}
.nj-word .ko .now {
  color: var(--rose-ink);
  text-decoration: underline;
  text-decoration-thickness: 2.5px;
  text-underline-offset: 3px;
}
.nj-word .ne {
  display: block;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--ink-2);
  line-height: 1.2;
  margin-top: 2px;
  letter-spacing: .01em;
}
.nj-word.active {
  border-color: var(--rose-ink);
  box-shadow: 0 0 0 3px var(--rose-soft), 0 5px 14px rgba(173,70,101,0.18);
}
.nj-word.miss {
  border-color: #d9534f;
  animation: njShake .3s ease;
}
@keyframes njShake {
  0%,100% { transform: translate(-50%, 0); }
  25% { transform: translate(calc(-50% - 5px), 0); }
  65% { transform: translate(calc(-50% + 4px), 0); }
}
.nj-word.gone {
  opacity: 0;
  transform: translate(-50%, -34px) rotate(-9deg) scale(.78);
  pointer-events: none;
}
.nj-word.shatter {
  opacity: 0;
  transform: translate(-50%, 22px) rotate(7deg) scale(.86);
  pointer-events: none;
}

/* ---- effects ---- */
.nj-slash {
  position: absolute;
  height: 3px;
  width: 120px;
  margin-left: -60px;
  background: linear-gradient(90deg, transparent 0%, #ffffff 22%, var(--rose-ink) 50%, #ffffff 78%, transparent 100%);
  transform-origin: center;
  pointer-events: none;
  animation: njSlash .42s ease-out forwards;
}
@keyframes njSlash {
  0%   { opacity: 0; transform: rotate(-24deg) scaleX(.2); }
  35%  { opacity: 1; transform: rotate(-24deg) scaleX(1); }
  100% { opacity: 0; transform: rotate(-24deg) scaleX(1.5); }
}
.nj-pop {
  position: absolute;
  font-size: 15px;
  font-weight: 900;
  color: var(--rose-ink);
  pointer-events: none;
  text-shadow: 0 1px 0 #fff;
  animation: njPop .75s ease-out forwards;
}
@keyframes njPop {
  0%   { opacity: 0; transform: translate(-50%, 0) scale(.7); }
  25%  { opacity: 1; transform: translate(-50%, -12px) scale(1.1); }
  100% { opacity: 0; transform: translate(-50%, -42px) scale(1); }
}
.nj-flash {
  position: absolute;
  inset: 0;
  pointer-events: none;
  animation: njFlash .32s ease-out forwards;
}
@keyframes njFlash {
  0%   { box-shadow: inset 0 0 0 0 rgba(217,83,79,0); }
  30%  { box-shadow: inset 0 0 40px 0 rgba(217,83,79,.34); }
  100% { box-shadow: inset 0 0 0 0 rgba(217,83,79,0); }
}

/* ---- overlays ---- */
.nj-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 16px;
  text-align: center;
  background: rgba(250,245,236,0.86);
  backdrop-filter: blur(2px);
  z-index: 4;
}
.nj-overlay.hide { display: none; }
.nj-ov-icon { font-size: 30px; line-height: 1; }
.nj-ov-title { font-size: 16px; font-weight: 900; color: var(--ink); }
.nj-ov-sub { font-size: 12px; color: var(--ink-2); line-height: 1.5; max-width: 280px; }
.nj-ov-sub b { color: var(--rose-ink); }
.nj-btn {
  font-family: inherit;
  font-size: 13px;
  font-weight: 800;
  color: #fff;
  background: var(--rose-ink);
  border: none;
  border-radius: 12px;
  padding: 11px 26px;
  cursor: pointer;
  box-shadow: 0 3px 10px rgba(173,70,101,0.28);
  transition: transform .12s ease, box-shadow .12s ease;
}
.nj-btn:hover { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(173,70,101,0.34); }
.nj-btn.ghost {
  background: var(--white);
  color: var(--ink);
  border: 1px solid var(--line);
  box-shadow: none;
}
.nj-ov-stats {
  display: flex;
  gap: 8px;
  margin: 2px 0 4px;
}
.nj-ov-stat {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 6px 12px;
  min-width: 62px;
}
.nj-ov-stat b { display: block; font-size: 16px; font-weight: 900; color: var(--ink); }
.nj-ov-stat small { font-size: 9px; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: .07em; }

/* ---- blade / pad ---- */
.nj-blade {
  padding: 11px 12px 13px;
  background: var(--cream);
  border-top: 1px solid var(--line);
}
.nj-blade-top {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 10px;
}
.nj-preview {
  width: 54px; height: 54px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Mukta",sans-serif;
  font-size: 27px;
  font-weight: 900;
  color: var(--ink);
  background: var(--white);
  border: 2px solid var(--line);
  border-radius: 13px;
  transition: border-color .14s ease;
}
.nj-preview.empty { color: var(--line-2); font-size: 20px; }
.nj-strike {
  flex: 1;
  font-family: inherit;
  font-size: 14px;
  font-weight: 900;
  letter-spacing: .02em;
  color: #fff;
  background: linear-gradient(180deg, #c25b7a 0%, var(--rose-ink) 100%);
  border: none;
  border-radius: 13px;
  padding: 15px 12px;
  cursor: pointer;
  box-shadow: 0 3px 10px rgba(173,70,101,0.3);
  transition: transform .1s ease, box-shadow .1s ease, opacity .15s ease;
}
.nj-strike:active { transform: translateY(1px) scale(.99); }
.nj-strike:disabled { opacity: .4; cursor: default; box-shadow: none; }
.nj-pad-label {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-2);
  margin: 8px 0 4px;
}
.nj-pad-row { display: flex; flex-wrap: wrap; gap: 4px; }
.nj-key {
  min-width: 32px;
  height: 32px;
  padding: 0 5px;
  font-family: "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Mukta",sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 8px;
  cursor: pointer;
  transition: all .1s ease;
}
.nj-key:hover { background: var(--cream-2); }
.nj-key.on {
  background: var(--rose-soft);
  border-color: var(--rose-ink);
  color: var(--rose-ink);
  box-shadow: 0 0 0 2px var(--rose-soft);
}
.nj-foot {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 9px;
  font-size: 10.5px;
  color: var(--ink-2);
}
.nj-foot .grow { flex: 1; }
.nj-mini {
  font-family: inherit;
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-2);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 5px 9px;
  cursor: pointer;
}
.nj-mini:hover { background: var(--white); color: var(--ink); }

@media (max-width: 620px) {
  .nj-field { height: 258px; }
  .nj-word .ko { font-size: 21px; }
  .nj-preview { width: 48px; height: 48px; font-size: 24px; }
  .nj-strike { padding: 13px 10px; font-size: 13.5px; }
  /* even rows: 14 consonants = 2x7, 9 vowels / 9 finals = 1 row each */
  .nj-pad-row { display: grid; gap: 4px; }
  #njRowCho { grid-template-columns: repeat(7, 1fr); }
  #njRowJung, #njRowJong { grid-template-columns: repeat(9, 1fr); }
  .nj-key { min-width: 0; width: 100%; height: 34px; font-size: 15px; padding: 0; }
  .nj-pad-label { margin: 7px 0 4px; }
}

/* ============================================================
   HANGUL ARCADE — typing.com-style game hub + arena
   ============================================================ */

/* ---------- hub ---------- */
/* ── difficulty chooser ───────────────────────────────────── */
.diff-row {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 3px;
  border-radius: 12px;
  background: rgba(43,37,32,0.055);
  border: 1px solid rgba(43,37,32,0.075);
  flex-shrink: 0;
}
.diff-row > span {
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: rgba(43,37,32,0.42);
  padding: 0 5px 0 7px;
}
.diff-btn {
  font-family: inherit;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .01em;
  color: var(--ink-2);
  background: transparent;
  border: none;
  border-radius: 9px;
  padding: 6px 12px;
  cursor: pointer;
  white-space: nowrap;
  transition: background .14s ease, color .14s ease, box-shadow .14s ease;
}
.diff-btn:hover { background: rgba(255,255,255,0.75); }
.diff-btn.on {
  background: var(--white);
  box-shadow: 0 1px 3px rgba(43,37,32,0.13);
  color: var(--ink);
}
.diff-btn.on[data-d="easy"] { color: #3d7729; }
.diff-btn.on[data-d="hard"] { color: var(--rose-ink); }

.arc-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  margin: 6px 0 14px;
  flex-wrap: wrap;
}
.arc-head h2 {
  font-size: 21px;
  font-weight: 800;
  color: var(--ink);
  margin: 0;
  letter-spacing: -0.01em;
}
.arc-head p {
  margin: 3px 0 0;
  font-size: 12.5px;
  color: var(--ink-2);
  line-height: 1.45;
  max-width: 460px;
}

.arc-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(228px, 1fr));
  gap: 14px;
  margin-bottom: 22px;
}

.arc-card {
  display: block;
  width: 100%;
  padding: 0;
  text-align: left;
  font-family: inherit;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  box-shadow: 0 2px 10px rgba(43,37,32,0.05);
}
.arc-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 26px rgba(43,37,32,0.13);
  border-color: var(--line-2);
}
.arc-card:active { transform: translateY(-1px); }
.arc-card:focus-visible {
  outline: 2px solid var(--sky-ink);
  outline-offset: 2px;
}

.arc-thumb {
  position: relative;
  aspect-ratio: 16 / 10;
  overflow: hidden;
  background: var(--cream-2);
}
.arc-thumb svg { display: block; width: 100%; height: 100%; }
.arc-thumb .badge {
  position: absolute;
  top: 8px; left: 8px;
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: #fff;
  background: rgba(43,37,32,0.55);
  border-radius: 6px;
  padding: 3px 7px;
  backdrop-filter: blur(4px);
}
.arc-thumb .badge.hot { background: rgba(173,70,101,0.85); }

.arc-card-body { padding: 11px 13px 13px; }
.arc-card-body > b {
  display: block;
  font-size: 14.5px;
  font-weight: 800;
  color: var(--ink);
  line-height: 1.25;
}
.arc-card-body small {
  display: block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink-2);
  margin-top: 1px;
  opacity: .8;
}
.arc-card-body p {
  margin: 6px 0 0;
  font-size: 11.5px;
  line-height: 1.45;
  color: var(--ink-2);
}
.arc-card-foot {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 9px;
}
.arc-chip {
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: .05em;
  text-transform: uppercase;
  padding: 3px 7px;
  border-radius: 999px;
  background: var(--cream);
  border: 1px solid var(--line);
  color: var(--ink-2);
}
.arc-chip.pad { background: var(--rose-soft); border-color: var(--rose-line); color: var(--rose-ink); }
.arc-chip.tap { background: var(--sky-soft); border-color: var(--sky-line); color: var(--sky-ink); }
.arc-play {
  font-size: 10.5px;
  font-weight: 800;
  color: var(--rose-ink);
}
.arc-best {
  margin-left: auto;
  font-size: 10.5px;
  font-weight: 800;
  color: var(--ink-2);
  white-space: nowrap;
}
.arc-best b { color: var(--rose-ink); }

/* ---------- arena ---------- */
.arc-modal {
  position: fixed;
  inset: 0;
  z-index: 10000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(43,37,32,0.5);
  backdrop-filter: blur(3px);
}
.arc-modal.open { display: flex; }

.arc-dialog {
  width: 100%;
  max-width: 720px;
  max-height: 94vh;
  height: min(92vh, 700px);
  display: flex;
  flex-direction: column;
  background: var(--paper);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 24px 70px rgba(43,37,32,0.35);
}

.arc-top {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: linear-gradient(180deg, var(--cream) 0%, var(--cream-2) 100%);
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.arc-close {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--white);
  color: var(--ink-2);
  font-size: 13px;
  cursor: pointer;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all .14s ease;
}
.arc-close:hover { background: var(--cream-2); color: var(--ink); }
.arc-name {
  font-size: 13.5px;
  font-weight: 800;
  color: var(--ink);
  line-height: 1.2;
  min-width: 0;
}
.arc-name small {
  display: block;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink-2);
  opacity: .75;
}
.arc-hud {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.arc-stat {
  display: flex;
  align-items: baseline;
  gap: 3px;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--white);
  border: 1px solid var(--line);
  font-size: 9.5px;
  font-weight: 700;
  color: var(--ink-2);
  white-space: nowrap;
}
.arc-stat b {
  font-size: 13px;
  font-weight: 900;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.arc-stat.hot { background: var(--rose-soft); border-color: var(--rose-line); }
.arc-stat.hot b { color: var(--rose-ink); }
.arc-hearts { display: flex; gap: 1px; font-size: 12px; line-height: 1; }
.arc-hearts .dead { opacity: .2; filter: grayscale(1); }

.arc-stage {
  position: relative;
  flex: 1;
  min-height: 250px;
  overflow: hidden;
  background: var(--cream);
  touch-action: manipulation;
  user-select: none;
}

.arc-input {
  flex-shrink: 0;
  padding: 10px 12px 12px;
  background: var(--cream);
  border-top: 1px solid var(--line);
}
.arc-input:empty { display: none; }

.an-fade,
.gz-fade {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 26px;
  z-index: 4;
  pointer-events: none;
}
.an-fade { background: linear-gradient(180deg, #fffdf9 0%, rgba(255,253,249,0) 100%); }
.gz-fade { background: linear-gradient(180deg, #120f24 0%, rgba(18,15,36,0) 100%); }

/* shared pad inside the arena */
.apad-top { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; }
.apad-preview {
  width: 50px; height: 50px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Mukta",sans-serif;
  font-size: 25px; font-weight: 900;
  color: var(--ink);
  background: var(--white);
  border: 2px solid var(--line);
  border-radius: 12px;
}
.apad-go {
  flex: 1;
  font-family: inherit;
  font-size: 14px;
  font-weight: 900;
  color: #fff;
  background: linear-gradient(180deg, #c25b7a 0%, var(--rose-ink) 100%);
  border: none;
  border-radius: 12px;
  padding: 13px 10px;
  cursor: pointer;
  box-shadow: 0 3px 10px rgba(173,70,101,0.28);
  transition: transform .1s ease, opacity .15s ease;
}
.apad-go:active { transform: translateY(1px); }
.apad-go:disabled { opacity: .4; cursor: default; box-shadow: none; }
.apad-label {
  font-size: 8.5px; font-weight: 800; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-2);
  margin: 7px 0 4px;
}
.apad-row { display: grid; gap: 4px; }
#apadCho { grid-template-columns: repeat(7, 1fr); }
#apadJung, #apadJong { grid-template-columns: repeat(9, 1fr); }
.apad-key {
  min-width: 0; width: 100%; height: 32px;
  padding: 0;
  font-family: "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Mukta",sans-serif;
  font-size: 14.5px; font-weight: 700;
  color: var(--ink);
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 8px;
  cursor: pointer;
  transition: all .1s ease;
}
.apad-key:hover { background: var(--cream-2); }
.apad-key.on {
  background: var(--rose-soft);
  border-color: var(--rose-ink);
  color: var(--rose-ink);
  box-shadow: 0 0 0 2px var(--rose-soft);
}

/* shared overlay */
.arc-over {
  position: absolute;
  inset: 0;
  z-index: 6;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 18px;
  text-align: center;
  background: rgba(250,245,236,0.93);
  backdrop-filter: blur(2px);
}
.arc-over.hide { display: none; }
.arc-over .ico { font-size: 30px; line-height: 1; }
.arc-over .ttl { font-size: 16px; font-weight: 900; color: var(--ink); }
.arc-over .sub { font-size: 12px; color: var(--ink-2); line-height: 1.5; max-width: 300px; }
.arc-over .sub b { color: var(--rose-ink); }
.arc-over .row { display: flex; gap: 7px; margin: 3px 0 5px; }
.arc-over .cell {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 6px 12px;
  min-width: 60px;
}
.arc-over .cell b { display: block; font-size: 16px; font-weight: 900; color: var(--ink); }
.arc-over .cell small {
  font-size: 8.5px; font-weight: 700; letter-spacing: .07em;
  text-transform: uppercase; color: var(--ink-2);
}
.arc-btn {
  font-family: inherit;
  font-size: 13px; font-weight: 800;
  color: #fff;
  background: var(--rose-ink);
  border: none;
  border-radius: 12px;
  padding: 11px 26px;
  cursor: pointer;
  box-shadow: 0 3px 10px rgba(173,70,101,0.28);
  transition: transform .12s ease;
}
.arc-btn:hover { transform: translateY(-1px); }
.arc-btn.ghost {
  background: var(--white); color: var(--ink);
  border: 1px solid var(--line); box-shadow: none;
}

/* ---------- game: balloon / toss (tap engine) ---------- */
.gp-sky {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(60% 40% at 18% 12%, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 70%),
    radial-gradient(50% 32% at 82% 22%, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0) 70%),
    linear-gradient(180deg, #d8edf9 0%, #e9f5fc 52%, #fdf6f8 100%);
}
.gp-prompt {
  position: absolute;
  top: 0; left: 0; right: 0;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 13px 14px 24px;
  background: linear-gradient(180deg, rgba(250,245,236,0.98) 0%, rgba(250,245,236,0.88) 58%, rgba(250,245,236,0) 100%);
  pointer-events: none;
}
.gp-prompt b {
  font-size: 21px;
  font-weight: 900;
  color: var(--ink);
  letter-spacing: -0.01em;
  line-height: 1.15;
}
.gp-prompt small {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.gp-sky.toss ~ .gp-prompt {
  background: linear-gradient(180deg, rgba(59,36,64,0.97) 0%, rgba(59,36,64,0.84) 58%, rgba(59,36,64,0) 100%);
}
.gp-sky.toss ~ .gp-prompt b { color: #ffe9c4; }
.gp-sky.toss ~ .gp-prompt small { color: rgba(255,233,196,0.7); }
.gp-play {
  pointer-events: auto;
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 1px solid var(--rose-line);
  background: var(--rose-soft);
  color: var(--rose-ink);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.gp-play svg { width: 14px; height: 14px; }

.gp-balloon {
  position: absolute;
  transform: translate(-50%, -50%);
  cursor: pointer;
  transition: transform .1s ease;
  z-index: 2;
}
.gp-balloon:hover { transform: translate(-50%, -50%) scale(1.06); }
.gp-balloon .body {
  background: radial-gradient(circle at 32% 24%, #ffffff 0%, var(--tint, #efb8c9) 42%, var(--tint, #efb8c9) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  width: 78px;
  height: 92px;
  padding: 0;
  border-radius: 50% / 46% 46% 54% 54%;
  font-family: "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Mukta",sans-serif;
  font-size: 19px;
  font-weight: 800;
  white-space: nowrap;
  color: #4a3a2e;
  box-shadow: inset -6px -8px 16px rgba(0,0,0,0.07), inset 5px 6px 12px rgba(255,255,255,0.6), 0 4px 12px rgba(43,37,32,0.1);
  position: relative;
}
.gp-balloon .body::after {
  content: "";
  position: absolute;
  top: 13%; left: 20%;
  width: 16%; height: 22%;
  border-radius: 50%;
  background: rgba(255,255,255,0.55);
  filter: blur(2px);
}
.gp-balloon .string {
  width: 1.5px;
  height: 16px;
  margin: 0 auto;
  background: rgba(43,37,32,0.25);
}
.gp-balloon.pop { animation: gpPop .3s ease-out forwards; pointer-events: none; }
@keyframes gpPop {
  0%   { transform: translate(-50%,-50%) scale(1); opacity: 1; }
  45%  { transform: translate(-50%,-50%) scale(1.28); opacity: .9; }
  100% { transform: translate(-50%,-50%) scale(.4); opacity: 0; }
}
.gp-balloon.bad { animation: gpBad .34s ease; }
@keyframes gpBad {
  0%,100% { transform: translate(-50%,-50%) rotate(0); }
  25% { transform: translate(-50%,-50%) rotate(-7deg); }
  70% { transform: translate(-50%,-50%) rotate(6deg); }
}

/* toss targets */
.gp-target {
  position: absolute;
  transform: translate(-50%, -50%);
  cursor: pointer;
  z-index: 2;
  transition: transform .1s ease;
}
.gp-target:hover { transform: translate(-50%, -50%) scale(1.05); }
/* ── mini keyboard guide ─────────────────────────────────────
   A full ANSI chassis, so the layout reads as a keyboard rather
   than a row of buttons. One input surface at a time: the pad
   and the guide swap places, they never stack. */
.kbk { display: none; }
body.kb-on .apad-keys,
body.kb-on .nj-keys,
body.kb-on .apad-hint,
body.kb-on .nj-kbhint { display: none; }
body.kb-on .kbk { display: flex; }

.kbk {
  flex-direction: column;
  gap: 3px;
  width: min(100%, 720px);
  margin: 2px auto 6px;
  padding: 10px 8px 6px;
  border-radius: 13px;
  background: rgba(43,37,32,0.055);
  border: 1px solid rgba(43,37,32,0.08);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
  font-size: clamp(10.5px, 2.35vw, 18px);
}
.kbk-row {
  display: grid;
  grid-template-columns: repeat(15, 1fr);
  gap: 3px;
  width: 100%;
}
.kbk-key {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 0;
  height: clamp(26px, 5.6vw, 42px);
  border-radius: 6px;
  background: var(--white);
  border: 1px solid var(--line);
  box-shadow: 0 2px 0 rgba(43,37,32,0.09);
  transition: background .16s ease, border-color .16s ease,
              box-shadow .16s ease, transform .16s ease;
}
.kbk-key b {
  font-family: "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Mukta",sans-serif;
  font-size: 1.1em;
  font-weight: 800;
  line-height: 1;
  color: rgba(43,37,32,0.82);
  transition: color .16s ease;
}
.kbk-key i {
  font-style: normal;
  font-size: .72em;
  font-weight: 800;
  line-height: 1;
  margin-top: 2px;
  letter-spacing: .03em;
  color: rgba(43,37,32,0.36);
}
.kbk-key[data-j] { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.kbk-key[data-j]:active { transform: translateY(1px); box-shadow: 0 1px 0 rgba(43,37,32,0.09); }
.kbk-key[data-j]:focus-visible { outline: 2px solid var(--rose-ink); outline-offset: 2px; }
.kbk-mod b { font-size: .74em; font-weight: 700; color: rgba(43,37,32,0.32); }
.kbk-digit b { font-size: .95em; color: rgba(43,37,32,0.6); }
.kbk-space b { display: none; }

.kbk-key.next {
  background: var(--rose-soft);
  border-color: var(--rose-ink);
  box-shadow: 0 0 0 3px rgba(173,70,101,0.11), 0 2px 0 rgba(173,70,101,0.18);
  animation: kbkPulse 1.15s ease-in-out infinite;
  z-index: 1;
}
.kbk-key.next b { color: var(--rose-ink); }
.kbk-key.next i { color: var(--rose-ink); opacity: .55; }
.kbk-key.shift::after {
  content: "⇧";
  position: absolute;
  top: -6px; right: -4px;
  font-size: 8px;
  font-weight: 900;
  line-height: 10px;
  padding: 0 2px;
  color: var(--rose-ink);
  background: var(--white);
  border: 1px solid var(--rose-ink);
  border-radius: 5px;
  z-index: 2;
}
.kbk-key.hit {
  background: #e0f3d9;
  border-color: #7cb964;
  box-shadow: 0 0 0 3px rgba(124,185,100,0.2);
}
.kbk-key.hit b { color: #3d7729; }
@keyframes kbkPulse {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-2px) scale(1.06); }
}
@media (prefers-reduced-motion: reduce) {
  .kbk-key.next { animation: none; }
  .kbk-key { transition: none; }
}
.kbk-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  margin-top: 6px;
  padding: 0 4px;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .04em;
  color: rgba(43,37,32,0.4);
}
.kbk-switch {
  font-family: inherit;
  font-size: inherit;
  font-weight: 800;
  letter-spacing: .02em;
  color: var(--rose-ink);
  background: none;
  border: none;
  margin-left: 6px;
  padding: 0;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
}
.kbk-pad-btn {
  font-family: inherit;
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: .04em;
  color: var(--rose-ink);
  background: none;
  border: none;
  padding: 1px 3px;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
}
.apad-hint,
.nj-kbhint {
  margin-top: 9px;
  padding-top: 7px;
  border-top: 1px dashed rgba(43,37,32,0.13);
  font-size: 10.5px;
  line-height: 1.5;
  color: rgba(43,37,32,0.44);
  letter-spacing: 0.1px;
}
.apad-hint b,
.nj-kbhint b {
  font-weight: 800;
  color: rgba(43,37,32,0.62);
  font-family: var(--ko-font, "Noto Sans KR", sans-serif);
}
.gp-kbhint {
  display: none;
  margin-top: 5px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.3px;
  color: rgba(43,37,32,0.36);
}
body.kb-on .gp-kbhint { display: inline-block; }
.gp-num {
  position: absolute;
  top: -5px; left: -5px;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: rgba(43,37,32,0.58);
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  line-height: 18px;
  text-align: center;
  pointer-events: none;
  z-index: 2;
  box-shadow: 0 1px 3px rgba(43,37,32,0.3);
}
body:not(.kb-on) .gp-num { display: none; }
.gp-target .plate {
  width: clamp(72px, 19vw, 88px);
  height: clamp(72px, 19vw, 88px);
  white-space: nowrap;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Mukta",sans-serif;
  font-size: 19px; font-weight: 800;
  color: #4a3a2e;
  background: radial-gradient(circle at 34% 28%, #fff6f8, #f7d9e1);
  border: 3px solid #fff;
  box-shadow: 0 4px 12px rgba(43,37,32,0.14);
}
.gp-balloon .body.long { font-size: 15px; letter-spacing: -0.02em; }
.gp-target .plate.long { font-size: 15px; letter-spacing: -0.02em; }
.gp-target.bomb .plate {
  background: radial-gradient(circle at 34% 28%, #6b6259, #3a332c);
  color: #ffe9a8;
  font-size: 22px;
}
.gp-target.hit { animation: gpPop .3s ease-out forwards; pointer-events: none; }
.gp-target.bad { animation: gpBad .34s ease; }

.gp-pop {
  position: absolute;
  font-size: 14px; font-weight: 900;
  color: var(--rose-ink);
  pointer-events: none;
  z-index: 5;
  text-shadow: 0 1px 0 #fff;
  animation: gpPopUp .8s ease-out forwards;
}
@keyframes gpPopUp {
  0%   { opacity: 0; transform: translate(-50%,0) scale(.7); }
  25%  { opacity: 1; transform: translate(-50%,-14px) scale(1.08); }
  100% { opacity: 0; transform: translate(-50%,-46px) scale(1); }
}

/* ---------- game: ztype ---------- */
.gz-sky {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(66% 46% at 74% 16%, rgba(138,96,178,0.42) 0%, rgba(138,96,178,0) 72%),
    radial-gradient(58% 40% at 18% 62%, rgba(173,70,101,0.24) 0%, rgba(173,70,101,0) 74%),
    radial-gradient(70% 50% at 50% 108%, rgba(90,60,110,0.4) 0%, rgba(90,60,110,0) 72%),
    linear-gradient(180deg, #14112a 0%, #251d40 55%, #3a2c52 100%);
}
.gz-star {
  position: absolute;
  border-radius: 50%;
  background: #fff;
  animation: gzTwinkle 3s ease-in-out infinite;
}
@keyframes gzTwinkle { 0%,100% { opacity: .25; } 50% { opacity: .9; } }
.gz-word {
  position: absolute;
  transform: translate(-50%, -50%);
  padding: 5px 11px 6px;
  border-radius: 9px;
  background: rgba(255,255,255,0.10);
  border: 1.5px solid rgba(255,255,255,0.28);
  backdrop-filter: blur(2px);
  white-space: nowrap;
  z-index: 3;
  transition: border-color .12s ease, background .12s ease;
}
